<script>
/* ============================================================================
   AI AGENT — asks Claude with only the slices of data the question needs,
   and always computes a deterministic local answer first so the panel works
   even when the model call fails.
   ========================================================================== */

const SUGGESTIONS=[
 'What were my top and bottom performing campaigns for each channel?',
 'What is the single biggest thing costing me money right now?',
 'Which segment should get the next premium womens bag drop, and why?',
 'Build me a 4-campaign CRM plan for next month with segment, channel and expected revenue.',
 'Which leather should I lead with for men\'s bags, and to whom?',
 'Which audiences should I sync to Meta first, and what should the suppression be?',
 'Compare my channels — which one actually earns its budget?',
 'Forecast a 40,000 WhatsApp send.'
];

function buildContext(q){
  const t=(q||'').toLowerCase();
  const ctx={ period:D.meta.period||'current dataset', caveats:D.meta.caveats||[] };
  if(D.campaign){
    ctx.campaign_overall=D.campaign.overall;
    ctx.by_channel=D.campaign.by_channel;
    ctx.by_scope=D.campaign.by_scope;
    ctx.by_family=D.campaign.by_family;
  }
  if(D.findings) ctx.key_findings=D.findings;
  if(D.meta.consumers){ ctx.consumers=D.meta.consumers; ctx.consumer_revenue=D.meta.consumer_revenue; }

  const wantCamp=/campaign|top|bottom|best|worst|perform|roas|deliver|email|sms|rcs|whatsapp|channel|spend|cost|waste|budget|eoss|birthday|store|national/.test(t);
  const wantSeg =/segment|customer|buyer|who|target|audience|whom|drop|push|persona|loyal|repeat|tier|spend|meta|google|lookalike|suppress/.test(t);
  const wantProd=/product|collection|leather|category|colour|color|style|sku|stock|bag|wallet|belt|item|range|merch/.test(t);
  const wantFc  =/forecast|predict|expect|next month|plan|revenue from|how much will|project/.test(t);

  if(wantCamp && D.campaign)
    ctx.campaigns=D.campaign.campaigns.map(c=>({n:c.name,ch:c.channel,sc:c.scope,fam:c.family,
      base:c.base,dlv:c.delivered,dr:c.delivery_rate,resp:c.responders,sales:c.sales,cost:c.cost,roas:c.roas}));

  if(wantSeg && D.segments)
    ctx.segments=D.segments.map(s=>({name:s.name,size:s.size,revenue:s.revenue,rev_share:s.rev_share,
      avg_spend:s.avg_spend,repeat:s.repeat_rate,
      leathers:(s.top_leathers||[]).slice(0,3),
      collections:(s.top_collections_by_rev||[]).slice(0,3),
      styles:(s.top_products||[]).slice(0,3)}));
  else if(D.segments)
    ctx.segments_summary=D.segments.slice(0,8).map(s=>({name:s.name,size:s.size,revenue:s.revenue,
      avg_spend:s.avg_spend,top_leather:(s.top_leathers||[])[0]}));

  if(wantSeg && D.studio && D.studio.live){
    const lib={};
    Object.entries(D.studio.live).forEach(([id,v])=>{
      const e=SEGMENT_LIBRARY.find(x=>x.id===id);
      lib[e?e.n:id]={size:v.size,revenue:v.revenue,avg_spend:v.avg_spend,repeat:v.repeat_rate};
    });
    ctx.segment_library_live=lib;
    if(D.studio.next_best&&D.studio.next_best.length) ctx.next_best_category=D.studio.next_best;
  }

  if(wantProd && D.products){
    const P=D.products;
    ctx.products={category:P.by_category,leather:(P.by_leather||[]).slice(0,15),
      collection:(P.by_collection||[]).slice(0,15),style:(P.by_style||[]).slice(0,12),
      subcategory:(P.by_subcategory||[]).slice(0,12),color:(P.by_color||[]).slice(0,10),
      core_seasonal:P.by_core_seasonal,cat_leather:(P.category_leather_matrix||[]).slice(0,20)};
  } else if(D.products){
    ctx.products_summary={category:(D.products.by_category||[]).slice(0,8),
      leather:(D.products.by_leather||[]).slice(0,8),collection:(D.products.by_collection||[]).slice(0,8)};
  }

  if((wantFc||wantCamp) && D.forecast_rates)
    ctx.forecast_rates={overall:D.forecast_rates.overall,by_channel:D.forecast_rates.by_channel};

  return ctx;
}

function trimTo(ctx, maxKB){
  let s=JSON.stringify(ctx);
  if(s.length<=maxKB*1024) return {ctx,kb:s.length/1024};
  const order=['products','campaigns','segments','segment_library_live','forecast_rates','by_family'];
  const c=JSON.parse(s);
  for(const k of order){
    if(c[k]){
      if(Array.isArray(c[k]) && c[k].length>12) c[k]=c[k].slice(0,12);
      else delete c[k];
      s=JSON.stringify(c);
      if(s.length<=maxKB*1024) break;
    }
  }
  return {ctx:c,kb:s.length/1024};
}

/* ============================================================================
   OFFLINE ANSWER ENGINE
   Every answer below is computed in this browser from the dataset already
   loaded, so the Ask tab keeps working with no network at all. The AI call
   adds prose and nuance on top; these functions carry the numbers.
   ========================================================================== */

/* pull an audience size out of free text: "50000", "50k", "1.2 lakh" */
function _askNum(t){
  const re=/([\d][\d,]*(?:\.\d+)?)\s*(k\b|thousand|lakhs?\b|lacs?\b|cr\b|crores?)?/g;
  let m,best=null;
  while((m=re.exec(t))){
    let n=parseFloat(m[1].replace(/,/g,''));
    if(!isFinite(n)) continue;
    const u=(m[2]||'').trim().toLowerCase();
    if(/^k|^thousand/.test(u)) n*=1e3;
    else if(/^lakh|^lac/.test(u)) n*=1e5;
    else if(/^cr/.test(u)) n*=1e7;
    if(n>=500 && (best==null||n>best)) best=n;
  }
  return best;
}

/* match a channel named in the question against the real channel keys */
function _askChannel(t){
  if(!D.campaign) return null;
  const keys=Object.keys(D.campaign.by_channel||{});
  for(const k of keys) if(t.indexOf(String(k).toLowerCase())>=0) return k;
  const alias=[[/whats ?app/,/whats/i],[/e-?mail/,/mail/i],[/\btext\b/,/sms/i],[/\brcs\b/,/rcs/i]];
  for(const a of alias) if(a[0].test(t)){ const k=keys.find(x=>a[1].test(x)); if(k) return k; }
  return null;
}

/* channels ranked on ROAS, excluding ones that never actually delivered */
function _rankChannels(){
  if(!D.campaign) return [];
  return Object.entries(D.campaign.by_channel||{})
    .filter(e=>e[1].cost>0 && e[1].roas!=null && (e[1].delivery_rate==null||e[1].delivery_rate>0.05))
    .sort((a,b)=>b[1].roas-a[1].roas);
}

/* the same forecast model the Forecast tab uses, callable from text */
function _fc(ch,size,atvOverride){
  const R=D.forecast_rates; if(!R||!size) return null;
  const own=(ch && R.by_channel[ch] && R.by_channel[ch].rr_med) ? R.by_channel[ch] : null;
  const r=own||R.overall;
  if(!r||!r.rr_med) return null;
  const atv=atvOverride||r.atv_med||(R.overall&&R.overall.atv_med);
  if(!atv) return null;
  const fellBack=!!(ch && !own);
  /* if the named channel has its own delivery rate, always honour it — borrowing a
     blended 70% delivery for a channel that actually lands 3% is how you get a
     forecast that is confidently wrong */
  const chDr=(ch && R.by_channel[ch] && R.by_channel[ch].dr!=null)?R.by_channel[ch].dr:null;
  const dr=(chDr!=null?chDr:(r.dr||1)), reach=size*dr;
  const resp={low:reach*(r.rr_low||r.rr_med),med:reach*r.rr_med,high:reach*(r.rr_high||r.rr_med)};
  const cost=r.cost_per_delivered!=null?reach*r.cost_per_delivered:null;
  return { r:r,atv:atv,dr:dr,reach:reach,resp:resp,cost:cost,
    rev:{low:resp.low*atv,med:resp.med*atv,high:resp.high*atv},
    roas:cost?resp.med*atv/cost:null,
    fellBack:fellBack,
    basis:fellBack?'all channels blended':(ch?ch+' campaigns':'all channels blended'),
    conf:fellBack?'low':(r.n>=5?'high':r.n>=3?'medium':'low') };
}

const _STOP=/^(the|and|for|with|what|which|who|whom|should|next|this|that|from|have|has|are|was|were|will|would|can|get|got|our|out|into|about|why|how|does|did|but|not|any|all|more|most|give|make|build|show|tell|need|want|month|week|year|now|then|new|old|one|two|three|four|five|next)$/;
function _toks(t){
  return t.replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w.length>2 && !_STOP.test(w));
}

/* how well a behaviour segment matches the words in the question */
function _segScore(seg,toks){
  const bag=[seg.category,seg.name,seg.tier,
    ...(seg.top_categories||[]).map(x=>x.v),
    ...(seg.top_leathers||[]).map(x=>x.v),
    ...(seg.top_collections||[]).map(x=>x.v),
    ...(seg.top_collections_by_rev||[]).map(x=>x.v),
    ...(seg.top_products||[]).map(x=>x.v)].join(' ').toLowerCase();
  let s=0; toks.forEach(w=>{ if(bag.indexOf(w)>=0) s+=1; });
  return s;
}

/* ---- section writers ---- */

function _ansSegments(t,L){
  const segs=D.segments;
  if(!segs||!segs.length) return false;
  const toks=_toks(t);
  const wantHigh=/premium|luxury|high[- ]?end|expensive|full[- ]?price|top[- ]?tier|exotic|flagship|aspiration/.test(t);
  const wantLow=/entry|affordable|budget|low[- ]?ticket|starter|first[- ]?time|acquisition/.test(t);

  const scored=segs.map(s=>{
    let sc=_segScore(s,toks);
    if(wantHigh && /high/i.test(s.tier||'')) sc+=2;
    if(wantLow  && /low/i.test(s.tier||''))  sc+=2;
    return {s:s,sc:sc};
  }).sort((a,b)=> (b.sc-a.sc) || (b.s.revenue-a.s.revenue));

  const matched=scored.filter(x=>x.sc>0);
  const pick=(matched.length?matched:scored).slice(0,3);

  L.push(matched.length
    ? 'BEST-FIT SEGMENTS FOR THAT BRIEF'
    : 'YOUR HIGHEST-VALUE SEGMENTS');
  L.push(matched.length
    ? 'Ranked on how closely their actual purchase mix matches what you described, then on revenue.'
    : 'Nothing in the question narrowed it down, so these are ranked on revenue.');
  L.push('');

  pick.forEach((x,i)=>{
    const s=x.s;
    L.push((i+1)+'. '+s.name);
    L.push('   '+NUM(s.size)+' customers · '+INR(s.revenue)+' revenue ('+PCT(s.rev_share)+' of consumer revenue) · '
      +INRfull(s.avg_spend)+' average spend · '+PCT(s.repeat_rate)+' repeat');
    const le=(s.top_leathers||[]).slice(0,3);
    if(le.length) L.push('   Leather skew: '+le.map(l=>l.v+' ('+l.idx+'× the base rate)').join(', '));
    const co=(s.top_collections_by_rev||[]).slice(0,3);
    if(co.length) L.push('   Top collections by revenue: '+co.map(c=>c.v+' '+INR(c.rev)).join(', '));
    const pr=(s.top_products||[]).slice(0,3);
    if(pr.length) L.push('   Proven styles: '+pr.map(p=>p.v+' ('+NUM(p.units)+' units, '+INR(p.rev)+')').join('; '));
    if(x.sc>0) L.push('   Why: their own buying already indexes into what you asked about. This is a repeat purchase, not a cold pitch.');
    L.push('');
  });

  const ch=_rankChannels()[0];
  if(ch) L.push('Channel: '+ch[0]+' — best measured ROAS in your data at '+X(ch[1].roas)+' on '+INR(ch[1].cost)+' spend.');
  const c=pick[0]&&pick[0].s;
  if(c && D.forecast_rates){
    const f=_fc(ch?ch[0]:null,c.size);
    if(f) L.push('Size of the prize: all '+NUM(c.size)+' of them on '+(ch?ch[0]:'blended rates')+' models to '
      +INR(f.rev.med)+' (range '+INR(f.rev.low)+'–'+INR(f.rev.high)+'), confidence '+f.conf+'.');
  }
  L.push('');
  L.push('Caveat: these are built from purchase behaviour in the loaded POS data, not from opt-in lists. Check reachability before you size the send.');
  return true;
}

function _ansForecast(t,L){
  const R=D.forecast_rates;
  if(!R||!R.overall) return false;
  let ch=_askChannel(t);
  if(!ch){ const b=_rankChannels()[0]; ch=b?b[0]:null; }
  let size=_askNum(t), sizeNote='';
  if(!size){
    const s=(D.segments||[])[0];
    if(s){ size=s.size; sizeNote='  (no size given, so this uses your largest segment: '+s.name+')'; }
  }
  if(!size){ L.push('Give me an audience size and I can model it — e.g. "forecast a 40,000 WhatsApp send".'); return true; }

  const f=_fc(ch,size);
  if(!f){
    L.push('No usable response rate exists for '+(ch||'this combination')+' in the loaded data — most of those campaigns recorded zero responders, '
      +'which is normally a delivery or tracking failure rather than genuine disinterest. A forecast built on that would be meaningless.');
    return true;
  }
  L.push('FORECAST — '+NUM(size)+' sends on '+(ch||'blended rates')+sizeNote);
  L.push('');
  L.push('   EXPECTED   '+INR(f.rev.med));
  L.push('   RANGE      '+INR(f.rev.low)+' (low)  →  '+INR(f.rev.high)+' (high)');
  if(f.cost!=null) L.push('   EST. COST  '+INR(f.cost));
  if(f.roas)       L.push('   EXP. ROAS  '+X(f.roas));
  L.push('');
  L.push('How it gets there:');
  L.push('   '+NUM(size)+' sent → '+PCT(f.dr)+' delivered → '+NUM(f.reach)+' reached');
  L.push('   → '+PCT(f.r.rr_med,3)+' respond → '+NUM(f.resp.med)+' responders');
  L.push('   → ₹'+NUM(f.atv)+' average transaction value');
  L.push('');
  L.push('Built on '+f.r.n+' comparable campaign'+(f.r.n===1?'':'s')+' ('+f.basis+') · confidence '+f.conf+'.');
  if(f.fellBack){
    L.push('');
    L.push('⚠ '+ch+' has no usable response rate of its own — its campaigns recorded effectively zero responders, '
      +'so the response rate above is borrowed from all channels blended. '+ch+"'s own delivery rate of "+PCT(f.dr)+' is applied, which is why the number is small. '
      +'Treat this as an order of magnitude, not a forecast. Fix measurement on '+ch+' before you budget against it.');
  }
  if(f.conf==='low' && !f.fellBack) L.push('Thin evidence — run a small test send before committing budget.');
  L.push('Every rate here is observed in your own campaigns, not an industry benchmark.');
  return true;
}

function _ansPlan(t,L){
  const segs=D.segments||[];
  if(!segs.length) return false;
  const m=t.match(/(\d+)\s*[- ]?(campaign|send|touch|email|message)/);
  const n=Math.max(2,Math.min(6,m?parseInt(m[1],10):4));
  const chans=_rankChannels();
  if(!chans.length) return false;

  L.push(n+'-CAMPAIGN CRM PLAN — next cycle');
  L.push('Segments ranked on revenue, channel assigned on measured ROAS, revenue modelled on your own observed response rates.');
  L.push('');

  let total=0,totalCost=0;
  const weeks=['Week 1','Week 2','Week 3','Week 4','Week 5','Week 6'];
  for(let i=0;i<n && i<segs.length;i++){
    const s=segs[i], ch=chans[i%chans.length], f=_fc(ch[0],s.size);
    const lead=((s.top_leathers||[])[0]||{}).v;
    const coll=((s.top_collections_by_rev||[])[0]||{}).v;
    L.push(weeks[i]+' — '+s.name);

    L.push('   Channel    '+ch[0]+' ('+X(ch[1].roas)+' ROAS on your data)');
    L.push('   Push       '+(coll?coll+' — ':'')+(lead?'lead with '+lead+' — ':'')+'the range they already buy, one price tier up');
    if(f){
      L.push('   Expect     '+INR(f.rev.med)+' (range '+INR(f.rev.low)+'–'+INR(f.rev.high)+')'
        +(f.cost!=null?' on '+INR(f.cost)+' send cost':'')+' · confidence '+f.conf);
      total+=f.rev.med; if(f.cost) totalCost+=f.cost;
    } else {
      L.push('   Expect     not modellable — no usable response rate for this channel yet');
    }
    L.push('');
  }
  if(total){
    L.push('PLAN TOTAL: '+INR(total)+' expected revenue'
      +(totalCost?' on '+INR(totalCost)+' comms spend → '+X(total/totalCost)+' blended ROAS':'')+'.');

  const fnd=D.findings||{};

        +NUM(b.undelivered)+' contacts never received the message. Fix the sender setup first or this plan under-delivers by design.'));
    L.push('');
  }
  L.push('Suppression on every send: anyone who purchased in the last 14 days, and anyone already counted in a higher-value segment above — dedupe top-down so no customer gets two offers.');
  L.push('Offer cost is the lever that matters. Comms are cheap, discount depth is not. Hold discount flat and test creative instead.');
  return true;
}

function localAnswer(q){
  const t=(q||'').toLowerCase();
  const L=[];
  const camps=D.campaign?D.campaign.campaigns:null;

  /* intent routing — specific before general */
  const isPlan     = /\bplan\b|calendar|roadmap|next month|schedule|campaigns for|\d+\s*[- ]?campaign/.test(t);
  const isForecast = /forecast|predict|projection|expected revenue|how much (will|would|can)|what will .* (make|earn)/.test(t);
  const isAudience = /\bmeta\b|facebook|instagram|google ads|lookalike|\bsync\b|suppress|custom audience/.test(t);
  const isChannel  = /compare.*channel|channel.*(compare|scorecard|breakdown|performance)|which channel|email vs|sms vs|by channel/.test(t);
  const isSegment  = /segment|audience for|who should|whom|target|persona|buyer|\bdrop\b|which customers|cohort/.test(t);
  const isProduct  = /product|collection|leather|categor|colou?r|style|sku|range|merch|core|seasonal|bag|wallet|belt|which.*sell/.test(t);
  const isWasteQ   = /biggest|costing|waste|wasted|money|problem|leak|burn/.test(t);
  const isRank     = /top|bottom|best|worst|perform|rank/.test(t);
  const campWord   = /campaign|channel|send|blast|email|sms|rcs|whats ?app|push|roas|deliver|spend|budget|eoss|birthday/.test(t);

  try{
    if(isPlan     && _ansPlan(t,L))     return L.join('\n');
    if(isForecast && _ansForecast(t,L)) return L.join('\n');
    if(isAudience && _ansAudience(t,L)) return L.join('\n');
    if(isChannel && !(isRank && /campaign/.test(t)) && _ansChannels(t,L)) return L.join('\n');
    if(isSegment  && _ansSegments(t,L)) return L.join('\n');
    if(isProduct  && !campWord && _ansProducts(t,L)) return L.join('\n');
  }catch(e){ L.length=0; console.error('localAnswer',e); }

  if(camps && isRank && campWord){
    const byCh={}; camps.forEach(c=>(byCh[c.channel]=byCh[c.channel]||[]).push(c));
    L.push('TOP & BOTTOM CAMPAIGNS BY CHANNEL (ranked on ROAS, excluding campaigns that failed to deliver)\n');
    Object.keys(byCh).sort().forEach(ch=>{
      const all=byCh[ch];
      const broken=all.filter(c=>c.base>0&&c.delivered/c.base<0.05);
      const live=all.filter(c=>!(c.base>0&&c.delivered/c.base<0.05)&&c.cost>0&&c.roas!=null)
                    .sort((a,b)=>b.roas-a.roas);
      L.push(`${ch} — ${all.length} campaigns, ${INR((D.campaign.by_channel[ch]||{}).cost)} spend, ROAS ${X((D.campaign.by_channel[ch]||{}).roas)}`);
      if(!live.length){ L.push('   No rankable campaigns — all either had no spend or failed to deliver.'); }
      else{
        const b=live[0], w=live[live.length-1];
        L.push(`   BEST:  ${b.name}`);
        L.push(`          ${INR(b.sales)} sales on ${INR(b.cost)} → ROAS ${X(b.roas)} · ${PCT(b.delivery_rate)} delivered · ${NUM(b.responders)} responders`);
        if(live.length>1){
          L.push(`   WORST: ${w.name}`);
          L.push(`          ${INR(w.sales)} sales on ${INR(w.cost)} → ROAS ${X(w.roas)} · ${PCT(w.delivery_rate)} delivered · ${NUM(w.responders)} responders`);
        }
      }
      if(broken.length) L.push(`   ⚠ ${broken.length} campaign(s) excluded — under 5% delivery, ${INR(broken.reduce((a,c)=>a+c.cost,0))} spent reaching almost nobody. That is a delivery failure, not a weak campaign.`);
      L.push('');
    });
    return L.join('\n');
  }

  if(camps && /biggest|costing|waste|wasted|money|problem/.test(t)){
    const f=D.findings||{}, o=D.campaign.overall;
    if(o && o.offer_cost>0 && o.offer_cost/o.cost>0.4){
      L.push('BIGGEST COST LEVER: the incentive, not the channel');
      const r=o.offer_cost/o.cost;
      L.push(`Comms spend is only ${INR(o.cost)}, but offers/coupons cost ${INR(o.offer_cost)} — ${r>=1?r.toFixed(1)+'× the entire sending budget':Math.round(r*100)+'% of the entire sending budget'}.`);
      L.push(`That is what drops blended ROAS from ${X(o.roas)} to ${X(o.loaded_roas)}. With sending this cheap, discount depth is the main lever on profitability.`);
      L.push('');
    }
    (f.broken_delivery||[]).forEach(b=>{
      if(b.costs_money && b.wasted_spend>0){
        L.push(`PAID-FOR WASTE: ${b.channel}`);
        L.push(`${b.channel} is billed per attempted send, so ${NUM(b.undelivered)} undelivered messages still cost ${INR(b.wasted_spend)} (${PCT(b.pct_of_all_spend)} of comms spend).`);
      } else {
        L.push(`LOST REACH (not lost money): ${b.channel}`);
        L.push(`${b.channel} is billed per delivered message, so the failure cost almost nothing in budget.`);
      }
      L.push(`${b.campaigns} of ${b.of_total} campaigns delivered under 5% — ${NUM(b.base)} sends reached ${NUM(b.delivered)} inboxes.`);
      L.push(`The real loss is reach: ${NUM(b.undelivered)} intended contacts never heard from you.`);
      L.push('');
    });
    if(L.length) return L.join('\n');
  }

  /* nothing matched — say so plainly and show what can be asked, rather than
     dressing up an unrelated segment list as an answer */
  try{ _ansSnapshot(L); return L.join('\n'); }catch(e){ L.length=0; }
  return null;
}

function looksLikeError(r){
  if(r==null) return true;
  const s=typeof r==='string'?r:(r.text||r.message||JSON.stringify(r));
  return /api error|unable to connect|ENOTFOUND|ECONNREFUSED|timed? ?out|rate limit|too large|payload|\b5\d\d\b error/i.test(s)
      || s.trim().length<2;
}

const SYSTEM_RULES =
`You are a senior CRM analyst for HiDesign, an Indian premium leather goods brand. Answer using ONLY the dataset provided.

- Be direct and concise. Lead with the answer, then the evidence. No preamble.
- Cite actual numbers (revenue in lakhs/crores, ROAS as a multiple, affinity as "2.3x").
- Respect the caveats in the data. If it covers one month, never claim a seasonal or trend finding. If most customers appear once, do not treat repeat rate as loyalty. Campaign responders cannot be joined to POS purchases at customer level, so never claim a specific campaign drove a specific segment's purchases.
- Where a channel shows near-zero delivery or zero clicks, treat it as a technical/billing fault, not audience disinterest, and say so.
- If the data cannot answer, say what extra data is needed rather than guessing.
- Currency is INR; use lakh/crore notation.`;

async function doAsk(){
  const q=document.getElementById('q').value.trim();
  const ans=document.getElementById('ans'), status=document.getElementById('ask-status');
  const btn=document.getElementById('ask-go');
  if(!q){ ans.style.display='block'; ans.textContent='Type a question first.'; return; }
  ans.style.display='block'; ans.innerHTML='<span class="spin"></span>Thinking…';
  status.textContent=''; btn.disabled=true;

  const local=localAnswer(q);

  try{
    await RT.p;
    if(!aiReady()){
      ans.textContent=(local?local+'\n\n———\n':'')
        +'The written commentary needs Claude, and this view cannot reach it. The answer above was computed '
        +'here in your browser and stands on its own. Open the published version of this platform, or ask the '
        +'same question in chat — the HiDesign CRM Agent skill has this data and will answer in full.';
      return;
    }
    const attempts=[20,10,5];
    let result=null, lastErr='', netDown=false;
    for(const kb of attempts){
      const {ctx,kb:actual}=trimTo(buildContext(q),kb);
      status.textContent=`sending ${actual.toFixed(1)} KB of context…`;
      try{
        const r=await aiAsk(SYSTEM_RULES+'\n\nUser question: '+q,[JSON.stringify(ctx)]);
        if(!looksLikeError(r)){ result=(typeof r==='string')?r:(r.text||String(r)); break; }
        lastErr=typeof r==='string'?r:JSON.stringify(r);
      }catch(e){ lastErr=e.message||String(e); }
      /* DNS / socket level failure: shrinking the payload cannot help, so stop retrying */
      if(/ENOTFOUND|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ETIMEDOUT|unable to connect|failed to fetch|networkerror/i.test(lastErr)){
        netDown=true; break;
      }
    }
    if(result){ ans.textContent=result; status.textContent=''; }
    else{
      status.textContent='';
      const diag = netDown
        ? 'The answer above was computed here in your browser. The AI layer that adds the written commentary could not be reached — '
          + 'that is a network fault on this machine, not a problem with your data.\n\n'
          + 'Try, in order:  reload this view  ·  switch to a mobile hotspot  ·  turn off VPN or proxy  ·  restart Claude.\n'
          + 'If a hotspot works but office Wi-Fi does not, ask IT to allow api.anthropic.com.'
        : 'The answer above was computed here in your browser. The AI layer did not return a usable response'
          + (lastErr?' ('+String(lastErr).slice(0,120)+')':'') + '.';
      ans.textContent = (local ? local + '\n\n———\n' : '')
        + diag
        + '\n\nEverything else keeps working — every tab, and the answer above, is calculated locally and needs no connection.';
    }
  }catch(err){
    status.textContent='';
    ans.textContent=(local?local+'\n\n———\n':'')+'Error: '+(err.message||err);
  }finally{ btn.disabled=false; }
}

<script>
/* ============================================================================
   AGENTIC LAYER — Customer 360 (single customer view + next best action)
   and Audiences & ads (build, suppress and export paid-media audiences).

function segName(id){ const e=SEGMENT_LIBRARY.find(x=>x.id===id); return e?e.n:id; }
function segEntry(id){ return SEGMENT_LIBRARY.find(x=>x.id===id)||null; }

function renderC360(){
  const el=document.getElementById('p-c360');
  if(!C360||!C360.custs||!C360.custs.length){
    el.innerHTML='<div class="panel"><div class="empty">The single customer view needs a sales file. Load one on the <b>Load data</b> tab — '

    +'and — when the customer master is loaded — loyalty tier, city and contactability, all joined on <b>CustomerCode</b>. '
    +'Search by customer code or name.</p>'
    +'<div class="fgrid"><div><label>Customer code or name</label><input type="search" id="c360-q" placeholder="e.g. 100234 or Sharma"></div>'

      return code===q||code.includes(q)||name.includes(q);
    }).slice(0,8);
    if(!hits.length){ mEl.innerHTML='<div class="note">No customer matched. Codes come from the CustomerCode column of the sales file.</div>'; return; }
    mEl.innerHTML='<div class="note" style="margin-top:9px">'+hits.length+' match(es):</div>'
      +hits.map((c,i)=>'<button class="matchbtn" data-i="'+i+'">'+esc(String(c.cust))+' · '
        +esc(short((c.rows&&c.rows[0])?c.rows[0].cname:'',30))+' · '+INR(c.spend)+'</button>').join('');
    mEl.querySelectorAll('.matchbtn').forEach(b=>b.onclick=()=>showC360(hits[+b.dataset.i]));
    if(hits.length===1) showC360(hits[0]);
  };
  document.getElementById('c360-go').onclick=go;

function showC360(c){
  const out=document.getElementById('c360-out');
  const name=(c.rows&&c.rows[0])?c.rows[0].cname:'';
  const paid=(c.rows||[]).filter(r=>r.amt>0);
  const byRev=(f)=>{ const o={}; paid.forEach(r=>{ const k=f(r); if(k) o[k]=(o[k]||0)+r.amt; });
    return Object.entries(o).sort((a,b)=>b[1]-a[1]); };
  const cats=byRev(r=>r.cat), leas=byRev(r=>r.leather), colls=byRev(r=>r.coll), styles=byRev(r=>r.style);
  const domCat=cats.length?cats[0][0]:null;

  /* next best action */
  const nb=(D.studio&&D.studio.next_best)?D.studio.next_best.find(n=>n.from===domCat):null;
  const owned=new Set(cats.map(e=>e[0]));
  let nbaProduct = nb ? (owned.has(nb.to) ? null : nb) : null;
  if(nb && owned.has(nb.to)){
    const alt=(D.studio.next_best||[]).find(n=>n.from===domCat===false?false:(n.from===domCat&&!owned.has(n.to)));
    nbaProduct = alt||null;
  }

  /* channel recommendation, in order of evidence */
  let channel, chWhy;
  if(c.uhni||c.hni){ channel='Concierge WhatsApp / personal call'; chWhy='top-spend customer — never mass creative'; }
  else if(c.hasWa){ channel='WhatsApp'; chWhy='opted in on the customer master'; }
  else if(c.hasEmail){ channel='Email'; chWhy='valid email on record'; }
  else if(c.hasMobile){ channel='SMS'; chWhy='valid mobile on record'; }
  else { const e0=segEntry((c.segIds||[])[0]); channel=e0?e0.ch:'SMS';
         chWhy='no contactability data loaded — this is the segment default, load a customer master to route properly'; }

  const sendTime='WhatsApp 11:00–13:00 or 19:00–21:00 · Email Tue–Thu ~10:00 · SMS 18:00–20:00';

  /* cautions */
  const cautions=[];
  if(c.recency!=null&&c.recency<=30&&domCat) cautions.push('Bought '+esc(domCat)+' within the last 30 days — do not re-sell the same category; attach an adjacent one instead.');
  if((c.segIds||[]).includes('val-discount')) cautions.push('Discount-trained buyer — never the lead audience for a full-price launch.');
  if((c.segIds||[]).includes('val-fullprice')) cautions.push('Full-price buyer — suppress from EOSS sends; discounting them destroys margin you already had.');
  if((c.segIds||[]).includes('lc-lapsed-90')) cautions.push('Lapsed 90+ days — route into the win-back ladder, newness first, incentive only on the third touch.');

  let h='<div class="c360"><h3>'+esc(name||('Customer '+c.cust))+' <span class="note" style="margin:0">· code '+esc(String(c.cust))+'</span></h3>';
  h+='<div class="kpis" style="margin-top:10px">'
    +kpi('Lifetime spend (window)',INR(c.spend), c.uhni?'UHNI — top 0.1%':(c.hni?'HNI — top 1%':(c.ltvHigh?'High LTV — top 20%':'')))
    +kpi('Bills',NUM(c.nbills),(c.units||0)+' items')
    +kpi('Avg bill',INR(c.spend/(c.nbills||1)),c.domTier?c.domTier+' price tier':'')
    +kpi('Last purchase',c.last?String(c.last.toISOString?c.last.toISOString().slice(0,10):c.last):'—',
         c.recency!=null?c.recency+' days ago':'')
    +'</div>';

  const idbits=[];
  if(c.mTier) idbits.push('Loyalty: <b>'+esc(c.mTier)+'</b>');
  if(c.mCity) idbits.push('City: <b>'+esc(c.mCity)+'</b>');
  idbits.push('Reachable: <b>'+[(c.hasEmail?'Email':null),(c.hasMobile?'SMS':null),(c.hasWa?'WhatsApp':null)].filter(Boolean).join(' + ')
    +'</b>'+((c.hasEmail||c.hasMobile||c.hasWa)?'':'unknown — load a customer master'));
  if(c.realisation!=null) idbits.push('Realisation vs MRP: <b>'+PCT(c.realisation,0)+'</b>');
  h+='<div class="r" style="font-size:12px;color:var(--slate);margin-bottom:8px">'+idbits.join(' · ')+'</div>';

  const chipRow=(label,arr,n)=>arr.length?'<div class="r" style="margin-top:6px">'+label+'</div><div class="chips">'
    +arr.slice(0,n).map(([v,rv])=>'<span class="chip">'+esc(v)+' <b>'+INR(rv)+'</b></span>').join('')+'</div>':'';
  h+=chipRow('Categories bought (design affinity — paid lines only)',cats,5);
  h+=chipRow('Leather preference',leas,4);
  h+=chipRow('Collections',colls,4);
  h+=chipRow('Styles',styles,4);

  if(c.segIds&&c.segIds.length)
    h+='<div class="r" style="margin-top:8px">Member of '+c.segIds.length+' segments</div><div class="chips">'
      +c.segIds.map(id=>'<span class="chip">'+esc(segName(id))+'</span>').join('')+'</div>';

  h+='<div class="alert good" style="margin-top:12px"><h4>Next best action</h4><p>';
  if(nbaProduct){
    h+='Send <b>'+esc(nbaProduct.to)+'</b> ('+PCT(nbaProduct.conf,0)+' measured attach rate from '+esc(nbaProduct.from)+' buyers'
      +(leas.length?', in <b>'+esc(leas[0][0])+'</b> leather — their demonstrated preference':'')+'), 7–14 days after the last purchase. ';
  } else if(domCat){
    h+='Dominant category is <b>'+esc(domCat)+'</b>'
      +(leas.length?' in <b>'+esc(leas[0][0])+'</b> leather':'')
      +'. No unowned next-best category clears the evidence bar — lead with newness in that category and leather. ';
  } else {
    h+='Not enough paid history to recommend a product — treat as a first-time buyer: brand story, leather care, second-purchase nudge. ';
  }
  h+='Channel: <b>'+esc(channel)+'</b> ('+chWhy+'). Default windows: '+sendTime+' — these are starting defaults, not measured; per-customer send-time optimisation needs the customer-level send log.</p></div>';

  if(cautions.length) h+='<div class="alert warn"><h4>Suppression rules for this customer</h4><p>'+cautions.join('<br>')+'</p></div>';
  h+='</div>';
  out.innerHTML=h;
}

const RECIPES=[
  { id:'val-ltv-high',  use:'Meta / Google Lookalike seed', why:'Top 20% by spend — the strongest seed you can give the ad platforms to find more like them.' },
  { id:'val-hni',       use:'High-value Custom Audience', why:'Top 1% — exclusions for mass promos, VIP for launches. Also the seed for a 1% Lookalike.' },
  { id:'lc-lapsed-90',  use:'Retargeting / win-back', why:'Lapsed 90+ — paid retargeting on Meta while Email/SMS run the win-back ladder.' },
  { id:'lc-active-30',  use:'SUPPRESSION list', why:'Bought within 30 days — exclude from acquisition and promo campaigns to stop paying to reach converted customers.' },
  { id:'val-fullprice', use:'Full-price launch audience', why:'Never sees EOSS creative; first in line for every drop.' },
  { id:'val-discount',  use:'EOSS-only audience', why:'Sale-triggered comms and outlet stock; exclude from launch campaigns.' },
  { id:'lc-first',      use:'Prospecting exclusion + welcome', why:'First-time buyers — exclude from prospecting (already acquired) and run the welcome journey.' }
];

function audienceMembers(segId, opts){
  if(!C360||!C360.custs) return [];
  let grp=C360.custs.filter(c=>(c.segIds||[]).includes(segId));
  if(opts.exRecent)   grp=grp.filter(c=>!(c.recency!=null&&c.recency<=30));
  if(opts.exDiscount) grp=grp.filter(c=>!(c.segIds||[]).includes('val-discount'));
  return grp;
}

function contactsFor(c){
  const ct=(D.studio&&D.studio.contacts)?D.studio.contacts.get(String(c.cust).trim()):null;
  return { email:ct&&ct.email&&/@/.test(ct.email)?ct.email:'', phone:ct&&ct.mobile?String(ct.mobile).replace(/\D/g,''):'' };
}

function audienceCSV(grp, fmt){
  if(fmt==='meta'){
    const lines=['email,phone,fn'];
    grp.forEach(c=>{ const ct=contactsFor(c);
      const name=((c.rows&&c.rows[0])?c.rows[0].cname:'').split(/\s+/)[0]||'';
      lines.push([ct.email,ct.phone?(ct.phone.length===10?'91'+ct.phone:ct.phone):'',name].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
    });
    return lines.join('\n');
  }
  if(fmt==='google'){
    const lines=['Email,Phone'];
    grp.forEach(c=>{ const ct=contactsFor(c);
      lines.push([ct.email,ct.phone?'+91'+ct.phone.slice(-10):''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
    });
    return lines.join('\n');
  }
  const lines=['CustomerCode,CustomerName,LifetimeSpend,Bills,RecencyDays'];
  grp.forEach(c=>lines.push([String(c.cust),((c.rows&&c.rows[0])?c.rows[0].cname:''),Math.round(c.spend),c.nbills,c.recency==null?'':c.recency]
    .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')));
  return lines.join('\n');
}

/* ---------------------------------------------------------------------------
   Runtime bridge. This one file runs three ways — opened from disk, as a
   Cowork desktop artifact, and as a published claude.ai Artifact — and each
   offers a different way to hand you a file or to reach Claude. Both are
   resolved once, here, and everything else calls through RT. Where neither
   exists the platform still works; only these two affordances change shape.
   ------------------------------------------------------------------------ */
const RT = { dl:null, sample:null, p:null };
RT.p = (async () => {
  try{
    if(!(typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function')) return;
    const [d, sm] = await Promise.all([
      Promise.resolve(window.claude.use('downloads')).catch(() => null),
      Promise.resolve(window.claude.use('sample')).catch(() => null)
    ]);
    RT.dl = d; RT.sample = sm;
  }catch(e){}
})();

function aiReady(){ return !!(RT.sample || (window.cowork && typeof window.cowork.askClaude === 'function')); }
async function aiAsk(rules, payloads){
  if(RT.sample){
    const r = await RT.sample(rules + '\n\nDATA\n' + payloads.join('\n'));
    return (r && r.text) ? r.text : '';
  }
  if(window.cowork && typeof window.cowork.askClaude === 'function')
    return await window.cowork.askClaude(rules, payloads);
  throw new Error('No AI runtime in this view.');
}

function blobSave(name, text){
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return true;
  }catch(e){ return false; }
}

/* Last resort: some views will not let a page write a file at all. Rather
   than losing the export, put it on screen to copy. */
function csvFallback(name, text){
  const w = document.createElement('div');
  w.style.cssText = 'position:fixed;inset:0;background:rgba(43,26,16,.6);z-index:9999;'
    + 'display:flex;align-items:center;justify-content:center;padding:20px';
  w.innerHTML = '<div style="background:var(--card);border-radius:10px;padding:16px;max-width:820px;'
    + 'width:100%;max-height:82vh;display:flex;flex-direction:column;gap:10px">'
    + '<h2 style="margin:0">' + esc(name) + '</h2>'
    + '<p class="note" style="margin:0">This view cannot write a file to disk. Copy everything below and '
    + 'paste it into a blank sheet — it is comma-separated, so Excel will split the columns for you.</p>'
    + '<textarea readonly id="csv-dump" style="flex:1;min-height:320px;width:100%;font-family:monospace;font-size:11px"></textarea>'
    + '<div class="actions" style="margin:0"><button class="act" id="csv-copy">Copy all</button>'
    + '<button class="act sec" id="csv-close">Close</button></div></div>';
  document.body.appendChild(w);
  const ta = w.querySelector('#csv-dump');
  ta.value = text;
  w.querySelector('#csv-copy').onclick = () => {
    try{ navigator.clipboard.writeText(text); }catch(e){ ta.select(); try{ document.execCommand('copy'); }catch(e2){} }
  };
  w.querySelector('#csv-close').onclick = () => w.remove();
}

function downloadText(name, text){
  RT.p.then(() => {
    if(RT.dl){
      RT.dl.save({ filename:name, data:text })
        .catch(e => { if(!e || e.code !== 'declined') csvFallback(name, text); });
      return;
    }
    if(!blobSave(name, text)) csvFallback(name, text);
  });
  return true;
}

  const recipeRows=RECIPES.map(r=>{ const L=D.studio.live?D.studio.live[r.id]:null;
    return { seg:segName(r.id), use:r.use, size:L?L.size:null, rev:L?L.revenue:null, why:r.why }; });
  h+='<div class="panel"><h2>Recommended audience recipes</h2>'
    +table(recipeRows,[
      {key:'seg',label:'Segment'},{key:'use',label:'Use as'},
      {key:'size',label:'Size',num:1,fmt:v=>v==null?'not live yet':NUM(v)},
      {key:'rev',label:'Revenue',num:1,fmt:v=>v==null?'—':INR(v)},
      {key:'why',label:'Why'}],{scroll:false})
    +'<div class="note">Standard set-up: sync High-LTV as a Lookalike seed, Lapsed-90 as retargeting, Recent-30 as a universal suppression, and exclude all existing customers from prospecting.</div></div>';

  h+='<div class="panel"><h2>Build & export</h2><div class="fgrid">'
    +'<div><label>Segment</label><select id="aud-seg">'
    +live.map(e=>'<option value="'+e.id+'">'+esc(e.n)+' ('+NUM(D.studio.live[e.id].size)+')</option>').join('')
    +'</select></div>'
    +'<div><label>Format</label><select id="aud-fmt">'
    +'<option value="meta">Meta Custom Audience (email, phone)</option>'
    +'<option value="google">Google Customer Match (Email, Phone)</option>'
    +'<option value="codes">CustomerCode list (any system)</option></select></div>'
    +'<div><label style="margin-bottom:7px">Suppression</label>'
    +'<label style="font-size:12px;color:var(--espresso)"><input type="checkbox" id="aud-exrecent" style="width:auto;margin-right:5px">exclude bought ≤30 days</label>'
    +'<label style="font-size:12px;color:var(--espresso)"><input type="checkbox" id="aud-exdisc" style="width:auto;margin-right:5px">exclude discount-trained</label></div>'
    +'<div><button class="act" id="aud-dl">Download CSV</button></div>'
    +'<div><button class="act sec" id="aud-copy">Copy to clipboard</button></div>'
    +'</div><div id="aud-out" class="note"></div></div>';

  h+='<div class="panel"><h2>How to use these on the ad platforms</h2><ul class="caveats">'
    +'<li><b>Meta:</b> Ads Manager → Audiences → Create → Custom Audience → Customer list → upload the CSV. Then Create → Lookalike from the High-LTV audience (start at 1%). Add the Recent-30 list as an exclusion on every acquisition campaign.</li>'
    +'<li><b>Google:</b> Tools → Shared library → Audience manager → Customer list. Use High-Value for observation/bidding, Lapsed for RLSA/Display retargeting, and exclude converters from prospecting.</li>'
    +'<li><b>Match rates:</b> expect 40–70% on email+phone lists. The unmatched remainder is why the customer master needs both fields populated at billing.</li>'
    +'<li><b>Refresh cadence:</b> re-export after every monthly rebuild — lapsed and recent lists move the most.</li>'
    +'</ul></div>';
  el.innerHTML=h;

  const doBuild=()=>{
    const segId=document.getElementById('aud-seg').value;
    const fmt=document.getElementById('aud-fmt').value;
    const grp=audienceMembers(segId,{exRecent:document.getElementById('aud-exrecent').checked,
                                     exDiscount:document.getElementById('aud-exdisc').checked});
    return { grp, fmt, segId };
  };
  document.getElementById('aud-dl').onclick=()=>{
    const {grp,fmt,segId}=doBuild(); const out=document.getElementById('aud-out');
    if(!grp.length){ out.textContent='0 customers after suppression — nothing to export.'; return; }
    const csv=audienceCSV(grp,fmt);
    const ok=downloadText('hidesign-audience-'+segId+'-'+fmt+'.csv',csv);
    const withContact=fmt==='codes'?grp.length:grp.filter(c=>{const ct=contactsFor(c);return ct.email||ct.phone;}).length;
    out.textContent=(ok?'Downloaded ':'Download blocked by the viewer — use Copy instead. ')
      +grp.length+' customers'+(fmt!=='codes'?' ('+withContact+' with a matchable email/phone)':'')+'.';
  };
  document.getElementById('aud-copy').onclick=async()=>{
    const {grp,fmt}=doBuild(); const out=document.getElementById('aud-out');
    if(!grp.length){ out.textContent='0 customers after suppression — nothing to copy.'; return; }
    try{ await navigator.clipboard.writeText(audienceCSV(grp,fmt));
      out.textContent='Copied '+grp.length+' rows to the clipboard — paste into a .csv file.'; }
    catch(e){ out.textContent='Clipboard blocked: '+(e.message||e); }
  };
}

<script>
/* ============================================================================
   UNIFIED LOAD DATA — one set of files feeds every engine on the platform:
   dashboard analytics, the 66-segment library, Customer 360 and audiences.
   ========================================================================== */
const FILE_SPECS = {
  sales:     { label:'Sales / POS report  (required)',
               hint:"SalesReport(&lt;Mon&gt;'YY).xlsx — one row per line item; header found automatically. You can select SEVERAL sales files at once (e.g. Apr'25–Mar'26 + Apr'26–Jun'26) and they are combined.",
               expect:['BillDate','CustomerCode','Amount','Quantity','CAT_IM'] },
  items:     { label:'Item master  (strongly recommended)',
               hint:'Item Master_&lt;DDMonYY&gt;.xlsx — supplies collection, leather, occasion, gender and MRP.',
               expect:['Product Code','Collection','Leather','Gender','MRP'] },
  customers: { label:'Customer master  (optional)',
               hint:'Any export keyed on CustomerCode with loyalty tier, city, email/mobile/WhatsApp.',
               expect:['CustomerCode','Tier','City','Email','Mobile'] },
  campaigns: { label:'Campaign performance report  (optional)',
               hint:"CampaignPerformanceReport_&lt;MON&gt;'YY.xlsx — one row per campaign. Drives Overview, Campaigns and Forecast.",
               expect:['CampaignName','channel','TotalBase','Delivered','ResponderSales','CommunicationCost'] }
};
const staged = {};

function renderUpload(){
  let h='<div class="panel"><h2>Load your data — one drop rebuilds the whole platform</h2>'
   +'<p style="font-size:12.5px;color:var(--slate);margin:0 0 4px">The sales file rebuilds the segment library, Customer 360, audiences, auto segments and products. '
   +'The campaign file rebuilds Overview, Campaigns and the Forecast. '
   +'<b>.xlsx is read directly in your browser</b> — nothing is uploaded anywhere, and no file leaves this machine. .csv works too. '
   +'Header rows, the Excel date transposition in the sales export, sales returns and institutional accounts are all handled automatically.</p>'
   +'<div class="note">The sales file alone builds around half the library. Adding the item master unlocks occasion, gender, MRP and collection; '
   +'the customer master unlocks loyalty, city, reachability — and makes the audience exports matchable by Meta and Google.</div>'
   +'<div class="note" style="margin-top:8px"><b>No row limit and no column limit.</b> Files are streamed while they are read, so a 12-month or '
   +'multi-year pull, a file larger than your machine\'s memory could once hold as a single block, or a CSV past Excel\'s own 1,048,576-row ceiling '
   +'all load. Very large files take a few minutes and the row counter moves while they do — the only real ceiling left is the memory this browser tab '
   +'is given, so close heavy tabs first if you are loading several million rows.</div></div>';

  h+='<div class="panel"><h2>Files</h2><div class="grid3">';
  Object.entries(FILE_SPECS).forEach(([k,s])=>{
    h+='<div class="drop" id="drop-'+k+'"><label>'+s.label+'</label>'
      +'<input type="file" id="file-'+k+'" accept=".xlsx,.xlsm,.csv"'+(k==='sales'?' multiple':'')+'>'
      +'<div class="hint">'+s.hint+'</div>'
      +'<div class="fstat" id="stat-'+k+'">Not loaded</div></div>';
  });
  h+='</div>'
   +'<div class="note" style="margin-top:10px"><label style="cursor:pointer"><input type="checkbox" id="keepall"> '
   +'Keep every column, including ones no screen reads</label> — columns the platform can never use are dropped as the file streams, which is what '
   +'lets very large files fit. Dropped names are always listed under the file. Tick this only if you have added a column and want it held in memory.</div>'
   +'<div class="actions"><button class="act" id="rebuild">Build the platform</button>'
   +'<button class="act sec" id="clear">Clear</button>'
   +'<span class="note" id="ustatus" style="margin-left:10px"></span></div><div id="ulog"></div></div>';

  h+='<div class="panel"><h2>What each file needs</h2>'
   +table([
     {f:'Sales / POS (Wondersoft)',need:'CustomerCode, Amount, CAT_IM',opt:'BillDate, Bill No, Quantity, Bill Type, LEATHER_IM, COLL_IM, STYLE_IM, SUBCAT_IM, CFND_IM, Color, Store'},
     {f:'Item master',need:'Product Code',opt:'Collection, Leather, Core / Seasonal, Gender, OCCASION, MRP'},
     {f:'Customer master (Easy Rewards / POS)',need:'CustomerCode',opt:'Loyalty Tier, City, State, Gender, Email, Mobile, WhatsApp opt-in'},
     {f:'Campaign report (agency / Engage 360)',need:'CampaignName, channel, TotalBase, Delivered, Responder, ResponderSales, CommunicationCost',opt:'OfferCost, Clicked, segmentname, IncentiveValue, CampaignScheduleDate'}
   ],[{key:'f',label:'File'},{key:'need',label:'Required'},{key:'opt',label:'Optional but valuable'}],{scroll:false})
   +'<div class="note">Column names are matched loosely, so minor renames are fine. Anything missing is reported on Coverage and Data notes rather than silently ignored.</div></div>';

  document.getElementById('p-upload').innerHTML=h;

  Object.keys(FILE_SPECS).forEach(k=>{
    const inp=document.getElementById('file-'+k);
    inp.addEventListener('change',()=>handleFile(k,[...inp.files]));
    const drop=document.getElementById('drop-'+k);
    ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>{ const fl=[...e.dataTransfer.files]; if(fl.length) handleFile(k,fl); });
  });
  document.getElementById('rebuild').onclick=rebuild;
  document.getElementById('clear').onclick=()=>{
    Object.keys(staged).forEach(k=>delete staged[k]);
    Object.keys(FILE_SPECS).forEach(k=>{ setStat(k,'Not loaded',''); const i=document.getElementById('file-'+k); if(i)i.value=''; });
    D={ meta:{caveats:[],period:null}, notes:[] }; C360=null;
    renderAll();
    document.getElementById('ustatus').textContent='Cleared.';
    document.getElementById('ulog').innerHTML='';
  };
}

function setStat(k,msg,cls){ const e=document.getElementById('stat-'+k);
  if(e){ e.textContent=msg; e.className='fstat '+(cls||''); } }

async function handleFile(key,files){
  if(files && !Array.isArray(files)) files=[files];
  if(!files || !files.length) return;
  if(key!=='sales' && files.length>1) files=files.slice(0,1);
  const prune = !document.getElementById('keepall') || !document.getElementById('keepall').checked;
  try{
    const spec=FILE_SPECS[key];
    const all=[]; const details=[]; let droppedAll=[]; let rawAll=0;
    for(let fi=0; fi<files.length; fi++){
      const file=files[fi];
      const pfx = files.length>1 ? '('+(fi+1)+'/'+files.length+') '+file.name+' — ' : file.name+' — ';
      setStat(key, pfx+'opening…','');
      const t0=Date.now();
      const res = await readTable(file, spec.expect, {
        prune: prune,
        status: m => setStat(key, pfx+m+' ('+all.length.toLocaleString('en-IN')+' banked)','')
      });
      if(!res.rows.length) throw new Error('No data rows found below the header in '+file.name+'.');
      if(key==='sales') normalizeDates(res.rows);
      for(let i=0;i<res.rows.length;i++) all.push(res.rows[i]);
      res.rows.length=0;                       /* let the per-file array go */
      rawAll += res.rawRows;
      droppedAll = droppedAll.concat(res.dropped);
      details.push(file.name+' — '+(res.rawRows).toLocaleString('en-IN')+' sheet rows → '
        +(all.length).toLocaleString('en-IN')+' cumulative (header row '+(res.headerIndex+1)+', '
        +res.hits+'/'+spec.expect.length+' columns matched, '+res.columns+' columns kept, '
        +Math.round((Date.now()-t0)/1000)+'s)');
      await new Promise(r=>setTimeout(r,0));
    }
    staged[key]={rows:all,name:files.map(f=>f.name).join(' + ')};
    const uniqDrop=[...new Set(droppedAll)];
    let msg='✓ '+all.length.toLocaleString('en-IN')+' rows from '+files.length+' file(s): '+details.join(' · ');
    if(uniqDrop.length) msg+=' · dropped '+uniqDrop.length+' unused column(s): '+uniqDrop.slice(0,12).join(', ')
      +(uniqDrop.length>12?' …':'')+' (tick "keep every column" above to retain them)';
    setStat(key,msg,'ok');
  }catch(e){
    delete staged[key];
    console.error(e);
    setStat(key,'✕ '+(e && e.message ? e.message : e),'bad');
  }
}

function rebuild(){
  const st=document.getElementById('ustatus'), log=document.getElementById('ulog');
  if(!staged.sales && !staged.campaigns){
    st.textContent='Load the sales file (and/or the campaign report) first.'; return; }
  const nRows=(staged.sales?staged.sales.rows.length:0)+(staged.campaigns?staged.campaigns.rows.length:0);
  st.innerHTML='<span class="spin"></span>Building from '+nRows.toLocaleString('en-IN')+' rows…'
    +(nRows>750000?' <span class="note">Large file — this pass runs in one go and can take a minute or two per million rows. '
      +'The tab will sit still while it works; that is the calculation, not a hang.</span>':'');
  setTimeout(()=>{
    try{
      const nd={ meta:{caveats:[],period:'Uploaded data'}, notes:[] };
      const notes=[];
      let newC360=null;

      if(staged.campaigns){
        const ca=analyzeCampaigns(staged.campaigns.rows);
        if(!ca) throw new Error('Could not find the required campaign columns (need at least CampaignName and a base/audience column).');
        nd.campaign=ca;
        nd.forecast_rates=forecastRates(ca.campaigns);
        nd.findings=campaignFindings(ca.campaigns);
        nd.meta.campaigns=ca.campaigns.length;
        nd.meta.caveats.push('Campaign reports carry segment names, not customer lists, so campaign response cannot be joined to POS purchases at customer level.');
        nd.meta.caveats.push('Without holdout groups, every ROAS here is gross — it cannot separate campaign-driven sales from purchases that would have happened anyway.');
        notes.push('Campaigns: '+ca.campaigns.length+' rows from '+staged.campaigns.name+'.');
      }

      if(staged.sales){
        const sa=analyzeSales(staged.sales.rows, staged.items?staged.items.rows:null);
        if(sa){
          Object.assign(nd.meta,sa.meta);
          nd.meta.caveats=nd.meta.caveats.concat(sa.meta.notes||[]);
          nd.segments=sa.segments; nd.products=sa.products; nd.daily=sa.daily;
          notes.push('Sales: '+sa.meta.sales_rows.toLocaleString('en-IN')+' consumer rows, '
            +sa.meta.consumers.toLocaleString('en-IN')+' customers, '+sa.segments.length+' auto segments.');
        }
        const prep=prepareSales(staged.sales.rows, staged.items?staged.items.rows:null);
        if(!prep && !sa) throw new Error('Could not find the required sales columns — a customer code and an amount are the minimum.');
        if(prep){
          nd.studio=buildStudio(prep.cons, prep.custs, prep.nMonths,
            staged.customers?staged.customers.rows:null);
          nd.stores=buildStores(prep.cons, prep.custs);
          if(nd.stores) notes.push('Stores: '+nd.stores.stores.length+' store(s) with customer-level history'
            +(nd.stores.hasStore?'':' — no store column found, so all sales are grouped as one'));
          nd.notes=prep.notes; nd.institutional=prep.institutional;
          if(!nd.meta.consumers) Object.assign(nd.meta,prep.meta);
          newC360={ custs:prep.custs };
          notes.push('Segment library: '+statusCounts(nd.studio).live+' live segments.');
          if(staged.items) notes.push('Item master: '+staged.items.rows.length.toLocaleString('en-IN')+' SKUs used for enrichment.');
          if(staged.customers) notes.push('Customer master: '+staged.customers.rows.length.toLocaleString('en-IN')+' records joined on CustomerCode.');
        }
      }

      D=nd; C360=newC360;
      renderAll();
      st.textContent='Done — the whole platform rebuilt from your files.';
      log.innerHTML='<div class="alert good" style="margin-top:12px"><h4>Built successfully</h4><p>'
        +notes.map(esc).join('<br>')
        +'<br>Start with <b>Overview</b> and <b>Coverage</b>; then <b>Customer 360</b> and <b>Audiences &amp; ads</b>.</p></div>';
    }catch(e){
      st.textContent='';
      log.innerHTML='<div class="alert" style="margin-top:12px"><h4>Could not build</h4><p>'+esc(e.message||e)
        +'<br><br>The previous data is still loaded. Check that the file is the right export and that its header row is intact.</p></div>';
      console.error(e);
    }
  },40);
}

</script>
<script>
/* ============================================================================
   STORE VIEW · REPEAT ANALYSIS · CUSTOMER JOURNEY · MESSAGE COMPOSER

   Everything here is derived from lines already parsed on the Load data tab —
   no new file is required. A store is whatever the sales export puts in its
   Store / Location / Branch / Site / Outlet column.

   Two definitions are used throughout and both are shown, because they answer
   different questions:
     · repeat AT A STORE   — 2+ separate bills rung up at that store. This is
                             the store's own relationship metric.
     · repeat WITH THE BRAND — 2+ bills anywhere. A customer can be a one-timer
                             at a store and a loyal HiDesign buyer overall.
   Returns are already netted out upstream, so a return does not create a visit.
   ========================================================================== */

const SV = { store:null, q:'', filter:'all', sort:'spend', page:0, per:60, cust:null, ch:'whatsapp' };

/* voice + link settings the drafts are built from — editable in the UI so the
   copy carries your words, not invented brand facts */
const MSG_CFG = {
  sender:'Team HiDesign',
  signoff:'— HiDesign',
  link:'',
  storeLine:'',
  allowOffer:false,
  offerText:'',
  firstNameOnly:true
};

function billKey(r){ return (r.bill || '') + '|' + (r.date ? r.date.toISOString().slice(0,10) : ''); }
const GENERIC_NAME = /^(customer|cust|client|guest|walk ?in|walkin|counter|cash|test|dummy|unknown|n\/?a|nil|none|mr|mrs|ms|dr)$/i;
function firstName(n){
  const s = String(n||'').trim();
  if(!s) return '';
  const w = s.split(/\s+/)[0].replace(/[^A-Za-z'-]/g,'');
  /* a POS "name" of Customer / Walk-in / 998877 is not a name — better no
     greeting at all than "Hello Customer" */
  if(!w || w.length < 2 || GENERIC_NAME.test(w)) return '';
  return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
}
function plural(n, one, many){ return NUM(n) + ' ' + (Math.round(n) === 1 ? one : (many || one + 's')); }
function dstr(d){ return d ? d.toISOString().slice(0,10) : '—'; }
function titleCase(s){
  return String(s||'').trim().split(/\s+/).map(w => {
    /* keep true acronyms (DLF, LP, MG, GVK, VR) but not short real words
       like BELT or TOTE — an acronym has no vowel, or carries a digit */
    if(/^[A-Z&.]{2,5}$/.test(w) && !/[AEIOU]/.test(w)) return w;
    if(/^[A-Z]{1,4}\d+$/.test(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }).join(' ');
}

/* A POS style field is sometimes a product name (SASHA, ROMEO 01) and sometimes
   a code (HD1234, STYLE041). A code must never reach customer-facing copy. */
function isCodeLike(v){
  const t = String(v == null ? '' : v).trim();
  if(!t) return true;
  if(t.replace(/[^A-Za-z]/g,'').length < 4) return true;
  if(!/\s/.test(t) && /\d{2,}/.test(t)) return true;
  return false;
}
function itemLabel(l){
  if(!l) return null;
  if(!isCodeLike(l.style)) return l.style;
  if(!isCodeLike(l.sub))   return l.sub;
  if(l.cat)                return l.cat;
  return isCodeLike(l.style) ? null : l.style;
}

/* ---------------------------------------------------------------- aggregate */
function buildStores(cons, custs){
  if(!cons || !cons.length) return null;
  const hasStore = cons.some(r => r.store);
  const byCust = new Map();
  custs.forEach(c => byCust.set(c.cust, c));

  const S = new Map();
  const get = n => { let s = S.get(n);
    if(!s){ s = { name:n, rev:0, units:0, bills:new Set(), cust:new Map(), cat:{}, lea:{}, coll:{},
                  first:null, last:null, months:new Set() }; S.set(n, s); }
    return s; };

  cons.forEach(r => {
    const n = r.store || 'Unattributed';
    const s = get(n);
    if(r.amt > 0){
      s.rev += r.amt; s.units += r.qty;
      if(r.cat)     s.cat[r.cat]   = (s.cat[r.cat]   || 0) + r.amt;
      if(r.leather) s.lea[r.leather]=(s.lea[r.leather]|| 0) + r.amt;
      if(r.coll)    s.coll[r.coll] = (s.coll[r.coll] || 0) + r.amt;
    }
    const bk = billKey(r);
    if(bk !== '|') s.bills.add(bk);
    let cu = s.cust.get(r.cust);
    if(!cu){ cu = { cust:r.cust, spend:0, units:0, bills:new Set(), first:null, last:null }; s.cust.set(r.cust, cu); }
    cu.spend += r.amt; cu.units += r.qty;
    if(bk !== '|') cu.bills.add(bk);
    if(r.date){
      if(!cu.first || r.date < cu.first) cu.first = r.date;
      if(!cu.last  || r.date > cu.last ) cu.last  = r.date;
      if(!s.first  || r.date < s.first ) s.first  = r.date;
      if(!s.last   || r.date > s.last  ) s.last   = r.date;
      s.months.add(r.date.getUTCFullYear() + '-' + r.date.getUTCMonth());
    }
  });

  /* brand-level first purchase, so "new to HiDesign here" is honest */
  const brandFirst = new Map();
  cons.forEach(r => { if(!r.date) return;
    const f = brandFirst.get(r.cust);
    if(!f || r.date < f) brandFirst.set(r.cust, r.date); });

  let maxT = -Infinity;
  cons.forEach(r => { if(r.date && +r.date > maxT) maxT = +r.date; });
  const maxD = isFinite(maxT) ? new Date(maxT) : null;

  const topOf = o => { const e = Object.entries(o).sort((a,b) => b[1]-a[1]); return e.length ? e[0][0] : null; };

  const out = [...S.values()].map(s => {
    const cl = [...s.cust.values()];
    let repRev = 0, oneRev = 0, rep = 0, one = 0, newHere = 0, lapsed90 = 0, alsoElsewhere = 0, brandRepeat = 0;
    cl.forEach(c => {
      const nb = c.bills.size || 1;
      if(nb >= 2){ rep++; repRev += Math.max(0, c.spend); }
      else       { one++; oneRev += Math.max(0, c.spend); }
      const bf = brandFirst.get(c.cust);
      c.newHere = !!(bf && c.first && +bf === +c.first);
      if(c.newHere) newHere++;
      if(maxD && c.last && Math.round((maxD - c.last)/86400000) >= 90) lapsed90++;
      const g = byCust.get(c.cust);
      if(g && g.nbills > nb) alsoElsewhere++;
      if(g && g.nbills >= 2) brandRepeat++;
    });
    const nb = s.bills.size || cl.length;
    return { name:s.name, rev:s.rev, units:s.units, bills:nb, customers:cl.length,
      repeat:rep, oneTime:one, repeatRate: cl.length ? rep/cl.length : null,
      brandRepeatRate: cl.length ? brandRepeat/cl.length : null,
      repRev, oneRev, repRevShare: (repRev+oneRev) ? repRev/(repRev+oneRev) : null,
      avgBill: nb ? s.rev/nb : null, itemsPerBill: nb ? s.units/nb : null,
      spendPerCust: cl.length ? s.rev/cl.length : null,
      billsPerCust: cl.length ? nb/cl.length : null,
      newHere, lapsed90, alsoElsewhere,
      topCat:topOf(s.cat), topLea:topOf(s.lea), topColl:topOf(s.coll),
      first:s.first, last:s.last, months:s.months.size,
      custIndex:s.cust };
  }).sort((a,b) => b.rev - a.rev);

  return { hasStore, stores:out, maxD,
    totals:{ rev:out.reduce((a,s)=>a+s.rev,0), customers:new Set(cons.map(r=>r.cust)).size,
             stores:out.length } };
}

/* ------------------------------------------------------------------ journey */
function customerJourney(c){
  const rs = (c.rows || []).slice().sort((a,b) => (a.date?+a.date:0) - (b.date?+b.date:0));
  const visits = new Map();
  rs.forEach(r => {
    const k = billKey(r);
    let v = visits.get(k);
    if(!v){ v = { key:k, bill:r.bill, date:r.date, store:r.store, amt:0, qty:0, lines:[] }; visits.set(k, v); }
    v.amt += r.amt; v.qty += r.qty; v.lines.push(r);
    if(!v.store && r.store) v.store = r.store;
  });
  const list = [...visits.values()].sort((a,b) => (a.date?+a.date:0) - (b.date?+b.date:0));
  const gaps = [];
  for(let i=1;i<list.length;i++)
    if(list[i].date && list[i-1].date) gaps.push(Math.round((list[i].date - list[i-1].date)/86400000));
  const avgGap = gaps.length ? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length) : null;
  const stores = [...new Set(list.map(v => v.store).filter(Boolean))];
  const last = list.length ? list[list.length-1] : null;
  const lastPaid = last ? last.lines.filter(l => l.amt > 0).sort((a,b) => b.amt - a.amt)[0] : null;
  return { visits:list, avgGap, stores, last, lastPaid,
           due: (avgGap && c.recency != null) ? c.recency - avgGap : null };
}

/* ---------------------------------------------------------- what to say why */
function pickPlay(c, J){
  const rec = c.recency, nb = c.nbills || 1;
  const cats = {}; (c.rows||[]).forEach(r => { if(r.amt>0 && r.cat) cats[r.cat] = (cats[r.cat]||0)+r.amt; });
  const domCat = Object.keys(cats).sort((a,b)=>cats[b]-cats[a])[0] || null;
  const owned = new Set(Object.keys(cats));
  const nbList = (D.studio && D.studio.next_best) ? D.studio.next_best : [];
  const nba = nbList.find(n => n.from === domCat && !owned.has(n.to))
           || nbList.find(n => !owned.has(n.to)) || null;
  const seg = new Set(c.segIds || []);

  let play, why;
  if(c.uhni || c.hni)                       { play='concierge'; why='Top-percentile lifetime spend — this is a personal contact, never a broadcast.'; }
  else if(rec != null && rec >= 365)        { play='winback-long'; why='More than a year since the last purchase — lead with what has changed, not with a discount.'; }
  else if(rec != null && rec >= 180)        { play='winback'; why='Lapsed 180+ days — newness first, incentive only if a second touch fails.'; }
  else if(nb === 1 && rec != null && rec >= 60) { play='second-purchase'; why='One purchase, 60+ days ago — the second purchase is the one that makes a customer.'; }
  else if(nb === 1)                          { play='welcome'; why='First purchase is recent — care and reassurance now, selling later.'; }
  else if(rec != null && rec <= 30)          { play='care'; why='Bought within 30 days — do not re-sell the same category yet; look after the purchase.'; }
  else if(nba)                               { play='cross-sell'; why='Repeat buyer, out of the cooling-off window, with a clear untried category.'; }
  else                                       { play='newness'; why='Repeat buyer with no obvious gap to fill — lead with new arrivals in their leather.'; }

  if(seg.has('val-discount') && (play==='cross-sell'||play==='newness'))
    why += ' Discount-trained buyer: hold them for the markdown window rather than a full-price launch.';
  if(seg.has('val-fullprice'))
    why += ' Full-price buyer: suppress from EOSS sends.';

  const leas = {}; (c.rows||[]).forEach(r => { if(r.amt>0 && r.leather) leas[r.leather]=(leas[r.leather]||0)+r.amt; });
  const domLea = Object.keys(leas).sort((a,b)=>leas[b]-leas[a])[0] || null;

  return { play, why, domCat, domLea, nba,
           lastItem: itemLabel(J.lastPaid),
           lastCat: J.lastPaid ? J.lastPaid.cat : null,
           lastColl: J.lastPaid ? J.lastPaid.coll : null,
           lastStore: J.last ? J.last.store : null,
           lastDate: J.last ? J.last.date : null };
}

/* ------------------------------------------------------------ the templates */
function buildMessages(c, ctx, J){
  const cfg = MSG_CFG;
  const name = firstName((c.rows && c.rows[0]) ? c.rows[0].cname : '');
  const hi   = name ? name : 'there';
  const item = ctx.lastItem ? titleCase(ctx.lastItem) : (ctx.lastCat ? titleCase(ctx.lastCat) : 'your last piece');
  const lea  = ctx.domLea ? titleCase(ctx.domLea) : null;
  const nxt  = ctx.nba ? titleCase(ctx.nba.to) : (ctx.domCat ? titleCase(ctx.domCat) : 'new arrivals');
  const store= ctx.lastStore ? titleCase(ctx.lastStore) : 'your store';
  const when = ctx.lastDate ? dstr(ctx.lastDate) : null;
  const link = cfg.link ? ' ' + cfg.link : '';
  const off  = cfg.allowOffer && cfg.offerText ? ' ' + cfg.offerText : '';

  const P = {
    welcome: {
      wa:`Hello ${hi}, thank you for choosing your ${item} at ${store}. Every HiDesign piece is vegetable-tanned, so it darkens and softens with use — a little conditioning twice a year is all it asks for. If anything at all needs attention, reply here and we will take care of it.${link}`,
      sms:`${hi}, thank you for your ${item}. Care tips and support:${link || ' just reply to this message.'}`,
      subj:[`Your ${item}, and how it will age`,`Thank you, ${hi}`,`Looking after your new HiDesign`],
      pre:`Vegetable-tanned leather changes with use. Here is what to expect.`,
      body:`Hello ${hi},\n\nThank you for choosing your ${item} at ${store}. It is vegetable-tanned leather, which means it will darken, soften and carry the marks of how you use it — that is the material behaving as it should, not wearing out.\n\nTwo things worth knowing: condition it lightly twice a year, and let it dry naturally if it gets wet. Nothing else is needed.\n\nIf anything needs attention, reply to this email and we will look after it.\n\n${cfg.signoff}`,
      rcsT:`Your ${item}`, rcsD:`How vegetable-tanned leather ages, and the two things it asks of you.`,
      btns:['Care guide','Talk to the store'],
      call:[`Thank them for the ${item} bought at ${store}${when ? ' on ' + when : ''}.`,
            `Ask how they are finding it — fit, size, daily use.`,
            `Offer the care guidance: condition twice a year, dry naturally.`,
            `Do not sell anything on this call. Note anything they mention wanting next.`]
    },
    care: {
      wa:`Hello ${hi}, hope the ${item} is settling in well. Nothing to sell today — just a reminder that a light conditioning keeps the leather supple, and we can do it for you at ${store} whenever you are passing.${link}`,
      sms:`${hi}, hope your ${item} is settling in. Free leather conditioning at ${store} whenever you pass by.`,
      subj:[`How is the ${item} settling in?`,`A small thing for your ${item}`],
      pre:`Nothing to buy — just the care your leather asks for.`,
      body:`Hello ${hi},\n\nHope the ${item} is settling in well.\n\nNothing to sell today. Vegetable-tanned leather likes a light conditioning now and again, and we will do it for you at ${store} whenever you are passing — no appointment needed.\n\n${cfg.signoff}`,
      rcsT:`Your ${item}`, rcsD:`Free conditioning at ${store}, whenever you are passing.`,
      btns:['Find the store','Care guide'],
      call:[`Courtesy call — they bought the ${item} recently, so do not re-sell the same category.`,
            `Ask how it is being used and whether the size is right.`,
            `Offer in-store conditioning and a look at what is new when they next visit.`,
            `Log their leather preference${lea ? ' (currently ' + lea + ')' : ''} for the next contact.`]
    },
    'second-purchase': {
      wa:`Hello ${hi}, it has been a while since the ${item}${when ? ' in ' + when.slice(0,7) : ''}. ${nxt} is what most people reach for next alongside it${lea ? ', and we have it in ' + lea : ''}. Happy to keep one aside at ${store} if you would like to see it in person.${link}${off}`,
      sms:`${hi}, ${nxt} pairs with your ${item}. See it at ${store}.${link}`,
      subj:[`What usually follows a ${item}`,`${hi}, one to try alongside your ${item}`,`${nxt}, chosen for how you already buy`],
      pre:`Picked from what you already own, not from a bestseller list.`,
      body:`Hello ${hi},\n\nYou bought a ${item}${when ? ' in ' + when.slice(0,7) : ''}${store ? ' at ' + store : ''}, and the piece that most often follows it is ${nxt}${lea ? ' — particularly in ' + lea + ', which is what you chose last time' : ''}.\n\nWe can keep one aside at ${store} if you would like to see it in person before deciding.${off}\n\n${cfg.signoff}`,
      rcsT:`${nxt}, alongside your ${item}`, rcsD:`Chosen from what you already own${lea ? ', in ' + lea : ''}.`,
      btns:['See it','Hold one for me'],
      call:[`They bought a ${item}${when ? ' on ' + when : ''} and have not been back.`,
            `Lead with ${nxt}${lea ? ' in ' + lea : ''} — the piece that most often follows theirs.`,
            `Offer to hold it at ${store} for a look, no obligation.`,
            `If they decline, ask what they would want to see and note it.`]
    },
    'cross-sell': {
      wa:`Hello ${hi}, going by what you have bought${lea ? ' — mostly ' + lea + ' — ' : ' '}${nxt} is the natural next piece${ctx.nba ? '; it is what ' + Math.round(ctx.nba.conf*100) + '% of ' + titleCase(ctx.nba.from) + ' buyers add' : ''}. We can set one aside at ${store} for you to see.${link}${off}`,
      sms:`${hi}, ${nxt}${lea ? ' in ' + lea : ''} — set aside at ${store} if you would like a look.`,
      subj:[`${nxt} — the piece that usually follows`,`${hi}, based on what you already own`,`A ${lea || 'leather'} pairing worth seeing`],

      subj:[`Before it reaches the floor`,`${hi}, holding one for you`,`A first look, ahead of release`],

  const t = P[ctx.play] || P.newness;
  const clip = (s,n) => s.length > n ? s.slice(0, n-1).replace(/\s+\S*$/,'') + '…' : s;
  return {
    whatsapp: clip(t.wa, 900),
    sms: clip(t.sms.replace(/\s+/g,' ').trim(), 160),
    email: { subjects:t.subj, preview:t.pre, body:t.body },
    rcs: { title:clip(t.rcsT,60), description:clip(t.rcsD,180), buttons:t.btns },

  };

function storeRows(){
  const ST = D.stores;
  const s = ST.stores.find(x => x.name === SV.store);
  if(!s) return { s:null, list:[] };
  const byCust = new Map(); (C360 && C360.custs ? C360.custs : []).forEach(c => byCust.set(c.cust, c));
  const maxD = ST.maxD;
  const q = SV.q.trim().toLowerCase();

  let list = [...s.custIndex.values()].map(cu => {
    const g = byCust.get(cu.cust) || {};
    const name = (g.rows && g.rows[0]) ? g.rows[0].cname : '';
    const nb = cu.bills.size || 1;
    const rec = (maxD && cu.last) ? Math.round((maxD - cu.last)/86400000) : null;
    return { cust:cu.cust, name, spend:cu.spend, bills:nb, last:cu.last, first:cu.first, rec,
             g, brandBills:g.nbills || nb, brandSpend:g.spend || cu.spend, ltvHigh:!!g.ltvHigh,
             hni:!!g.hni, uhni:!!g.uhni, newHere: !!cu.newHere };
  });

  if(q) list = list.filter(r => String(r.cust).toLowerCase().includes(q) || String(r.name).toLowerCase().includes(q));
  const f = SV.filter;
  if(f === 'repeat')   list = list.filter(r => r.bills >= 2);
  if(f === 'one')      list = list.filter(r => r.bills < 2);
  if(f === 'lapsed90') list = list.filter(r => r.rec != null && r.rec >= 90);
  if(f === 'lapsed180')list = list.filter(r => r.rec != null && r.rec >= 180);
  if(f === 'high')     list = list.filter(r => r.ltvHigh);
  if(f === 'new')      list = list.filter(r => r.newHere);

  const cmp = { spend:(a,b)=>b.spend-a.spend, bills:(a,b)=>b.bills-a.bills,
    recency:(a,b)=>(a.rec==null?1e9:a.rec)-(b.rec==null?1e9:b.rec),
    stale:(a,b)=>(b.rec==null?-1:b.rec)-(a.rec==null?-1:a.rec) }[SV.sort];
  list.sort(cmp);
  return { s, list };
}

function drawStoreList(){
  const el = document.getElementById('st-list');
  const { s, list } = storeRows();
  if(!s){ el.innerHTML = '<div class="empty">Store not found.</div>'; return; }

  const pages = Math.max(1, Math.ceil(list.length / SV.per));
  if(SV.page >= pages) SV.page = 0;
  const slice = list.slice(SV.page * SV.per, SV.page * SV.per + SV.per);

  let h = '<div class="kpis">'
    + kpi('Revenue', INR(s.rev), NUM(s.bills) + ' bills · ' + NUM(s.units) + ' items')
    + kpi('Customers', NUM(s.customers), NUM(s.repeat) + ' repeat (' + PCT(s.repeatRate,1) + ')')
    + kpi('Avg bill', INR(s.avgBill), (s.itemsPerBill==null?'':s.itemsPerBill.toFixed(2) + ' items/bill'))
    + kpi('Spend per customer', INR(s.spendPerCust), (s.billsPerCust==null?'':s.billsPerCust.toFixed(2) + ' bills each'))
    + kpi('Lapsed 90 days+', NUM(s.lapsed90), 'the win-back pool here')
    + kpi('Also shop elsewhere', NUM(s.alsoElsewhere), 'bought at another door too')
    + '</div>';

  h += '<div class="note" style="margin:8px 0">Showing <b>' + NUM(slice.length) + '</b> of <b>' + NUM(list.length)
     + '</b> matching customers at ' + esc(s.name) + '. Click a row to open the journey and draft the message.</div>';

  h += table(slice, [
      { key:'cust', label:'Code', fmt:(v,r)=>'<button class="matchbtn" data-c="'+esc(String(v))+'" style="padding:2px 7px;margin:0">'+esc(String(v))+'</button>' },
      { key:'name', label:'Name', fmt:v=>esc(short(v||'—',26)) },
      { key:'spend', label:'Spend here', num:1, fmt:v=>INR(v) },
      { key:'bills', label:'Bills here', num:1, fmt:v=>NUM(v) },
      { key:'brandBills', label:'Bills (brand)', num:1, fmt:v=>NUM(v) },
      { key:'brandSpend', label:'LTV (brand)', num:1, fmt:v=>INR(v) },
      { key:'last', label:'Last visit', fmt:v=>esc(dstr(v)) },
      { key:'rec', label:'Days since', num:1, fmt:v=>v==null?'—':NUM(v) },
      { key:'cust', label:'Flags', fmt:(v,r)=>[r.uhni?'<span class="badge b-good">UHNI</span>':(r.hni?'<span class="badge b-good">HNI</span>':(r.ltvHigh?'<span class="badge b-info">High LTV</span>':'')),
          r.bills>=2?'<span class="badge b-info">Repeat</span>':'<span class="badge b-warn">One-time</span>',
          (r.rec!=null&&r.rec>=180)?'<span class="badge b-bad">Lapsed</span>':''].filter(Boolean).join(' ') }
    ], { scroll:true });

  if(pages > 1){
    h += '<div class="actions"><button class="act sec" id="st-prev"'+(SV.page===0?' disabled':'')+'>← Previous</button>'
       + '<span class="note" style="margin:0 10px">Page ' + (SV.page+1) + ' of ' + pages + '</span>'
       + '<button class="act sec" id="st-next"'+(SV.page>=pages-1?' disabled':'')+'>Next →</button></div>';
  }
  h += '<div class="actions"><button class="act sec" id="st-export-list">Download this list (CSV)</button>'
     + '<button class="act sec" id="st-export-msg">Download list + drafted messages (CSV)</button>'
     + '<span class="note" style="margin-left:8px">Exports carry customer names and codes — handle them under your DPDP consent basis.</span></div>';

  el.innerHTML = h;
  el.querySelectorAll('.matchbtn').forEach(b => b.onclick = () => openJourney(b.dataset.c));
  const pv = document.getElementById('st-prev'), nx = document.getElementById('st-next');
  if(pv) pv.onclick = () => { SV.page--; drawStoreList(); };
  if(nx) nx.onclick = () => { SV.page++; drawStoreList(); };
  document.getElementById('st-export-list').onclick = () => exportList(false);
  document.getElementById('st-export-msg').onclick  = () => exportList(true);
}

/* --------------------------------------------------------- journey + drafts */
function openJourney(code){
  const c = (C360 && C360.custs ? C360.custs : []).find(x => String(x.cust) === String(code));
  const el = document.getElementById('st-journey');
  if(!c){ el.innerHTML = '<div class="empty">That customer is not in the current data.</div>'; return; }
  SV.cust = c;
  drawJourney();
  document.getElementById('st-journey-panel').scrollIntoView({ behavior:'smooth', block:'start' });
}

function drawJourney(){

  const J = customerJourney(c);
