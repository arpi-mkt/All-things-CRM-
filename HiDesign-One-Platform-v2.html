</script>
<style>
  :root{color-scheme:light;
    --espresso:#2B1A10; --cream:#FAF3E7; --terracotta:#B85042; --gold:#BE8A3D;
    --sage:#7D8C64; --slate:#6E5648; --card:#F1E5D2;}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--cream);color:var(--espresso);
    font-family:Arial,Carlito,Helvetica,sans-serif;font-size:14px;line-height:1.5}
  h1{font-family:Georgia,Caladea,serif;font-size:23px;margin:0 0 2px}
  .sub{color:var(--slate);font-size:13px;margin-bottom:16px}
  h2{font-family:Georgia,serif;font-size:16px;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
  h3{font-family:Georgia,serif;font-size:14.5px;margin:0 0 10px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--card);align-items:flex-end}
  .navlbl{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gold);
    font-weight:bold;padding:0 4px 9px 10px;white-space:nowrap}
  .tab{padding:9px 15px;cursor:pointer;border-radius:7px 7px 0 0;background:var(--card);
    color:var(--slate);font-size:13px;border:none;font-family:inherit}
  .tab:hover{background:#E8D8BF}
  .tab.active{background:var(--espresso);color:var(--cream)}
  .chtab{padding:8px 14px;cursor:pointer;border-radius:7px 7px 0 0;background:var(--card);
    border:none;font-size:12.5px;font-weight:bold;color:var(--slate);margin-right:4px}
  .chtab.active{background:var(--espresso);color:var(--cream)}
  .page{display:none}
  .page.active{display:block}
  .panel{background:var(--card);border-radius:10px;padding:16px;margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--espresso);color:var(--cream);border-radius:9px;padding:12px 14px}
  .kpi .l{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
  .kpi .v{font-family:Georgia,serif;font-size:20px;line-height:1.15}
  .kpi .s{font-size:11px;color:#C9B79E;margin-top:3px}
  table{width:100%;border-collapse:collapse;background:var(--cream);border-radius:8px;overflow:hidden;font-size:12.5px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--card);vertical-align:top}
  th{background:var(--espresso);color:var(--cream);font-weight:normal;font-size:11.5px;
     text-transform:uppercase;letter-spacing:.3px;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{background:#3d2718}
  tr:nth-child(even) td{background:var(--card)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{max-height:460px;overflow:auto;border-radius:8px}
  .chart{height:260px;position:relative}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  @media(max-width:840px){.grid2{grid-template-columns:1fr}}
  .badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:bold;color:#fff;white-space:nowrap}
  .b-good{background:var(--sage)} .b-warn{background:var(--gold)} .b-bad{background:var(--terracotta)}
  .b-info{background:var(--slate)}
  .seg{background:var(--cream);border-left:4px solid var(--terracotta);border-radius:7px;padding:13px}
  .seg h4{margin:0 0 7px;font-family:Georgia,serif;font-size:13.5px}
  .seg .r{font-size:11.5px;color:var(--slate);margin-bottom:3px}
  .seg .r b{color:var(--espresso)}
  .chips{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
  .chip{background:var(--card);border-radius:9px;padding:2px 7px;font-size:10.5px}
  .chip b{color:var(--terracotta)}
  .alert{border-left:4px solid var(--terracotta);background:#FBEEEA;border-radius:6px;padding:12px 14px;margin-bottom:11px}
  .alert.good{border-left-color:var(--sage);background:#F0F3EA}
  .alert.warn{border-left-color:var(--gold);background:#FBF3E4}
  .alert h4{margin:0 0 5px;font-size:13px;font-family:Georgia,serif}
  .alert p{margin:0;font-size:12.5px;color:var(--slate)}
  .note{font-size:11.5px;color:var(--slate);margin-top:7px}
  .empty{color:var(--slate);font-style:italic;padding:18px;text-align:center}
  ul.caveats{margin:0;padding-left:17px;font-size:12px;color:var(--slate)}
  ul.caveats li{margin-bottom:7px}
  select,input,textarea,button{font-family:inherit;font-size:13px}
  select,input[type=number],input[type=text],input[type=search],textarea{width:100%;padding:7px 8px;
    border:1px solid var(--gold);border-radius:5px;background:var(--cream);color:var(--espresso)}
  textarea{resize:vertical;min-height:62px}
  label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:3px}
  button.act{background:var(--espresso);color:var(--cream);border:none;border-radius:6px;
    padding:9px 17px;cursor:pointer;width:auto}
  button.act:hover{background:var(--terracotta)}
  button.act.sec{background:var(--sage)}
  button.act:disabled{background:#bbb;cursor:not-allowed}
  .actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;align-items:end}
  .frange{display:flex;gap:11px;flex-wrap:wrap;margin-top:13px}
  .frange>div{background:var(--espresso);color:var(--cream);border-radius:8px;padding:10px 17px;text-align:center;min-width:116px}
  .frange .fl{font-size:10px;color:var(--gold);letter-spacing:.4px}
  .frange .fv{font-family:Georgia,serif;font-size:17px;margin-top:2px}
  .ask-suggest{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
  .ask-suggest button{background:var(--card);border:1px solid var(--gold);border-radius:13px;
    padding:5px 11px;font-size:11.5px;cursor:pointer;color:var(--espresso);width:auto}
  .ask-suggest button:hover{background:var(--gold);color:#fff}
  .answer{background:var(--cream);border-radius:8px;padding:14px;margin-top:12px;white-space:pre-wrap;
    font-size:13px;display:none;border-left:3px solid var(--sage);
    font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.55}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--card);
    border-top-color:var(--terracotta);border-radius:50%;animation:sp .8s linear infinite;
    vertical-align:middle;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tb-h{font-family:Georgia,serif;font-size:12.5px;padding:6px 10px;border-radius:6px 6px 0 0;color:#fff}
  .tb-top{background:var(--sage)} .tb-bot{background:var(--terracotta)}
  .drop{background:var(--cream);border:2px dashed var(--gold);border-radius:8px;padding:13px}
  .drop.over{background:#F6E9D2;border-color:var(--terracotta)}
  .drop label{display:block;font-weight:bold;color:var(--espresso);font-size:12.5px;margin-bottom:6px}
  .drop input[type=file]{width:100%;font-size:11.5px;border:none;background:transparent;padding:4px 0}
  .drop .hint{font-size:10.5px;color:var(--slate);margin-top:4px}
  .fstat{font-size:11px;margin-top:7px;color:var(--slate);word-break:break-word}

<script>
/* ============================================================================
   ENGINE v2 — streaming, size-unlimited XLSX / CSV reader.

   v1 read the whole file into one ArrayBuffer, inflated each ZIP part into one
   giant JavaScript string, then regex-scanned that string. A browser string
   tops out around 512 MB, so a big sheet died with "Invalid string length"
   long before the machine ran out of memory.

   v2 never materialises the file, the part, or the sheet XML:
     · the ZIP central directory is read from the tail of the file only
       (file.slice), with ZIP64 support for archives over 4 GB;
     · each part is piped through DecompressionStream and decoded chunk by
       chunk, with a rolling buffer that only ever holds one <row>;
     · rows are converted to objects as they stream past, so nothing is ever
       held twice;
     · columns the platform can never read are dropped at load (reported, not
       silent), and repeated text is interned, which is what actually decides
       how many million rows fit in the tab.

   There is no row cap and no column cap. The only ceiling is the memory the
   browser tab is willing to give, and that ceiling now applies to the data
   itself rather than to a temporary copy of the file.
   Nothing is uploaded anywhere — the file is read locally in the browser.
   ========================================================================== */

const ENGINE_VERSION = 'v2 streaming';

/* true when the character after a tag name is a legal delimiter. A tag sitting
   at the very end of the rolling buffer has no next character yet — that must
   wait for the next chunk, never be skipped, or rows go missing one per
   unlucky chunk boundary. */
function tagDelim(c){ return c === 32 || c === 62 || c === 47 || c === 9 || c === 10 || c === 13; }

/* --- progress plumbing ---------------------------------------------------- */
function nowMs(){ return (typeof performance !== 'undefined' ? performance.now() : Date.now()); }
const breathe = () => new Promise(r => setTimeout(r, 0));

/* --- ZIP ------------------------------------------------------------------ */
async function sliceBytes(file, start, end){
  start = Math.max(0, start); end = Math.min(file.size, end);
  if(end <= start) return new Uint8Array(0);
  return new Uint8Array(await file.slice(start, end).arrayBuffer());
}

async function openZip(file){
  const size = file.size;
  if(size < 22) throw new Error('That file is too small to be an .xlsx workbook.');
  const tailLen = Math.min(size, 1 << 20);
  const tail = await sliceBytes(file, size - tailLen, size);
  const tv = new DataView(tail.buffer, tail.byteOffset, tail.byteLength);
  let e = -1;
  for(let i = tail.length - 22; i >= 0; i--){
    if(tv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  }
  if(e < 0) throw new Error('Not a valid .xlsx file (no ZIP directory found). If it was renamed from .xls, re-save it as .xlsx or .csv.');

  let count  = tv.getUint16(e + 10, true);
  let cdSize = tv.getUint32(e + 12, true);
  let cdOff  = tv.getUint32(e + 16, true);

  /* ZIP64 — archives over 4 GB or with more than 65535 members */
  if(count === 0xFFFF || cdSize === 0xFFFFFFFF || cdOff === 0xFFFFFFFF){
    let loc = -1;
    for(let i = e - 20; i >= 0; i--){ if(tv.getUint32(i, true) === 0x07064b50){ loc = i; break; } }
    if(loc >= 0){
      const z64Off = Number(tv.getBigUint64(loc + 8, true));
      const z = await sliceBytes(file, z64Off, z64Off + 56);
      const zv = new DataView(z.buffer, z.byteOffset, z.byteLength);
      if(z.length >= 56 && zv.getUint32(0, true) === 0x06064b50){
        count  = Number(zv.getBigUint64(32, true));
        cdSize = Number(zv.getBigUint64(40, true));
        cdOff  = Number(zv.getBigUint64(48, true));
      }
    }
  }

  const cd = await sliceBytes(file, cdOff, cdOff + cdSize);
  const cv = new DataView(cd.buffer, cd.byteOffset, cd.byteLength);
  const dec = new TextDecoder();
  const entries = new Map();
  let off = 0;
  for(let n = 0; n < count && off + 46 <= cd.length; n++){
    if(cv.getUint32(off, true) !== 0x02014b50) break;
    const method   = cv.getUint16(off + 10, true);
    let compSize   = cv.getUint32(off + 20, true);
    let uncompSize = cv.getUint32(off + 24, true);
    const nameLen  = cv.getUint16(off + 28, true);
    const extraLen = cv.getUint16(off + 30, true);
    const cmtLen   = cv.getUint16(off + 32, true);
    let localOff   = cv.getUint32(off + 42, true);
    const name = dec.decode(cd.subarray(off + 46, off + 46 + nameLen));

    if(uncompSize === 0xFFFFFFFF || compSize === 0xFFFFFFFF || localOff === 0xFFFFFFFF){
      let p = off + 46 + nameLen; const endX = p + extraLen;
      while(p + 4 <= endX){
        const id = cv.getUint16(p, true), sz = cv.getUint16(p + 2, true);
        if(id === 0x0001){
          let q = p + 4;
          if(uncompSize === 0xFFFFFFFF){ uncompSize = Number(cv.getBigUint64(q, true)); q += 8; }
          if(compSize   === 0xFFFFFFFF){ compSize   = Number(cv.getBigUint64(q, true)); q += 8; }
          if(localOff   === 0xFFFFFFFF){ localOff   = Number(cv.getBigUint64(q, true)); q += 8; }
          break;
        }
        p += 4 + sz;
      }
    }
    entries.set(name, { method, compSize, uncompSize, localOff });
    off += 46 + nameLen + extraLen + cmtLen;
  }
  if(!entries.size) throw new Error('This .xlsx appears to be empty or damaged (no parts in the ZIP directory).');

  async function partStream(name){
    const en = entries.get(name);
    if(!en) return null;
    const h = await sliceBytes(file, en.localOff, en.localOff + 30);
    const hv = new DataView(h.buffer, h.byteOffset, h.byteLength);
    if(h.length < 30 || hv.getUint32(0, true) !== 0x04034b50)
      throw new Error('This .xlsx is damaged (bad local header for ' + name + ').');
    const start = en.localOff + 30 + hv.getUint16(26, true) + hv.getUint16(28, true);
    const len = en.compSize > 0 ? en.compSize : (file.size - start);
    const blob = file.slice(start, start + len);
    if(en.method === 0) return blob.stream();
    if(en.method !== 8) throw new Error('This .xlsx uses an unsupported compression method. Re-save it from Excel, or export CSV.');
    if(typeof DecompressionStream === 'undefined')
      throw new Error('This browser cannot unzip .xlsx files. Save the sheet as CSV and load that instead.');
    return blob.stream().pipeThrough(new DecompressionStream('deflate-raw'));
  }

  async function partText(name){
    const st = await partStream(name);
    if(!st) return null;
    const rd = st.getReader(), dc = new TextDecoder('utf-8');
    let out = '';
    for(;;){ const r = await rd.read(); if(r.done) break; out += dc.decode(r.value, {stream:true}); }
    return out + dc.decode();
  }

  return { entries, names: [...entries.keys()], partStream, partText };
}

/* --- XML helpers ---------------------------------------------------------- */
function colToIndex(ref){
  let n = 0;
  for(let i = 0; i < ref.length; i++){
    const c = ref.charCodeAt(i);
    if(c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
function excelSerialToDate(n){ return new Date(EXCEL_EPOCH + Math.round(n * 86400000)); }

const XML_ENT = {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'"};
function unesc(s){
  if(s.indexOf('&') === -1) return s;
  return s.replace(/&(amp|lt|gt|quot|apos|#x?[0-9a-fA-F]+);/g, m => {
    if(XML_ENT[m]) return XML_ENT[m];
    const hex = m[2] === 'x' || m[2] === 'X';
    return String.fromCharCode(parseInt(m.slice(hex ? 3 : 2, -1), hex ? 16 : 10));
  });
}

/* concatenated text of every <t> between a and b */
function tText(s, a, b){
  let r = '', i = a;
  for(;;){
    const p = s.indexOf('<t', i);
    if(p < 0 || p >= b) break;
    if(!tagDelim(s.charCodeAt(p + 2))){ i = p + 2; continue; }
    const g = s.indexOf('>', p);
    if(g < 0 || g >= b) break;
    if(s.charCodeAt(g - 1) === 47){ i = g + 1; continue; }
    const e = s.indexOf('</t>', g);
    if(e < 0 || e > b) break;
    r += unesc(s.slice(g + 1, e));
    i = e + 4;
  }
  return r;
}

/* --- streamed sharedStrings ---------------------------------------------- */
async function readSharedStrings(zip, onTick){
  if(!zip.entries.has('xl/sharedStrings.xml')) return [];
  const st = await zip.partStream('xl/sharedStrings.xml');
  const rd = st.getReader(), dc = new TextDecoder('utf-8');
  const out = [];
  let buf = '', ticks = 0;

  const drain = (flush) => {
    let i = 0;
    for(;;){
      const s = buf.indexOf('<si', i);
      if(s < 0) break;
      if(s + 3 >= buf.length){ if(!flush) break; else { i = buf.length; break; } }
      if(!tagDelim(buf.charCodeAt(s + 3))){ i = s + 3; continue; }
      const g = buf.indexOf('>', s);
      if(g < 0) break;
      if(buf.charCodeAt(g - 1) === 47){ out.push(''); i = g + 1; continue; }
      const e = buf.indexOf('</si>', g);
      if(e < 0) break;
      out.push(tText(buf, g + 1, e));
      i = e + 5;
    }
    const nx = buf.indexOf('<si', i);
    buf = buf.slice(nx < 0 ? (flush ? buf.length : Math.max(i, buf.length - 4)) : nx);
  };

  for(;;){
    const r = await rd.read();
    if(r.done) break;
    buf += dc.decode(r.value, {stream:true});
    drain(false);
    if((++ticks & 31) === 0){ if(onTick) onTick(out.length); await breathe(); }
  }
  buf += dc.decode();
  drain(true);
  return out;
}

/* --- date styles ---------------------------------------------------------- */
async function readDateStyles(zip){
  const dateStyles = new Set();
  const en = zip.entries.get('xl/styles.xml');
  if(!en) return dateStyles;
  const xml = await zip.partText('xl/styles.xml');
  if(!xml) return dateStyles;
  const customDate = new Set();
  const nfRe = /<numFmt\b[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"[^>]*\/?>/g;
  let nm;
  while((nm = nfRe.exec(xml))){
    const code = unesc(nm[2]);
    if(/[dmyh]/i.test(code) && !/[#0]/.test(code.replace(/\[[^\]]*\]/g, ''))) customDate.add(nm[1]);
  }
  const builtinDate = new Set(['14','15','16','17','18','19','20','21','22','45','46','47']);
  const xfsBlock = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml);
  if(xfsBlock){
    const xfRe = /<xf\b([^>]*?)(?:\/>|>[\s\S]*?<\/xf>)/g;
    let xm, i = 0;
    while((xm = xfRe.exec(xfsBlock[1]))){
      const id = /numFmtId="(\d+)"/.exec(xm[1]);
      if(id && (builtinDate.has(id[1]) || customDate.has(id[1]))) dateStyles.add(String(i));
      i++;
    }
  }
  return dateStyles;
}

/* --- one <row> → array of cells ------------------------------------------ */
function parseRowCells(s, from, to, shared, dateStyles){
  const out = [];
  let i = from;
  while(i < to){
    const p = s.indexOf('<c', i);
    if(p < 0 || p >= to) break;
    if(!tagDelim(s.charCodeAt(p + 2))){ i = p + 2; continue; }

    let j = p + 2, ref = null, type = null, style = null, selfClose = false;
    while(j < to){
      const ch = s.charCodeAt(j);
      if(ch === 62){ j++; break; }
      if(ch === 47){ if(s.charCodeAt(j + 1) === 62){ selfClose = true; j += 2; break; } j++; continue; }
      if(ch === 32 || ch === 9 || ch === 10 || ch === 13){ j++; continue; }
      let k = j;
      while(k < to && s.charCodeAt(k) !== 61) k++;
      if(k >= to) { j = to; break; }
      const qc = s.charCodeAt(k + 1);
      let ve = s.indexOf(qc === 39 ? "'" : '"', k + 2);
      if(ve < 0 || ve > to) ve = to;
      const val = s.slice(k + 2, ve);
      if(k - j === 1){
        const nm = s.charCodeAt(j);
        if(nm === 114) ref = val;             /* r */
        else if(nm === 116) type = val;       /* t */
        else if(nm === 115) style = val;      /* s */
      }
      j = ve + 1;
    }

    const idx = ref ? colToIndex(ref) : out.length;
    let val = null;

    if(selfClose){
      i = j;
    } else {
      const ce = s.indexOf('</c>', j);
      const stop = (ce < 0 || ce > to) ? to : ce;
      if(type === 'inlineStr'){
        val = tText(s, j, stop);
      } else {
        const v = s.indexOf('<v', j);
        if(v >= 0 && v < stop){
          const vg = s.indexOf('>', v);
          const vend = s.indexOf('</v>', vg);
          if(vg >= 0 && vend > vg && vend <= stop){
            const raw = s.slice(vg + 1, vend);
            if(type === 's')       val = shared[+raw];
            else if(type === 'e')  val = null;
            else if(type === 'str')val = unesc(raw);
            else {
              const n = parseFloat(raw);
              val = (!isNaN(n) && style != null && dateStyles.has(style)) ? excelSerialToDate(n)
                  : (isNaN(n) ? unesc(raw) : n);
            }
          }
        }
      }
      i = (ce < 0 || ce > to) ? stop : ce + 4;
    }
    if(idx >= 0) out[idx] = val === undefined ? null : val;
  }
  return out;
}

/* --- column pruning -------------------------------------------------------
   pick() can only ever return a header that exactly equals, or contains, one
   of these tokens. A column matching none of them is unreachable by every
   screen in the platform, so dropping it at load is lossless — and on a very
   large file it is the difference between fitting in memory and not.
   -------------------------------------------------------------------------- */
const PICK_FIELDS = ['amount','audience','base','bill no','bill number','bill type','billno','billnumber',
  'branch','campaign','cat','cfnd_im','channel','city','clicked','clicks','code','coll','color','colour',
  'contact','converted','core / seasonal','cost','createdon','customer','date','delivered','ean','email',
  'enrolled','gender','grade','incentivetype','leather','material','medium','member since','membership',
  'mobile','mrp','occasion','outlet','phone','qty','quantity','region','responder','revenue','sales',
  'segment','sent','sex','site','spend','state','store','style','tier','town','value','wa opt in','whatsapp'];

function headerIsUsable(h){
  const k = String(h == null ? '' : h).toLowerCase().trim();
  if(!k) return false;
  for(let i = 0; i < PICK_FIELDS.length; i++){
    const n = PICK_FIELDS[i];
    if(k === n || k.indexOf(n) !== -1) return true;
  }
  return false;
}

/* --- string interning (CSV / inline text) --------------------------------- */
function makeIntern(){
  const m = new Map();
  return function(s){
    if(s.length === 0) return s;
    if(s.length > 60) return s;
    const c = s.charCodeAt(0);
    if(c >= 48 && c <= 57) return s;             /* numbers rarely repeat */
    const h = m.get(s);
    if(h !== undefined) return h;
    if(m.size < 400000) m.set(s, s);
    return s;
  };
}

/* --- header detection (same scoring as before) ---------------------------- */
function scoreHeaderRows(rows, expected, maxScan){
  const want = expected.map(e => e.toLowerCase());
  let bestIdx = 0, bestHits = 0;
  const lim = Math.min(maxScan == null ? 12 : maxScan, rows.length);
  for(let i = 0; i < lim; i++){
    const cells = (rows[i] || []).map(c => String(c == null ? '' : c).trim().toLowerCase());
    const hits = want.filter(w => cells.some(c => c === w || c.includes(w))).length;
    if(hits > bestHits){ bestHits = hits; bestIdx = i; }
  }
  return { index: bestIdx, hits: bestHits };
}

/* --- the sink: cell arrays in, row objects out ---------------------------- */
function makeSink(expected, opts){
  opts = opts || {};
  const prune = opts.prune !== false;
  const scan = [];
  let header = null, keys = null, keepIdx = null, dropped = [];
  let hdrIndex = 0, hdrHits = 0, seen = 0;
  const rows = [];

  function settle(){
    if(header) return;
    const h = scoreHeaderRows(scan, expected, 12);
    hdrIndex = h.index; hdrHits = h.hits;
    const raw = (scan[hdrIndex] || []).map(x => String(x == null ? '' : x).trim());
    keys = raw;
    keepIdx = [];
    dropped = [];
    for(let j = 0; j < raw.length; j++){
      if(!raw[j]) continue;
      if(!prune || headerIsUsable(raw[j])) keepIdx.push(j);
      else dropped.push(raw[j]);
    }
    if(!keepIdx.length){                 /* nothing recognised — keep everything */
      dropped = [];
      for(let j = 0; j < raw.length; j++) if(raw[j]) keepIdx.push(j);
    }
    header = true;
    for(let i = hdrIndex + 1; i < scan.length; i++) emit(scan[i]);
    scan.length = 0;
  }

  function emit(cells){
    if(!cells) return;
    let any = false;
    for(let j = 0; j < cells.length; j++){
      const v = cells[j];
      if(v !== null && v !== undefined && v !== ''){ any = true; break; }
    }
    if(!any) return;
    const o = {};
    for(let i = 0; i < keepIdx.length; i++){
      const j = keepIdx[i];
      const v = cells[j];
      o[keys[j]] = v === undefined ? null : v;
    }
    rows.push(o);
  }

  return {
    push(cells){
      seen++;
      if(header) emit(cells);
      else { scan.push(cells); if(scan.length >= 13) settle(); }
    },
    get count(){ return rows.length; },
    finish(){
      settle();
      return { rows, headerIndex: hdrIndex, hits: hdrHits, dropped, rawRows: seen,
               columns: keepIdx.length };
    }
  };
}

/* --- streamed .xlsx ------------------------------------------------------- */
async function streamXlsx(file, sink, ctl){
  const zip = await openZip(file);
  if(ctl && ctl.status) ctl.status('reading text table…');
  const shared = await readSharedStrings(zip, n => { if(ctl && ctl.status) ctl.status('reading text table… ' + n.toLocaleString('en-IN') + ' strings'); });
  const dateStyles = await readDateStyles(zip);

  const sheets = zip.names.filter(n => /^xl\/worksheets\/sheet[^\/]*\.xml$/i.test(n));
  if(!sheets.length) throw new Error('No worksheets found in this file.');
  let chosen = sheets[0], best = -1;
  for(const s of sheets){
    const u = zip.entries.get(s).uncompSize || zip.entries.get(s).compSize || 0;
    if(u > best){ best = u; chosen = s; }
  }

  const st = await zip.partStream(chosen);
  const rd = st.getReader(), dc = new TextDecoder('utf-8');
  let buf = '', ticks = 0, last = nowMs();

  const drain = (flush) => {
    let i = 0;
    for(;;){
      const s = buf.indexOf('<row', i);
      if(s < 0) break;
      if(s + 4 >= buf.length){ if(!flush) break; else { i = buf.length; break; } }
      if(!tagDelim(buf.charCodeAt(s + 4))){ i = s + 4; continue; }
      const g = buf.indexOf('>', s);
      if(g < 0) break;
      if(buf.charCodeAt(g - 1) === 47){ i = g + 1; continue; }   /* <row/> — empty */
      const e = buf.indexOf('</row>', g);
      if(e < 0) break;
      sink.push(parseRowCells(buf, g + 1, e, shared, dateStyles));
      i = e + 6;
    }
    const nx = buf.indexOf('<row', i);
    buf = buf.slice(nx < 0 ? (flush ? buf.length : Math.max(i, buf.length - 5)) : nx);
  };

  for(;;){
    const r = await rd.read();
    if(r.done) break;
    buf += dc.decode(r.value, {stream:true});
    drain(false);
    if((++ticks & 15) === 0){
      const t = nowMs();
      if(t - last > 250){ last = t; if(ctl && ctl.status) ctl.status(sink.count.toLocaleString('en-IN') + ' rows read…'); await breathe(); }
    }
  }
  buf += dc.decode();
  drain(true);
}

/* --- streamed CSV / TSV --------------------------------------------------- */
function chooseDelim(line){
  let best = ',', n = -1;
  const cands = [',', ';', '\t', '|'];
  for(const d of cands){
    let c = 0, q = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      if(ch === '"') q = !q;
      else if(!q && ch === d) c++;
    }
    if(c > n){ n = c; best = d; }
  }
  return n > 0 ? best : ',';
}

async function streamCsv(file, sink, ctl){
  const rd = file.stream().getReader(), dc = new TextDecoder('utf-8');
  const intern = makeIntern();
  let row = [], field = '', q = false, delim = null, pend = false, sniff = '';
  let ticks = 0, last = nowMs(), first = true;

  const endField = () => { row.push(intern(field)); field = ''; };
  const endRow = () => { endField(); sink.push(row); row = []; };

  const feed = (text) => {
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(q){
        if(c === '"'){ pend = true; q = false; }
        else field += c;
        continue;
      }
      if(pend){
        pend = false;
        if(c === '"'){ field += '"'; q = true; continue; }
      }
      if(c === '"'){ q = true; continue; }
      if(c === delim){ endField(); continue; }
      if(c === '\n'){ if(field !== '' || row.length){ endRow(); } continue; }
      if(c === '\r'){ if(field !== '' || row.length){ endRow(); } continue; }
      field += c;
    }
  };

  /* the delimiter is decided from the whole first line, not the first
     punctuation mark, so a comma file with a semicolon inside a heading still
     reads as a comma file */
  const feedSniffed = (text, flush) => {
    if(delim === null){
      sniff += text;
      const nl = sniff.indexOf('\n');
      if(nl < 0 && sniff.length < 65536 && !flush) return;
      delim = chooseDelim(nl < 0 ? sniff : sniff.slice(0, nl));
      const held = sniff; sniff = '';
      feed(held);
      return;
    }
    feed(text);
  };

  for(;;){
    const r = await rd.read();
    if(r.done) break;
    let text = dc.decode(r.value, {stream:true});
    if(first){ first = false; if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); }
    /* \r\n split across chunk boundaries is harmless: an empty row is dropped */
    feedSniffed(text);
    if((++ticks & 15) === 0){
      const t = nowMs();
      if(t - last > 250){ last = t; if(ctl && ctl.status) ctl.status(sink.count.toLocaleString('en-IN') + ' rows read…'); await breathe(); }
    }
  }
  feedSniffed(dc.decode(), true);
  if(field !== '' || row.length) endRow();
}

/* --- public entry point ---------------------------------------------------
   readTable(file, expectedHeaders, ctl) -> { rows, headerIndex, hits,
                                              dropped, rawRows, columns }
   ctl.status(msg) is called a few times a second while the file streams.
   -------------------------------------------------------------------------- */
async function readTable(file, expected, ctl){
  const sink = makeSink(expected, ctl);
  if(/\.(csv|tsv|txt)$/i.test(file.name)) await streamCsv(file, sink, ctl);
  else await streamXlsx(file, sink, ctl);
  return sink.finish();
}

/* ============================================================================
   Shared conventions — returns netted, institutional accounts excluded,
   price tiers from realised unit price, affinity on paid lines only.
   ========================================================================== */

const INSTITUTIONAL = /HIDESIGN|PVT|PRIVATE|LTD|LIMITED|LLP|RETAIL|HOSPITALITY|^CUSTOMER$|TEST|DUMMY|KARNATAKA|MAHARASHTRA|DELHI|UTTAR|TAMIL|KERALA|GUJARAT|PUNJAB|ANDHRA|TELANGANA|ASSAM|GOA|JHARKHAND|ODISHA|BIHAR|RAJASTHAN|HARYANA|CHANDIGARH|BENGAL/i;

const nz = v => { if(v==null||v==='') return NaN;
  if(typeof v==='number') return v;
  const n = parseFloat(String(v).replace(/[₹,\s]/g,'')); return isNaN(n)?NaN:n; };
const s0  = v => { const n = nz(v); return isNaN(n)?0:n; };
const rnd = (v,d=0) => (v==null||!isFinite(v))?null:(d?Math.round(v*10**d)/10**d:Math.round(v));

function normLeather(v){ if(v==null||v==='') return null;
  let x = String(v).toUpperCase().split('/')[0].trim();
  if(x==='REG'||x==='REGULAR') return 'REGULAR';
  return x || null; }

/* Dates arrive already normalised by normalizeDates() at load time.
   Strings are parsed day-first (13/04/2026); ISO strings as written. */
function fixBillDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return new Date(Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate()));
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  const d = new Date(s); return isNaN(d)?null:d;
}

/* Some POS exports ship with day/month transposed on days 1-12 (those cells
   become Dates) while days 13+ stay DD/MM strings. Whether a file is
   transposed is DETECTED per file, never assumed: if any Date cell carries a
   day above 12, the dates are genuine and must not be swapped. */
function normalizeDates(rows){
  if(!rows || !rows.length) return rows;
  const key = pick(rows[0], ['BillDate','Bill Date','Order Date','date']);
  if(!key) return rows;
  let dCount = 0, dGt12 = 0;
  const step = Math.max(1, Math.floor(rows.length/5000));
  for(let i = 0; i < rows.length; i += step){
    const v = rows[i][key];
    if(v instanceof Date && !isNaN(v)){ dCount++; if(v.getUTCDate() > 12) dGt12++; }
  }
  const swap = dCount > 0 && dGt12 === 0;
  rows.forEach(r => {
    const v = r[key];
    if(v instanceof Date && !isNaN(v)){
      r[key] = swap ? new Date(Date.UTC(v.getUTCFullYear(), v.getUTCDate()-1, v.getUTCMonth()+1))
                    : new Date(Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate()));
    }
  });
  return rows;
}

function pick(obj, names){
  const keys = Object.keys(obj);
  for(const n of names){
    const hit = keys.find(k => k.toLowerCase().trim() === n.toLowerCase());
    if(hit) return hit;
  }
  for(const n of names){
    const hit = keys.find(k => k.toLowerCase().includes(n.toLowerCase()));
    if(hit) return hit;
  }
  return null;
}
