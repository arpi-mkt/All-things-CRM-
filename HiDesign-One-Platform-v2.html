  ['mc-sender','mc-signoff','mc-link','mc-offer'].forEach(id => {
    const e = document.getElementById(id);
    if(e) e.addEventListener('change', () => {
      MSG_CFG.sender = document.getElementById('mc-sender').value;
      MSG_CFG.signoff = document.getElementById('mc-signoff').value;
      MSG_CFG.link = document.getElementById('mc-link').value.trim();
      MSG_CFG.offerText = document.getElementById('mc-offer').value.trim();
      drawJourney();
    });
  });
  const al = document.getElementById('mc-allow');
  if(al) al.onchange = () => { MSG_CFG.allowOffer = al.checked; drawJourney(); };
  el.querySelectorAll('.chtab[data-ch]').forEach(b => b.onclick = () => { SV.ch = b.dataset.ch; drawJourney(); });

  drawChannel(M, ctx, c);
}

function drawChannel(M, ctx, c){
  const b = document.getElementById('mc-body');
  if(!b) return;
  const box = (label, text, note) =>
    '<div style="margin-top:10px"><label>' + label + '</label>'
    + '<textarea class="mc-out" style="width:100%;min-height:' + (text.length > 300 ? 170 : 92) + 'px">' + esc(text) + '</textarea>'
    + (note ? '<div class="note">' + note + '</div>' : '') + '</div>';

  let h = '';
  if(SV.ch === 'whatsapp')
    h = box('WhatsApp', M.whatsapp,
        M.whatsapp.length + ' characters. Outside the 24-hour service window this must go as an approved template — '
        + 'the variable parts are the name, the item and the store, so one template covers every customer in this play.');
  else if(SV.ch === 'sms')
    h = box('SMS · ' + M.sms.length + '/160', M.sms,
        'Counted without the sender ID your aggregator prepends. Keep any link short — a long URL alone can cost you a second SMS.');
  else if(SV.ch === 'rcs')
    h = box('RCS card title · ' + M.rcs.title.length + '/60', M.rcs.title)
      + box('RCS description · ' + M.rcs.description.length + '/180', M.rcs.description)
      + '<div class="note" style="margin-top:6px">Suggested replies: ' + M.rcs.buttons.map(x => '<span class="chip">' + esc(x) + '</span>').join('')
      + '<br>RCS falls back to SMS on unsupported handsets — use the SMS tab copy as that fallback so the message still lands.</div>';
  else if(SV.ch === 'email')
    h = '<div style="margin-top:10px"><label>Subject lines — test the first two against each other</label>'
      + M.email.subjects.map(s => '<div><input class="mc-out" value="' + esc(s) + '" style="width:100%;margin-bottom:4px"></div>').join('')
      + '</div>' + box('Preview text', M.email.preview) + box('Body', M.email.body);
  else
    h = box('Store call script — read down the page, do not read it out loud verbatim',
        M.call.map((l,i) => (i+1) + '. ' + l).join('\n'),
        'Written for the person on the shop floor: who this customer is, what they bought, what to offer and what not to say.');

  h += '<div class="actions"><button class="act sec" id="mc-copy">Copy this</button>'
     + '<button class="act sec" id="mc-all">Copy every channel</button>'
     + '<button class="act" id="mc-ai">Rewrite with AI</button>'
     + '<span class="note" id="mc-status" style="margin-left:8px"></span></div>'
     + '<div class="note">The drafts are built here in your browser from this customer\'s own purchases, so they always work. '
     + '<b>Rewrite with AI</b> polishes the wording and needs the Cowork runtime — if it is unavailable the draft above stands on its own.</div>';

  b.innerHTML = h;

  const allText = () =>
      'WHATSAPP\n' + M.whatsapp
    + '\n\nSMS (' + M.sms.length + '/160)\n' + M.sms
    + '\n\nRCS\nTitle: ' + M.rcs.title + '\nDescription: ' + M.rcs.description + '\nButtons: ' + M.rcs.buttons.join(' | ')
    + '\n\nEMAIL\nSubject options: ' + M.email.subjects.join('  /  ') + '\nPreview: ' + M.email.preview + '\n\n' + M.email.body
    + '\n\nSTORE CALL SCRIPT\n' + M.call.map((l,i) => (i+1) + '. ' + l).join('\n');

  const say = t => { const s = document.getElementById('mc-status'); if(s){ s.textContent = t; setTimeout(()=>{ if(s) s.textContent=''; }, 2500); } };
  const copy = txt => {
    try{ navigator.clipboard.writeText(txt); say('Copied.'); }
    catch(e){ const ta = b.querySelector('textarea'); if(ta){ ta.select(); document.execCommand('copy'); say('Copied.'); } }
  };
  document.getElementById('mc-copy').onclick = () => {
    /* RCS and Email are several fields — copy the whole channel, labelled */
    const fs = [...b.querySelectorAll('.mc-out')];
    if(!fs.length) return;
    if(fs.length === 1){ copy(fs[0].value !== undefined ? fs[0].value : fs[0].textContent); return; }
    copy(fs.map(f => {
      const lab = f.closest('div') && f.closest('div').querySelector('label');
      const val = f.value !== undefined ? f.value : f.textContent;
      return (lab ? lab.textContent.replace(/ ·.*$/,'') + '\n' : '') + val;
    }).join('\n\n'));
  };
  document.getElementById('mc-all').onclick = () => copy(allText());
  document.getElementById('mc-ai').onclick = () => aiRewrite(M, ctx, c, say);
}

async function aiRewrite(M, ctx, c, say){
  const b = document.getElementById('mc-body');
  const cur = b.querySelector('.mc-out');
  if(!cur){ return; }
  say('rewriting…');
  await RT.p;
  if(!aiReady()){
    say('Claude is not reachable in this view — the draft above is ready to use as it is.');
    return;
  }
  const brief = {
    channel: SV.ch,
    play: ctx.play, reason: ctx.why,
    customer: {
      first_name: firstName((c.rows && c.rows[0]) ? c.rows[0].cname : ''),
      bills: c.nbills, lifetime_spend: Math.round(c.spend),
      days_since_last: c.recency,
      last_item: ctx.lastItem, last_category: ctx.lastCat, last_collection: ctx.lastColl,
      last_store: ctx.lastStore, preferred_leather: ctx.domLea,
      recommended_next: ctx.nba ? ctx.nba.to : null
    },
    settings: MSG_CFG,
    current_draft: (cur.value !== undefined ? cur.value : cur.textContent)
  };
  const rules =
`You write CRM messages for HiDesign, an Indian premium leather goods brand.
Rewrite the draft for the stated channel. Rules:
- Understated and factual. No exclamation marks, no "Hurry", no invented urgency, no emoji unless the draft already has one.
- Use only the facts in the brief. Never invent a product name, price, discount, date or store event.
- If settings.allowOffer is false, mention no discount at all.
- SMS: hard limit 160 characters. WhatsApp: under 400. RCS title under 60, description under 180.
- The store call script is instructions to a shop-floor colleague, not a script to read aloud.
- Return only the rewritten message. No preamble, no explanation, no quotes around it.`;
  try{
    const r = await aiAsk(rules, [JSON.stringify(brief)]);
    const t = (typeof r === 'string') ? r : (r && r.text ? r.text : '');
    if(!t || looksLikeError(t)){ say('AI did not return usable copy — the draft stands.'); return; }
    if(cur.value !== undefined) cur.value = t.trim(); else cur.textContent = t.trim();
    say('Rewritten. Edit freely before sending.');
  }catch(e){ say('AI layer unreachable — the draft stands.'); }
}

/* ------------------------------------------------------------------ exports */
function exportScorecard(){
  const ST = D.stores; if(!ST) return;
  const head = ['Store','Revenue','Bills','Customers','AvgBill','ItemsPerBill','RepeatCustomers','OneTimeCustomers',
    'RepeatRate','RevenueFromRepeats','RevenueShareFromRepeats','RepeatRateWithBrand','NewToBrandHere',
    'Lapsed90Plus','AlsoShopElsewhere','TopCategory','TopLeather','TopCollection','FirstSale','LastSale'];
  const lines = [head.join(',')];
  ST.stores.forEach(s => lines.push([s.name, Math.round(s.rev), s.bills, s.customers,
    Math.round(s.avgBill||0), (s.itemsPerBill||0).toFixed(2), s.repeat, s.oneTime,
    (s.repeatRate==null?'':(s.repeatRate*100).toFixed(1)), Math.round(s.repRev),
    (s.repRevShare==null?'':(s.repRevShare*100).toFixed(1)),
    (s.brandRepeatRate==null?'':(s.brandRepeatRate*100).toFixed(1)),
    s.newHere, s.lapsed90, s.alsoElsewhere, s.topCat||'', s.topLea||'', s.topColl||'',
    dstr(s.first), dstr(s.last)].map(csvCell).join(',')));
  downloadText('hidesign_store_scorecard.csv', lines.join('\n'));
}

function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function exportList(withMessages){
  const { s, list } = storeRows();
  if(!s) return;
  const byCust = new Map(); (C360 && C360.custs ? C360.custs : []).forEach(c => byCust.set(c.cust, c));
  const head = ['CustomerCode','Name','Store','SpendAtStore','BillsAtStore','BillsWithBrand','LifetimeSpend',
    'FirstVisitHere','LastVisitHere','DaysSince','Repeat','Flags'];
  if(withMessages) head.push('Play','Why','WhatsApp','SMS','RCSTitle','RCSDescription','EmailSubject','EmailBody','CallScript');
  const lines = [head.join(',')];
  const cap = withMessages ? 3000 : 100000;
  list.slice(0, cap).forEach(r => {
    const row = [r.cust, r.name, s.name, Math.round(r.spend), r.bills, r.brandBills, Math.round(r.brandSpend),
      dstr(r.first), dstr(r.last), r.rec == null ? '' : r.rec, r.bills >= 2 ? 'Repeat' : 'One-time',
      [r.uhni?'UHNI':(r.hni?'HNI':(r.ltvHigh?'High LTV':'')), (r.rec!=null&&r.rec>=180)?'Lapsed':''].filter(Boolean).join(' ')];
    if(withMessages){
      const c = byCust.get(r.cust);
      if(c){
        const J = customerJourney(c), ctx = pickPlay(c, J), M = buildMessages(c, ctx, J);
        row.push(ctx.play, ctx.why, M.whatsapp, M.sms, M.rcs.title, M.rcs.description,
                 M.email.subjects[0], M.email.body, M.call.map((l,i)=>(i+1)+'. '+l).join(' '));
      } else row.push('','','','','','','','','');
    }
    lines.push(row.map(csvCell).join(','));
  });
  const note = (withMessages && list.length > cap)
    ? '\n' + csvCell('NOTE: messages were drafted for the first ' + cap + ' customers of ' + list.length + ' — narrow the filter and export again for the rest.') : '';
  downloadText('hidesign_' + slug(s.name) + (withMessages ? '_messages' : '_customers') + '.csv', lines.join('\n') + note);
}
