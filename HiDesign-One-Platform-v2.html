<script>
/* ============================================================================
   SEGMENT STUDIO — compute layer.
   prepareSales normalises the sales file into consumer rows + customer roll-up;
   buildStudio computes live counts/revenue for every segment the data supports,
   plus bill-level basket analysis. Anything it cannot compute is reported as a
   missing field, never faked.
   ========================================================================== */
function prepareSales(salesRows, itemRows){
  if(!salesRows || !salesRows.length) return null;
  const r0 = salesRows[0];
  const S = { date:pick(r0,['BillDate','Bill Date','Order Date','date']),
    bill:pick(r0,['Bill No','BillNo','Bill Number','BillNumber']),
    btype:pick(r0,['Bill Type']),
    cust:pick(r0,['CustomerCode','Customer Code','Customer ID','customer']),
    cname:pick(r0,['CustomerName','Customer Name']),
    qty:pick(r0,['Quantity','Qty']), amt:pick(r0,['Amount','Order Value','value']),
    prod:pick(r0,['AlternateProductCodes','AlternateProductCode','Product Code','EAN']),
    cat:pick(r0,['CAT_IM','CAT','Category','Product Category']),
    sub:pick(r0,['SUBCAT_IM','SUB CAT','SUBCAT','Sub Category']),
    style:pick(r0,['STYLE_IM','STYLE','Style']),
    coll:pick(r0,['COLL_IM','COLL','Collection']),
    cfnd:pick(r0,['CFND_IM','Core / Seasonal']),
    lea:pick(r0,['LEATHER_IM','Leather','Material']),
    store:pick(r0,['Store','Location','Branch','Site','Outlet']),
    color:pick(r0,['Color','Colour']) };
  if(!S.cust || !S.amt) return null;

  const notes = [];
  let im = null;
  if(itemRows && itemRows.length){
    const i0 = itemRows[0];
    const I = { pc:pick(i0,['Product Code']), coll:pick(i0,['Collection']),
      lea:pick(i0,['Leather']), cs:pick(i0,['Core / Seasonal']),
      gender:pick(i0,['Gender']), occ:pick(i0,['OCCASION','Occasion']), mrp:pick(i0,['MRP']) };
    if(I.pc){ im = {}; itemRows.forEach(r => { const k = String(r[I.pc]||'').trim();
      if(k && !im[k]) im[k] = { collection:I.coll?r[I.coll]:null, leather:I.lea?r[I.lea]:null,
        core:I.cs?r[I.cs]:null, gender:I.gender?r[I.gender]:null,
        occasion:I.occ?r[I.occ]:null, mrp:I.mrp?nz(r[I.mrp]):null }; }); }
  }

  let rows = salesRows.map(r => {
    const d  = fixBillDate(r[S.date]);
    const pc = S.prod ? String(r[S.prod]||'').trim() : null;
    const en = (im && pc && im[pc]) ? im[pc] : null;
    return { date:d, bill:S.bill?String(r[S.bill]||''):'',
      btype:S.btype?String(r[S.btype]||'Sales'):'Sales',
      cust:r[S.cust], cname:String(r[S.cname]||''),
      qty:s0(r[S.qty])||1, amt:s0(r[S.amt]),
      cat:S.cat?String(r[S.cat]||'Unknown').trim():'Unknown',
      sub:S.sub?String(r[S.sub]||'').trim():'',
      style:S.style?String(r[S.style]||'').trim():'',
      store:S.store?String(r[S.store]||'').trim():'',
      coll:S.coll?(r[S.coll]?String(r[S.coll]).trim():(en?en.collection:null)):(en?en.collection:null),
      cfnd:S.cfnd?String(r[S.cfnd]||'').trim().toUpperCase():(en&&en.core?String(en.core).toUpperCase():''),
      leather:normLeather(S.lea?r[S.lea]:(en?en.leather:null)),
      color:S.color?String(r[S.color]||'').trim():'',
      occasion:en&&en.occasion?String(en.occasion).trim():null,
      gender:en&&en.gender?String(en.gender).trim():null,
      mrp:(en&&isFinite(en.mrp))?en.mrp:null };
  }).filter(r => r.cust != null && r.cust !== '');

  const dates = rows.map(r => r.date).filter(Boolean);
  let nMonths = 0;
  if(dates.length){
    let mnT = Infinity, mxT = -Infinity;
    dates.forEach(d => { const t = +d; if(t < mnT) mnT = t; if(t > mxT) mxT = t; });
    const mn = new Date(mnT), mx = new Date(mxT);
    const months = new Set(dates.map(d => d.getUTCFullYear()+'-'+d.getUTCMonth()));
    nMonths = months.size;
    notes.push('Date range '+mn.toISOString().slice(0,10)+' to '+mx.toISOString().slice(0,10)+' ('+months.size+' calendar month(s) present).');
  } else notes.push('No usable purchase dates found — recency and lapsed segments cannot be built.');

  const returns = rows.filter(r => /return/i.test(r.btype));
  if(returns.length){
    notes.push(returns.length+' sales-return rows totalling '+Math.round(returns.reduce((a,r)=>a+r.amt,0)).toLocaleString('en-IN')+' excluded (net basis).');
    rows = rows.filter(r => !/return/i.test(r.btype));
  }

  const gross = rows.reduce((a,r) => a + r.amt, 0);
  const inst  = rows.filter(r => INSTITUTIONAL.test(r.cname));
  if(inst.length){
    const ic = new Set(inst.map(r => r.cust)).size, ia = inst.reduce((a,r) => a + r.amt, 0);
    notes.push(ic+' institutional/internal accounts carrying '+Math.round(ia).toLocaleString('en-IN')+' ('+(ia/gross*100).toFixed(1)+'% of gross) excluded from consumer segmentation — see the Corporate gifting segment.');
  }
  const cons = rows.filter(r => !INSTITUTIONAL.test(r.cname));
  if(!cons.length) return null;

  const up  = cons.map(r => r.qty ? r.amt/r.qty : NaN).filter(isFinite).sort((a,b) => a-b);
  const qAt = p => up[Math.floor((up.length-1)*p)];
  const t1 = qAt(.33), t2 = qAt(.66);
  cons.forEach(r => { const p = r.qty ? r.amt/r.qty : NaN;
    r.tier = !isFinite(p) ? null : (p < t1 ? 'Value' : (p < t2 ? 'Core' : 'Premium')); });
  notes.push('Price tiers cut at '+Math.round(t1).toLocaleString('en-IN')+' / '+Math.round(t2).toLocaleString('en-IN')+' (33rd/66th percentile of realised unit price).');

  const cm = new Map();
  cons.forEach(r => { let c = cm.get(r.cust);
    if(!c){ c = { cust:r.cust, spend:0, units:0, bills:new Set(), last:null }; cm.set(r.cust, c); }
    c.spend += r.amt; c.units += r.qty; if(r.bill) c.bills.add(r.bill);
    if(r.date && (!c.last || r.date > c.last)) c.last = r.date; });
  const custs = [...cm.values()];
  custs.forEach(c => c.nbills = c.bills.size || 1);

  const single = custs.filter(c => c.nbills <= 1).length / custs.length;
  if(nMonths < 3) notes.push('Only '+nMonths+' calendar month(s) of sales data: '+Math.round(single*100)+'% of customers appear exactly once, so recency/frequency segments are truncated. Composition-based segments (category, leather, collection, price behaviour) are unaffected.');

  return { cons, custs, nMonths, notes,
    institutional: { customers:new Set(inst.map(r=>r.cust)).size, revenue:rnd(inst.reduce((a,r)=>a+r.amt,0)) },
    meta:{ sales_rows:cons.length, consumers:custs.length,
      consumer_revenue:rnd(cons.reduce((a,r)=>a+r.amt,0)), n_months:nMonths } };
}

const TIER1_CITIES = /^(mumbai|navi mumbai|thane|delhi|new delhi|noida|gurgaon|gurugram|ghaziabad|faridabad|bangalore|bengaluru|chennai|kolkata|hyderabad|secunderabad|pune|ahmedabad)$/i;

const CAT_PATTERNS = {
  'cat-womens-bags' : /\bwomen|ladies|\bher\b/i,
  'cat-mens-bags'   : /\bmen(?!o)|gents|\bhis\b/i,
  'cat-wallets'     : /wallet|card ?(case|holder)|coin ?purse|money ?clip/i,
  'cat-briefcases'  : /brief ?case|portfolio|attache/i,
  'cat-totes'       : /\btote/i,
  'cat-laptop-bags' : /laptop|computer|macbook|office ?bag|work ?bag/i,
  'cat-crossbody'   : /cross ?body/i,
  'cat-slings'      : /sling/i,
  'cat-duffles'     : /duffle|duffel|weekender|luggage|trolley|travel ?bag|strolley/i,
  'cat-footwear'    : /footwear|shoe|sandal|loafer|sneaker|moccasin|flip ?flop/i,
  'cat-stationery'  : /stationer|diary|journal|notebook|\bpen\b|planner|organiser|organizer/i,
  'cat-brand-ext'   : /fragrance|perfume|apparel|jacket|scarf|stole|jewel|watch|sungl|eyewear|keychain|key ?ring|passport|luggage ?tag/i
};

const OCC_PATTERNS = {
  'occ-work'     : /work|office|business|formal|corporate/i,
  'occ-travel'   : /travel|voyage|journey|trip|weekend/i,
  'occ-party'    : /party|evening|festive|occasion ?wear|celebration/i,
  'occ-everyday' : /everyday|casual|daily|day ?to ?day|regular/i,
  'occ-gifting'  : /gift|present/i
};

const COLL_PATTERNS = {
  'coll-atelier' : /atelier/i,
  'coll-harlem'  : /harlem/i,
  'coll-otr'     : /\botr\b|on ?the ?road/i,
  'coll-kawaii'  : /kawaii/i,
  'coll-lp'      : /\blp\b|leather ?press|limited ?press/i
};

function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,32); }

function buildStudio(cons, custs, nMonths, custMaster){
  const live = {}, fields = {}, dyn = {};

  /* ---- which raw fields do we actually have? ---- */
  const anyRow = k => cons.some(r => r[k] != null && r[k] !== '');
  fields.category   = anyRow('cat');
  fields.subcategory= anyRow('sub');
  fields.style      = anyRow('style');
  fields.collection = anyRow('coll');
  fields.leather    = anyRow('leather');
  fields.occasion   = anyRow('occasion');
  fields.gender     = anyRow('gender');
  fields.core       = anyRow('cfnd');
  fields.color      = anyRow('color');
  fields.bill       = anyRow('bill');
  fields.date       = cons.some(r => r.date);
  fields.mrp        = cons.some(r => isFinite(r.mrp) && r.mrp > 0);
  fields.loyalty    = false; fields.city = false; fields.custgender = false; fields.optin = false;

  /* ---- rows per customer ---- */
  const rowsBy = new Map();
  cons.forEach(r => { let a = rowsBy.get(r.cust); if(!a){ a = []; rowsBy.set(r.cust, a); } a.push(r); });

  const dts  = cons.map(r => r.date).filter(Boolean);
  let maxT = -Infinity; dts.forEach(d => { if(+d > maxT) maxT = +d; });
  const maxD = dts.length ? new Date(maxT) : null;

  /* ---- customer master enrichment (optional file) ---- */
  let cmInfo = null;
  if(custMaster && custMaster.length){
    const c0 = custMaster[0];
    const F = {
      id     : pick(c0, ['CustomerCode','Customer Code','Customer ID','CustomerID','Code']),
      tier   : pick(c0, ['Loyalty Tier','LoyaltyTier','Tier','Membership','Member Tier','Grade','Category']),
      city   : pick(c0, ['City','Town','CustomerCity']),
      state  : pick(c0, ['State','Region']),
      gender : pick(c0, ['Gender','Sex']),
      email  : pick(c0, ['Email','EmailID','Email ID','Email Opt In','EmailOptIn']),
      mobile : pick(c0, ['Mobile','Phone','MobileNo','Mobile No','Contact']),
      wa     : pick(c0, ['WhatsApp','Whatsapp Opt In','WA Opt In','WhatsAppOptIn']),
      joined : pick(c0, ['Registration Date','Join Date','Enrolled','Member Since','CreatedOn'])
    };
    if(F.id){
      cmInfo = new Map();
      custMaster.forEach(r => {
        const k = String(r[F.id] || '').trim();
        if(!k || cmInfo.has(k)) return;
        cmInfo.set(k, {
          tier   : F.tier   ? String(r[F.tier]   || '').trim() : null,
          city   : F.city   ? String(r[F.city]   || '').trim() : null,
          state  : F.state  ? String(r[F.state]  || '').trim() : null,
          gender : F.gender ? String(r[F.gender] || '').trim() : null,
          email  : F.email  ? String(r[F.email]  || '').trim() : null,
          mobile : F.mobile ? String(r[F.mobile] || '').trim() : null,
          wa     : F.wa     ? String(r[F.wa]     || '').trim() : null
        });
      });
      fields.loyalty    = !!F.tier;
      fields.city       = !!F.city;
      fields.custgender = !!F.gender;
      fields.optin      = !!(F.email || F.mobile || F.wa);
    }
  }

  /* ---- customer-level attributes ---- */
  const spends = custs.map(c => c.spend).sort((a,b) => a-b);
  const pctAt  = p => spends[Math.min(spends.length-1, Math.floor(spends.length * p))];
  const p999 = pctAt(0.999), p99 = pctAt(0.99), p80 = pctAt(0.80), p50 = pctAt(0.50);

  custs.forEach(c => {
    const rs = rowsBy.get(c.cust) || [];
    c.rows = rs;
    c.segIds = [];
    const paid = rs.filter(r => r.amt > 0);
    const basis = paid.length ? paid : rs;

    c.text     = basis.map(r => [r.cat, r.sub, r.style].join(' ')).join(' | ');
    c.catSet   = new Set(basis.map(r => r.cat).filter(Boolean));
    c.collSet  = new Set(basis.map(r => r.coll).filter(Boolean));
    c.leaSet   = new Set(basis.map(r => r.leather).filter(Boolean));
    c.occText  = basis.map(r => r.occasion).filter(Boolean).join(' | ');
    c.collText = [...c.collSet].join(' | ');

    const gr = {}; basis.forEach(r => { if(r.gender) gr[r.gender] = (gr[r.gender]||0) + r.amt; });
    const grTot = Object.values(gr).reduce((a,b)=>a+b, 0);
    c.genderMix = grTot ? Object.keys(gr).sort((a,b)=>gr[b]-gr[a])[0] : null;
    c.genderShare = grTot ? gr[c.genderMix]/grTot : null;

    const tr = {}; basis.forEach(r => { if(r.tier) tr[r.tier] = (tr[r.tier]||0) + r.amt; });
    c.domTier = Object.keys(tr).length ? Object.keys(tr).sort((a,b)=>tr[b]-tr[a])[0] : null;

    const cs = {}; basis.forEach(r => { if(r.cfnd) cs[r.cfnd] = (cs[r.cfnd]||0) + r.amt; });
    c.domCore = Object.keys(cs).length ? Object.keys(cs).sort((a,b)=>cs[b]-cs[a])[0] : null;

    let paidV = 0, mrpV = 0;
    basis.forEach(r => { if(isFinite(r.mrp) && r.mrp > 0 && r.qty){ paidV += r.amt; mrpV += r.mrp * r.qty; } });
    c.realisation = mrpV > 0 ? paidV / mrpV : null;

    c.recency = (maxD && c.last) ? Math.round((maxD - c.last) / 86400000) : null;
    c.hni     = c.spend >= p99;
    c.uhni    = c.spend >= p999;
    c.ltvHigh = c.spend >= p80;
    c.ltvLow  = c.spend <  p50;

    const info = cmInfo ? cmInfo.get(String(c.cust).trim()) : null;
    c.mTier   = info ? info.tier   : null;
    c.mCity   = info ? info.city   : null;
    c.mGender = info ? info.gender : null;
    c.hasEmail  = !!(info && info.email  && /@/.test(info.email));
    c.hasMobile = !!(info && info.mobile && String(info.mobile).replace(/\D/g,'').length >= 10);
    c.hasWa     = !!(info && info.wa && /^(y|yes|true|1|opt)/i.test(info.wa));
  });

  /* ---- segment builder ---- */
  const nCust = custs.length || 1;
  const totalRev = custs.reduce((a,c) => a + c.spend, 0) || 1;

  function mk(id, sel){
    let grp;
    try { grp = custs.filter(sel); } catch(e){ return; }
    if(!grp.length) return;
    grp.forEach(c => c.segIds.push(id));
    const rev = grp.reduce((a,c) => a + c.spend, 0);
    const styleRev = {}, collRev = {}, catRev = {};
    grp.forEach(c => c.rows.forEach(r => {
      if(r.amt <= 0) return;
      if(r.style) styleRev[r.style] = (styleRev[r.style]||0) + r.amt;
      if(r.coll)  collRev[r.coll]   = (collRev[r.coll]||0)   + r.amt;
      if(r.cat)   catRev[r.cat]     = (catRev[r.cat]||0)     + r.amt;
    }));
    const topN = (o,n) => Object.entries(o).sort((a,b) => b[1]-a[1]).slice(0,n)
      .map(([v,rv]) => ({ v, rev: rnd(rv) }));
    live[id] = {
      size: grp.length,
      share: rnd(grp.length / nCust, 4),
      revenue: rnd(rev),
      rev_share: rnd(rev / totalRev, 4),
      avg_spend: rnd(rev / grp.length),
      repeat_rate: rnd(grp.filter(c => c.nbills > 1).length / grp.length, 3),
      avg_units: rnd(grp.reduce((a,c) => a + c.units, 0) / grp.length, 2),
      top_styles: topN(styleRev, 3),
      top_collections: topN(collRev, 3),
      top_categories: topN(catRev, 3)
    };
  }

  /* A. category */
  if(fields.category){
    Object.keys(CAT_PATTERNS).forEach(id => mk(id, c => CAT_PATTERNS[id].test(c.text)));
  }
  /* B. occasion */
  if(fields.occasion){
    Object.keys(OCC_PATTERNS).forEach(id => mk(id, c => OCC_PATTERNS[id].test(c.occText)));
  }
  /* C. collection */
  if(fields.collection){
    Object.keys(COLL_PATTERNS).forEach(id => mk(id, c => COLL_PATTERNS[id].test(c.collText)));
  }
  /* D. value */
  mk('val-uhni',      c => c.uhni);
  mk('val-hni',       c => c.hni);
  mk('val-ltv-high',  c => c.ltvHigh);
  mk('val-ltv-low',   c => c.ltvLow);
  mk('val-premium',   c => c.domTier === 'Premium');
  mk('val-core-tier', c => c.domTier === 'Core');
  mk('val-value-tier',c => c.domTier === 'Value');
  if(fields.mrp){
    mk('val-fullprice', c => c.realisation != null && c.realisation >= 0.95);
    mk('val-discount',  c => c.realisation != null && c.realisation <  0.85);
  }
  /* E. lifecycle */
  mk('lc-first',      c => c.nbills <= 1);
  mk('lc-repeat',     c => c.nbills === 2 || c.nbills === 3);
  mk('lc-loyal',      c => c.nbills >= 4);
  mk('lc-single-cat', c => c.catSet.size <= 1);
  mk('lc-multi-cat',  c => c.catSet.size >= 2);
  if(fields.date){
    mk('lc-active-30',  c => c.recency != null && c.recency <= 30);
    mk('lc-lapsed-90',  c => c.recency != null && c.recency >= 90);
    mk('lc-lapsed-180', c => c.recency != null && c.recency >= 180);
  }
  /* F. material */
  if(fields.core){
    mk('mat-core',     c => /CORE/i.test(c.domCore || ''));
    mk('mat-seasonal', c => /SEAS/i.test(c.domCore || ''));
  }
  /* G. cross-sell by product gender */
  if(fields.gender){
    mk('xs-men-to-women', c => c.genderMix && /^m/i.test(c.genderMix) && c.genderShare >= 0.7);
    mk('xs-women-to-men', c => c.genderMix && /^(w|f|l)/i.test(c.genderMix) && c.genderShare >= 0.7);
    mk('gen-men',   c => c.genderMix && /^m/i.test(c.genderMix));
    mk('gen-women', c => c.genderMix && /^(w|f|l)/i.test(c.genderMix));
  }
  /* H. loyalty tier (needs customer master) */
  if(fields.loyalty){
    mk('loy-platinum', c => /platin/i.test(c.mTier || ''));
    mk('loy-gold',     c => /gold/i.test(c.mTier || ''));
    mk('loy-silver',   c => /silver/i.test(c.mTier || ''));
    mk('loy-member',   c => !!(c.mTier));
  }
  /* I. geography */
  if(fields.city){
    mk('geo-tier1', c => TIER1_CITIES.test(String(c.mCity || '').trim()));
    mk('geo-tier2', c => !!c.mCity && !TIER1_CITIES.test(String(c.mCity).trim()));
  }
  /* J. reachability */
  if(fields.optin){
    mk('ch-email',    c => c.hasEmail);
    mk('ch-sms',      c => c.hasMobile);
    mk('ch-whatsapp', c => c.hasWa);
  }

  /* ---- dynamic affinity segments (leather / collection / category, top by revenue) ---- */
  function dynGroup(key, label, accessor, max){
    const rev = {};
    cons.forEach(r => { if(r.amt <= 0) return; const v = accessor(r); if(!v) return;
      rev[v] = (rev[v] || 0) + r.amt; });
    const top = Object.entries(rev).sort((a,b) => b[1]-a[1]).slice(0, max).map(e => e[0]);
    dyn[key] = top.map(v => {
      const grp = custs.filter(c => c.rows.some(r => r.amt > 0 && accessor(r) === v));
      const rv  = grp.reduce((a,c) => a + c.spend, 0);
      const own = grp.reduce((a,c) => a + c.rows.filter(r => accessor(r) === v)
        .reduce((x,r) => x + Math.max(0, r.amt), 0), 0);
      return { value: v, id: key + '-' + slug(v), label: label,
        size: grp.length, revenue: rnd(own), customer_revenue: rnd(rv),
        avg_spend: rnd(rv / (grp.length || 1)),
        repeat_rate: rnd(grp.filter(c => c.nbills > 1).length / (grp.length || 1), 3) };
    }).filter(o => o.size > 0);
  }
  if(fields.leather)    dynGroup('leather',    'Leather affinity',    r => r.leather, 8);
  if(fields.collection) dynGroup('collection', 'Collection affinity', r => r.coll,    8);
  if(fields.category)   dynGroup('category',   'Category buyer',      r => r.cat,     12);

  /* ---- basket analysis: bill-level category co-purchase ---- */
  let basket = [], nextBest = [], nBills = 0;
  if(fields.bill && fields.category){
    const billCats = {};
    cons.forEach(r => { if(!r.bill || r.amt <= 0 || !r.cat) return;
      (billCats[r.bill] = billCats[r.bill] || new Set()).add(r.cat); });
    const bills = Object.values(billCats), nB = bills.length;
    const supp = {}, pair = {};
    bills.forEach(s => {
      const a = [...s];
      a.forEach(x => supp[x] = (supp[x] || 0) + 1);
      for(let i = 0; i < a.length; i++) for(let j = i+1; j < a.length; j++){
        const k = [a[i], a[j]].sort().join('||');
        pair[k] = (pair[k] || 0) + 1;
      }
    });
    const minB = Math.max(5, Math.round(nB * 0.0005));
    basket = Object.entries(pair).filter(e => e[1] >= minB).map(([k,n]) => {
      const [a,b] = k.split('||');
      const pa = supp[a]/nB, pb = supp[b]/nB, pab = n/nB;
      return { a, b, bills: n, support: rnd(pab, 4), lift: rnd(pab/(pa*pb), 2),
        conf_a_to_b: rnd(n/supp[a], 3), conf_b_to_a: rnd(n/supp[b], 3) };
    }).sort((x,y) => y.lift - x.lift).slice(0, 25);

    const best = {};
    Object.entries(pair).filter(e => e[1] >= minB).forEach(([k,n]) => {
      const [a,b] = k.split('||');
      [[a,b,n/supp[a]], [b,a,n/supp[b]]].forEach(([from,to,conf]) => {
        if(!best[from] || best[from].conf < conf) best[from] = { from, to, conf: rnd(conf,3), bills: n };
      });
    });
    nextBest = Object.values(best).sort((x,y) => y.conf - x.conf).slice(0, 15);
    nBills = nB;
  }

  /* ---- readiness ---- */
  const gaps = [];
  if(!fields.occasion) gaps.push({ field: 'OCCASION on the item master', unlocks: 'Work / Travel / Party / Everyday / Gifting edits — 5 segments', where: 'Item master export' });
  if(!fields.gender)   gaps.push({ field: 'Gender on the item master', unlocks: 'Men vs Women buyers and both cross-sell gifting journeys — 4 segments', where: 'Item master export' });
  if(!fields.mrp)      gaps.push({ field: 'MRP on the item master', unlocks: 'Full-price vs EOSS/discount buyer split — 2 segments, and margin-aware targeting', where: 'Item master export' });
  if(!fields.loyalty)  gaps.push({ field: 'Loyalty tier per customer', unlocks: 'Platinum / Gold / Silver / member journeys — 4 segments', where: 'Loyalty or POS customer master' });
  if(!fields.city)     gaps.push({ field: 'City or billing store per customer', unlocks: 'Tier 1 vs Tier 2 and store-catchment targeting — 2+ segments', where: 'POS customer master' });
  if(!fields.optin)    gaps.push({ field: 'Email / mobile / WhatsApp opt-in per customer', unlocks: 'Channel-reachable segments, so send size stops being guessed — 3 segments', where: 'CRM / ESP contact export' });
  if(nMonths < 6)      gaps.push({ field: '12 months of POS history', unlocks: 'True RFM recency-frequency, seasonal preference, win-back windows, repeat-rate that is not truncated', where: 'POS — request a 12-month pull' });
  gaps.push({ field: 'Web/app event stream (viewed, searched, cart)', unlocks: 'Browse abandon, cart abandon, search-intent, viewed-product and viewed-category journeys — 6 segments', where: 'CDP, GA4 BigQuery export, or the ecom platform' });
  gaps.push({ field: 'Per-customer campaign response log (customer ID on sends)', unlocks: 'Channel-engagement segments (Email/WA/Push/SMS/RCS active) and true attributed revenue', where: 'CRM/ESP — ask the agency for a customer-level send log' });

  return {
    live, fields, dyn,
    basket, next_best: nextBest,
    gaps,
    contacts: cmInfo,
    thresholds: {
      hni: rnd(p99), uhni: rnd(p999), ltv_high: rnd(p80), ltv_low: rnd(p50),
      max_date: maxD ? maxD.toISOString().slice(0,10) : null, n_months: nMonths,
      n_bills: nBills
    }
  };
}
</script>
<script>
/* ============================================================================
   CRM DASHBOARD — analysis pipeline (campaigns, behaviour segments, products,
   forecast rates). Shared helpers come from the engine block above.
   ========================================================================== */

const MALL_CITY = ['udaipur','elante','mumbai','delhi','bangalore','bengaluru','chennai','kolkata',
 'hyderabad','pune','ahmedabad','jaipur','chandigarh','lucknow','surat','indore','mall','phoenix',
 'citywalk','dlf','forum','nexus','orion','inorbit','malad','palladium','zora','felix','plaza',
 'store','vegas','ambience','seawoods','lulu','vr ','garuda','express avenue','oberoi','pacific',
 'select','sarath','gvk','quest','south city','acropolis','city centre','viviana','korum','growel',
 'infiniti','infinity','metropolis','ansal','spencer','cochin','wakad','gurgaon','ggn','noida'];

function scopeOf(t){ if(!t) return 'Unclassified';
  const l = String(t).toLowerCase();
  return MALL_CITY.some(k=>l.includes(k)) ? 'Store-Level' : 'National CRM'; }

function familyOf(t){ const x = String(t||'').toLowerCase();
  if(x.includes('birthday')) return 'Birthday';
  if(x.includes('eoss')||x.includes('sale')) return 'EOSS/Sale';
  if(x.includes('anniv')) return 'Anniversary';
  if(x.includes('lapsed')||x.includes('winback')) return 'Lapsed/Winback';
  if(x.includes('welcome')||x.includes('onboard')) return 'Welcome';
  if(x.includes('father')) return "Father's Day";
  if(x.includes('mother')) return "Mother's Day";
  return 'Other/Promo'; }

/* ---------------- campaigns ---------------- */
function analyzeCampaigns(rows){
  if(!rows || !rows.length) return null;
  const r0 = rows[0];
  const C = {
    name: pick(r0,['CampaignName','Campaign Name','campaign']),
    channel: pick(r0,['channel','medium']),
    seg: pick(r0,['segmentname','segment name','segment']),
    date: pick(r0,['CampaignScheduleDate','Send Date','date']),
    base: pick(r0,['TotalBase','Base','audience','sent']),
    dlv: pick(r0,['Delivered']),
    clk: pick(r0,['Clicked','Clicks']),
    resp: pick(r0,['Responder','Responders','converted']),
    sales: pick(r0,['ResponderSales','Responder Sales','revenue','sales']),
    cost: pick(r0,['CommunicationCost','Communication Cost','cost','spend']),
    offer: pick(r0,['OfferCost','Offer Cost','reward cost']),
    inc: pick(r0,['IncentiveType']),
    incv: pick(r0,['IncentiveValue']),
  };
  if(!C.name || !C.base) return null;

  const camps = rows.filter(r=>r[C.name]).map(r=>{
    const base=s0(r[C.base]), dlv=s0(r[C.dlv]), cost=s0(r[C.cost]),
          offer=s0(r[C.offer]), sales=s0(r[C.sales]), resp=s0(r[C.resp]);
    let dt = r[C.date];
    if(dt instanceof Date) dt = dt.toISOString().slice(0,10); else dt = String(dt||'').slice(0,10);
    return { name:String(r[C.name]), channel:String(r[C.channel]||'Unknown'),
      scope:scopeOf(r[C.name]), family:familyOf(r[C.name]),
      segment:C.seg?String(r[C.seg]||''):null, date:dt,
      base, delivered:dlv, delivery_rate: base?rnd(dlv/base,4):null,
      clicked:s0(r[C.clk]), responders:resp, sales:rnd(sales), cost:rnd(cost),
      offer_cost:rnd(offer), roas: cost?rnd(sales/cost,2):null,
      incentive:C.inc?(r[C.inc]||null):null, incentive_value:C.incv?s0(r[C.incv]):0 };
  });

  const agg = f => {
    const S=(k)=>f.reduce((a,x)=>a+(x[k]||0),0);
    const base=S('base'), dlv=S('delivered'), cost=S('cost'), offer=S('offer_cost'),
          sales=S('sales'), resp=S('responders');
    return { campaigns:f.length, base:rnd(base), delivered:rnd(dlv),
      delivery_rate: base?rnd(dlv/base,4):null, clicks:rnd(S('clicked')),
      responders:rnd(resp), sales:rnd(sales), cost:rnd(cost), offer_cost:rnd(offer),
      roas: cost?rnd(sales/cost,2):null,
      loaded_roas: (cost+offer)?rnd(sales/(cost+offer),2):null,
      response_rate: dlv?rnd(resp/dlv,6):null,
      cost_per_delivered: dlv?rnd(cost/dlv,4):null,
      cost_per_responder: resp?rnd(cost/resp):null,
      atv: resp?rnd(sales/resp):null };
  };
  const by = key => { const g={}; camps.forEach(c=>(g[c[key]]=g[c[key]]||[]).push(c));
    const o={}; Object.keys(g).forEach(k=>o[k]=agg(g[k])); return o; };
  const by2 = (k1,k2) => { const g={}; camps.forEach(c=>{const k=c[k1]+'|'+c[k2];(g[k]=g[k]||[]).push(c)});
    const o={}; Object.keys(g).forEach(k=>o[k]=agg(g[k])); return o; };

  return { overall:agg(camps), by_channel:by('channel'), by_scope:by('scope'),
    by_family:by('family'), by_channel_scope:by2('channel','scope'),
    by_channel_family:by2('channel','family'), campaigns:camps, _raw:camps };
}

function forecastRates(camps){
  const q=(arr,p)=>{ if(!arr.length) return null; const s=[...arr].sort((a,b)=>a-b);
    const i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
    return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(i-lo); };
  const rates = f => {
    f = f.filter(c=>c.delivered>0); if(!f.length) return null;
    const rr = f.map(c=>c.responders/c.delivered).filter(isFinite);
    if(!rr.length) return null;
    const atv = f.filter(c=>c.responders>0).map(c=>c.sales/c.responders).filter(isFinite);
    const B=f.reduce((a,c)=>a+c.base,0), Dl=f.reduce((a,c)=>a+c.delivered,0),
          Co=f.reduce((a,c)=>a+c.cost,0);
    return { n:f.length, dr:B?rnd(Dl/B,4):null,
      rr_low:rnd(q(rr,.25),6), rr_med:rnd(q(rr,.5),6), rr_high:rnd(q(rr,.75),6),
      atv_low:atv.length?rnd(q(atv,.25)):null, atv_med:atv.length?rnd(q(atv,.5)):null,
      atv_high:atv.length?rnd(q(atv,.75)):null,
      cost_per_delivered:Dl?rnd(Co/Dl,4):null };
  };
  const out={overall:rates(camps),by_channel:{},by_channel_scope:{},by_channel_family:{}};
  const grp=(key,fn)=>{const g={};camps.forEach(c=>{const k=fn(c);(g[k]=g[k]||[]).push(c)});
    Object.keys(g).forEach(k=>{const r=rates(g[k]); if(r) out[key][k]=r;});};
  grp('by_channel',c=>c.channel);
  grp('by_channel_scope',c=>c.channel+'|'+c.scope);
  grp('by_channel_family',c=>c.channel+'|'+c.family);
  return out;
}

/* Whether a channel is billed on sends attempted or messages delivered. This decides
   whether a delivery failure actually costs money. */
function billingBasis(g){
  const p=g.filter(c=>c.base>0&&c.cost>0);
  if(p.length<2) return {basis:'unknown',note:'too few priced campaigns to infer a billing basis'};
  const spread=a=>{ if(!a.length)return null; const s=[...a].sort((x,y)=>x-y);
    const med=s[Math.floor(s.length/2)]; return med?(s[s.length-1]-s[0])/med:null; };
  const perBase=p.map(c=>c.cost/c.base);
  const dl=p.filter(c=>c.delivered>0), perDlv=dl.map(c=>c.cost/c.delivered);
  const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
  const sb=spread(perBase), sd=spread(perDlv);
  if(sb!=null&&sb<0.02) return {basis:'per attempted send',rate:rnd(med(perBase),4),
    note:'Undelivered messages are still billed — a delivery failure is paid-for waste.'};
  if(sd!=null&&sd<0.02) return {basis:'per delivered message',rate:rnd(med(perDlv),4),
    note:'Undelivered messages are not billed — a delivery failure costs reach, not money.'};
  return {basis:'mixed/variable',rate_per_delivered_median:perDlv.length?rnd(med(perDlv),4):null,
    note:'Rates vary by campaign; treat cost as blended.'};
}

function campaignFindings(camps){
  const out={billing_basis:{}};
  const totalCost = camps.reduce((a,c)=>a+c.cost,0);
  const byCh={}; camps.forEach(c=>(byCh[c.channel]=byCh[c.channel]||[]).push(c));
  out.broken_delivery=[]; out.zero_click_channels=[]; out.cost_per_delivered={};
  Object.entries(byCh).forEach(([ch,g])=>{
    out.billing_basis[ch]=billingBasis(g);
    const broken=g.filter(c=>c.base>0 && (c.delivered/c.base)<0.05);
    const bc=broken.reduce((a,c)=>a+c.cost,0);
    if(broken.length) out.broken_delivery.push({channel:ch,campaigns:broken.length,
      of_total:g.length,wasted_spend:rnd(bc),pct_of_all_spend:totalCost?rnd(bc/totalCost,4):null,
      base:rnd(broken.reduce((a,c)=>a+c.base,0)),delivered:rnd(broken.reduce((a,c)=>a+c.delivered,0)),
      undelivered:rnd(broken.reduce((a,c)=>a+c.base-c.delivered,0)),
      billing_basis:out.billing_basis[ch].basis,
      costs_money:out.billing_basis[ch].basis==='per attempted send'});
    const dl=g.reduce((a,c)=>a+c.delivered,0);
    if(dl>0 && g.reduce((a,c)=>a+c.clicked,0)===0) out.zero_click_channels.push(ch);
    if(dl) out.cost_per_delivered[ch]=rnd(g.reduce((a,c)=>a+c.cost,0)/dl,3);
  });
  const bday=camps.filter(c=>/birthday/i.test(c.name) && c.offer_cost>0);
  if(bday.length) out.incentive_tiers=bday.map(c=>({tier:c.segment||c.name,discount:c.incentive_value,
    base:c.base,delivered:c.delivered,responders:c.responders,sales:c.sales,
    comm_cost:c.cost,offer_cost:c.offer_cost,
    loaded_roas:(c.cost+c.offer_cost)?rnd(c.sales/(c.cost+c.offer_cost),2):null}));
  return out;
}

/* ---------------- sales -> behaviour segments + products ---------------- */
function analyzeSales(salesRows, itemRows){
  if(!salesRows || !salesRows.length) return null;
  const r0=salesRows[0];
  const S={ date:pick(r0,['BillDate','Bill Date','Order Date','date']),
    bill:pick(r0,['Bill No','BillNo','Bill Number','BillNumber']),
    btype:pick(r0,['Bill Type']),
    cust:pick(r0,['CustomerCode','Customer Code','Customer ID','customer']),
    cname:pick(r0,['CustomerName','Customer Name']),
    qty:pick(r0,['Quantity','Qty']), amt:pick(r0,['Amount','Order Value','value']),
    prod:pick(r0,['AlternateProductCodes','AlternateProductCode','Product Code','EAN']),
    cat:pick(r0,['CAT_IM','CAT','Category','Product Category']),
    sub:pick(r0,['SUBCAT_IM','SUB CAT','SUBCAT','Sub Category']),
    style:pick(r0,['STYLE_IM','STYLE','Style']),
    coll:pick(r0,['COLL_IM','COLL','Collection']),
    cfnd:pick(r0,['CFND_IM','Core / Seasonal']),
    lea:pick(r0,['LEATHER_IM','Leather','Material']),
    color:pick(r0,['Color','Colour']) };
  if(!S.cust || !S.amt) return null;

  const notes=[];
  let im=null;
  if(itemRows && itemRows.length){
    const i0=itemRows[0];
    const I={ pc:pick(i0,['Product Code']), coll:pick(i0,['Collection']),
      lea:pick(i0,['Leather']), cs:pick(i0,['Core / Seasonal']),
      gender:pick(i0,['Gender']), occ:pick(i0,['OCCASION','Occasion']), mrp:pick(i0,['MRP']) };
    if(I.pc){ im={}; itemRows.forEach(r=>{ const k=String(r[I.pc]||'').trim();
      if(k && !im[k]) im[k]={collection:I.coll?r[I.coll]:null, leather:I.lea?r[I.lea]:null,
        core:I.cs?r[I.cs]:null, gender:I.gender?r[I.gender]:null,
        occasion:I.occ?r[I.occ]:null, mrp:I.mrp?nz(r[I.mrp]):null}; }); }
  }

  let rows=salesRows.map(r=>{
    const d=fixBillDate(r[S.date]);
    const pc=S.prod?String(r[S.prod]||'').trim():null;
    const en=(im&&pc&&im[pc])?im[pc]:null;
    return { date:d, bill:S.bill?String(r[S.bill]||''):'',
      btype:S.btype?String(r[S.btype]||'Sales'):'Sales',
      cust:r[S.cust], cname:String(r[S.cname]||''),
      qty:s0(r[S.qty])||1, amt:s0(r[S.amt]),
      cat:S.cat?String(r[S.cat]||'Unknown').trim():'Unknown',
      sub:S.sub?String(r[S.sub]||'').trim():'',
      style:S.style?String(r[S.style]||'').trim():'',
      coll:S.coll?(r[S.coll]?String(r[S.coll]).trim():(en?en.collection:null)):(en?en.collection:null),
      cfnd:S.cfnd?String(r[S.cfnd]||'').trim().toUpperCase():(en&&en.core?String(en.core).toUpperCase():''),
      leather:normLeather(S.lea?r[S.lea]:(en?en.leather:null)),
      color:S.color?String(r[S.color]||'').trim():'',
      occasion:en?en.occasion:null };
  }).filter(r=>r.cust!=null && r.cust!=='');

  const dates=rows.map(r=>r.date).filter(Boolean);
  let nMonths=0;
  if(dates.length){
    let mnT=Infinity, mxT=-Infinity;
    dates.forEach(d=>{ const t=+d; if(t<mnT)mnT=t; if(t>mxT)mxT=t; });
    const mn=new Date(mnT), mx=new Date(mxT);
    const months=new Set(dates.map(d=>d.getUTCFullYear()+'-'+d.getUTCMonth()));
    nMonths=months.size;
    notes.push(`Date range ${mn.toISOString().slice(0,10)} to ${mx.toISOString().slice(0,10)} (${months.size} calendar month(s) present).`);
  } else { notes.push('No usable purchase dates found.'); }

  const returns=rows.filter(r=>/return/i.test(r.btype));
  if(returns.length){ notes.push(`${returns.length} sales-return rows totalling ${Math.round(returns.reduce((a,r)=>a+r.amt,0)).toLocaleString('en-IN')} excluded (net basis).`);
    rows=rows.filter(r=>!/return/i.test(r.btype)); }

  const gross=rows.reduce((a,r)=>a+r.amt,0);
  const inst=rows.filter(r=>INSTITUTIONAL.test(r.cname));
  if(inst.length){ const ic=new Set(inst.map(r=>r.cust)).size, ia=inst.reduce((a,r)=>a+r.amt,0);
    notes.push(`${ic} institutional/internal accounts carrying ${Math.round(ia).toLocaleString('en-IN')} (${(ia/gross*100).toFixed(1)}% of gross) excluded from consumer segmentation.`); }
  const cons=rows.filter(r=>!INSTITUTIONAL.test(r.cname));
  if(!cons.length) return null;

  const up=cons.map(r=>r.qty?r.amt/r.qty:NaN).filter(isFinite).sort((a,b)=>a-b);
  const qAt=p=>up[Math.floor((up.length-1)*p)];
  const t1=qAt(.33), t2=qAt(.66);
  cons.forEach(r=>{ const p=r.qty?r.amt/r.qty:NaN;
    r.tier=!isFinite(p)?null:(p<t1?'Value':(p<t2?'Core':'Premium')); });
  notes.push(`Price tiers cut at ${Math.round(t1).toLocaleString('en-IN')} / ${Math.round(t2).toLocaleString('en-IN')} (33rd/66th pct of realised unit price).`);

  /* Free gifts are not preferences: assign dominant category from paid lines, by revenue. */
  const paid=cons.filter(r=>r.amt>0);
  const basis=paid.length?paid:cons;
  const cm=new Map();
  cons.forEach(r=>{ let c=cm.get(r.cust);
    if(!c){ c={cust:r.cust,spend:0,units:0,bills:new Set(),cats:{},last:null}; cm.set(r.cust,c); }
    c.spend+=r.amt; c.units+=r.qty; if(r.bill)c.bills.add(r.bill);
    if(r.date&&(!c.last||r.date>c.last))c.last=r.date; });
  basis.forEach(r=>{ const c=cm.get(r.cust); if(c) c.cats[r.cat]=(c.cats[r.cat]||0)+r.amt; });
  const custs=[...cm.values()];
  custs.forEach(c=>{ c.nbills=c.bills.size;
    c.domCat=Object.keys(c.cats).sort((a,b)=>c.cats[b]-c.cats[a])[0]||'Unknown'; });
  const bySpend=[...custs].sort((a,b)=>a.spend-b.spend);
  bySpend.forEach((c,i)=>{ const p=(i+1)/bySpend.length;
    c.vtier = p>0.8?'Top':(p>0.5?'Mid':'Entry'); });

  const single = custs.filter(c=>c.nbills<=1).length/custs.length;
  if(nMonths<3) notes.push(`Only ${nMonths} calendar month(s) of sales data: ${Math.round(single*100)}% of customers appear exactly once, so RFM recency/frequency and seasonal preference are NOT computable. Segments are built on purchase composition. Do not report seasonal findings from this data.`);

  custs.forEach(c=>c.key=c.domCat+' | '+c.vtier);
  const MIN=Math.max(100,Math.round(custs.length*0.01));
  let sizes=()=>{const s={};custs.forEach(c=>s[c.key]=(s[c.key]||0)+1);return s;};
  let sz=sizes();
  Object.keys(sz).filter(k=>sz[k]<MIN).forEach(k=>{
    const tier=k.split(' | ')[1];
    custs.forEach(c=>{ if(c.key===k) c.key='Other categories | '+tier; }); });
  sz=sizes();
  for(let i=0;i<40;i++){
    sz=sizes(); const keys=Object.keys(sz); if(keys.length<=1) break;
    const min=keys.reduce((a,b)=>sz[a]<sz[b]?a:b);
    if(sz[min]>=MIN) break;
    const tier=min.split(' | ')[1];
    const pool=keys.filter(k=>k!==min&&k.endsWith('| '+tier));
    const tgt=(pool.length?pool:keys.filter(k=>k!==min)).reduce((a,b)=>sz[a]>sz[b]?a:b);
    if(!tgt) break;
    custs.forEach(c=>{ if(c.key===min) c.key=tgt; });
  }

  const custKey=new Map(custs.map(c=>[c.cust,c.key]));
  cons.forEach(r=>r.segKey=custKey.get(r.cust));

  const shareOf=(arr,f)=>{ const t={}; let tot=0;
    arr.forEach(r=>{const k=f(r); if(k==null||k==='')return; t[k]=(t[k]||0)+r.qty; tot+=r.qty;});
    Object.keys(t).forEach(k=>t[k]/=tot||1); return t; };
  const catBase=shareOf(basis,r=>r.cat), leaBase=shareOf(basis,r=>r.leather), collBase=shareOf(basis,r=>r.coll);
  const totalRev=basis.reduce((a,r)=>a+r.amt,0);

  const affinity=(sub,f,base,minBase,minSeg,topn=4)=>{
    const sh=shareOf(sub,f), out=[];
    Object.keys(sh).forEach(k=>{ const b=base[k];
      if(b==null||b<minBase||sh[k]<minSeg) return;
      out.push({v:k,idx:rnd(sh[k]/b,2),share:rnd(sh[k],3)}); });
    out.sort((a,b)=>b.idx-a.idx); return out.slice(0,topn); };

  const segGroups={}; custs.forEach(c=>(segGroups[c.key]=segGroups[c.key]||[]).push(c));
  const segments=Object.keys(segGroups).map(key=>{
    const grp=segGroups[key], ids=new Set(grp.map(c=>c.cust));
    const sub=basis.filter(r=>ids.has(r.cust));
    const [cat,tier]=key.split(' | ');
    const rev=sub.reduce((a,r)=>a+r.amt,0);
    const collRev={}; sub.forEach(r=>{ if(r.coll) collRev[r.coll]=(collRev[r.coll]||0)+r.amt; });
    const styleRev={}; sub.forEach(r=>{ if(r.style){ styleRev[r.style]=styleRev[r.style]||{rev:0,units:0};
      styleRev[r.style].rev+=r.amt; styleRev[r.style].units+=r.qty; } });
    const tierMix={}; let tm=0; sub.forEach(r=>{ if(r.tier){tierMix[r.tier]=(tierMix[r.tier]||0)+1;tm++;} });
    Object.keys(tierMix).forEach(k=>tierMix[k]=rnd(tierMix[k]/tm,3));
    const titled = cat.toLowerCase().replace(/\b\w/g, m => m.toUpperCase());
    return { key, name:`${tier}-value ${titled} buyers`,
      category:cat, tier,
      size:grp.length, share_of_base:rnd(grp.length/custs.length,4),
      revenue:rnd(rev), rev_share:rnd(rev/totalRev,4),
      avg_spend:rnd(grp.reduce((a,c)=>a+c.spend,0)/grp.length),
      median_spend:rnd([...grp].sort((a,b)=>a.spend-b.spend)[Math.floor(grp.length/2)].spend),
      avg_units:rnd(grp.reduce((a,c)=>a+c.units,0)/grp.length,2),
      repeat_rate:rnd(grp.filter(c=>c.nbills>1).length/grp.length,4),
      top_categories:affinity(sub,r=>r.cat,catBase,0.005,0.05),
      top_leathers:affinity(sub,r=>r.leather,leaBase,0.01,0.03),
      top_collections:affinity(sub,r=>r.coll,collBase,0.005,0.03),
      top_collections_by_rev:Object.entries(collRev).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([v,rv])=>({v,rev:rnd(rv)})),
      top_products:Object.entries(styleRev).sort((a,b)=>b[1].rev-a[1].rev).slice(0,5).map(([v,o])=>({v,rev:rnd(o.rev),units:o.units})),
      price_tier_mix:tierMix,
      confidence:nMonths<3?'medium':'high' };
  }).sort((a,b)=>b.revenue-a.revenue);

  const topBy=(f,n=20)=>{ const g={};
    cons.forEach(r=>{ const k=f(r); if(k==null||k==='')return;
      g[k]=g[k]||{name:k,revenue:0,units:0,cs:new Set()};
      g[k].revenue+=r.amt; g[k].units+=r.qty; g[k].cs.add(r.cust); });
    return Object.values(g).map(o=>({name:o.name,revenue:rnd(o.revenue),units:rnd(o.units),customers:o.cs.size}))
      .sort((a,b)=>b.revenue-a.revenue).slice(0,n); };

  const matrix={}; cons.forEach(r=>{ if(!r.cat||!r.leather)return; const k=r.cat+'||'+r.leather;
    matrix[k]=matrix[k]||{CAT_IM:r.cat,leather:r.leather,revenue:0,units:0};
    matrix[k].revenue+=r.amt; matrix[k].units+=r.qty; });

  const daily={}; cons.forEach(r=>{ if(!r.date)return; const k=r.date.toISOString().slice(0,10);
    daily[k]=daily[k]||{date:k,revenue:0,units:0,bs:new Set()};
    daily[k].revenue+=r.amt; daily[k].units+=r.qty; if(r.bill)daily[k].bs.add(r.bill); });

  return {
    meta:{ sales_rows:cons.length, consumers:custs.length, consumer_revenue:rnd(totalRev), notes, n_months:nMonths },
    segments,
    products:{ by_category:topBy(r=>r.cat), by_subcategory:topBy(r=>r.sub), by_leather:topBy(r=>r.leather),
      by_collection:topBy(r=>r.coll), by_style:topBy(r=>r.style,25), by_color:topBy(r=>r.color,15),
      by_price_tier:topBy(r=>r.tier,5), by_core_seasonal:topBy(r=>r.cfnd,12),
      by_occasion:topBy(r=>r.occasion,12),
      category_leather_matrix:Object.values(matrix).map(o=>({...o,revenue:rnd(o.revenue),units:rnd(o.units)}))
        .sort((a,b)=>b.revenue-a.revenue).slice(0,30) },
    daily:Object.values(daily).map(o=>({date:o.date,revenue:rnd(o.revenue),units:rnd(o.units),bills:o.bs.size}))
      .sort((a,b)=>a.date<b.date?-1:1)
  };
}
</script>
<script>
/* ============================================================================
   SHARED STATE + UI HELPERS
   D holds everything: campaign analytics, behaviour segments, products, daily,
   forecast rates, findings (dashboard side) and studio, notes (segment studio
   side). C360 keeps the customer-level roll-up for the agentic tabs.
   ========================================================================== */
let D = { meta:{ caveats:[], period:null }, notes:[] };
let C360 = null;
const charts = {};

const INR = n => { if(n==null||isNaN(n))return '—'; const a=Math.abs(n);
  if(a>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if(a>=1e5) return '₹'+(n/1e5).toFixed(2)+' L';
  if(a>=1e3) return '₹'+(n/1e3).toFixed(1)+'k';
  return '₹'+Math.round(n); };
const INRfull = n => n==null||isNaN(n)?'—':'₹'+Math.round(n).toLocaleString('en-IN');
const PCT = (v,d=1) => v==null||isNaN(v)?'—':(v*100).toFixed(d)+'%';
const X   = v => v==null||isNaN(v)?'—':(v<10?v.toFixed(2):Math.round(v).toLocaleString('en-IN'))+'×';
const NUM = v => v==null||isNaN(v)?'—':Math.round(v).toLocaleString('en-IN');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = (s,n=46) => { s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; };

function kpi(l,v,s){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}
function roasBadge(r){ if(r==null)return '<span class="badge b-info">n/a</span>';
  const c=r>=20?'b-good':r>=3?'b-warn':'b-bad'; return `<span class="badge ${c}">${X(r)}</span>`; }

function table(rows, cols, opts={}){
  if(!rows||!rows.length) return '<div class="empty">No data.</div>';
  const id='t'+Math.random().toString(36).slice(2,9);
  let h=`<div class="${opts.scroll===false?'':'scroll'}"><table id="${id}"><thead><tr>`;
  cols.forEach((c,i)=>h+=`<th class="${c.num?'num':''}" data-i="${i}">${c.label}</th>`);
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{ h+='<tr>'+cols.map(c=>{
      const raw=typeof c.get==='function'?c.get(r):r[c.key];
      const disp=c.fmt?c.fmt(raw,r):esc(raw==null?'—':raw);
      let sv; if(typeof raw==='number'&&isFinite(raw))sv=raw;
      else if(typeof raw==='string')sv=esc(raw); else sv=-Infinity;
      return `<td class="${c.num?'num':''}" data-v="${sv}">${disp}</td>`;
    }).join('')+'</tr>'; });
  h+='</tbody></table></div>';
  setTimeout(()=>{ const t=document.getElementById(id); if(!t)return;
    t.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i, tb=t.tBodies[0], rs=[...tb.rows], asc=th.dataset.asc!=='1';
      t.querySelectorAll('th').forEach(o=>o.dataset.asc='');
      th.dataset.asc=asc?'1':'0';
      rs.sort((a,b)=>{ const x=a.cells[i].dataset.v,y=b.cells[i].dataset.v;
        const nx=parseFloat(x),ny=parseFloat(y);
        if(!isNaN(nx)&&!isNaN(ny))return asc?nx-ny:ny-nx;
        return asc?String(x).localeCompare(String(y)):String(y).localeCompare(String(x)); });
      rs.forEach(r=>tb.appendChild(r)); }); },0);
  return h;
}

function mkChart(id,cfg){ setTimeout(()=>{ const el=document.getElementById(id); if(!el)return;
  if(charts[id]){try{charts[id].destroy()}catch(e){}}
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options||{});
  try{ charts[id]=new Chart(el,cfg); }catch(e){ console.warn('chart',id,e); } },40); }

const PALETTE=['#B85042','#BE8A3D','#7D8C64','#6E5648','#2B1A10','#C9A227','#8C6B4F','#A3553F','#D4A574'];

/* ---------------- grouped navigation ---------------- */
const NAV=[
  ['Command centre',[['overview','Overview'],['campaigns','Campaigns'],['products','Products'],['forecast','Forecast']]],
  ['Segment studio',[['coverage','Coverage'],['seglib','Segment library'],['dsegments','Auto segments'],['basket','Basket'],['journeys','Journeys'],['gaps','Data gaps']]],
  ['Agentic layer',[['stores','Store view'],['c360','Customer 360'],['audiences','Audiences & ads'],['agent','AI agent'],['rfp','Platform Q&A']]],
  ['Data',[['upload','Load data'],['data','Data notes']]]
];
function buildTabs(){
  let h='';
  NAV.forEach(([grp,tabs])=>{
    h+=`<span class="navlbl">${grp}</span>`;
    tabs.forEach(([k,l])=>h+=`<button class="tab${k==='overview'?' active':''}" data-k="${k}">${l}</button>`);
  });
  document.getElementById('tabs').innerHTML=h;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(o=>o.classList.remove('active'));
    document.querySelectorAll('.page').forEach(o=>o.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('p-'+t.dataset.k).classList.add('active');
    setTimeout(()=>Object.values(charts).forEach(c=>{try{c.resize()}catch(e){}}),50); });
}
function goTab(k){ const b=document.querySelector('.tab[data-k="'+k+'"]'); if(b) b.click(); }
</script>
<script>
/* ============================================================================
   COMMAND CENTRE — renderers carried over from the CRM dashboard.
   ========================================================================== */
function renderOverview(){
  const el=document.getElementById('p-overview');
  if(!D.campaign && !D.segments){ el.innerHTML='<div class="panel"><div class="empty">No data loaded yet. Open <b>Load data</b>, drop in the monthly exports, and every tab on this platform builds itself.</div></div>'; return; }
  const o=D.campaign?D.campaign.overall:null, f=D.findings||{}, m=D.meta, ch=D.campaign?D.campaign.by_channel:{};
  let h='<div class="kpis">';
  if(o){ h+=kpi('Comms spend',INR(o.cost),o.campaigns+' campaigns')
        + kpi('Responder sales',INR(o.sales),NUM(o.responders)+' responders')
        + kpi('Blended ROAS',X(o.roas),'loaded '+X(o.loaded_roas))
        + kpi('Delivery rate',PCT(o.delivery_rate),NUM(o.delivered)+' of '+NUM(o.base)); }
  if(m.consumer_revenue) h+=kpi('Consumer revenue',INR(m.consumer_revenue),NUM(m.consumers)+' consumers (POS)');
  if(D.studio){ const live=Object.keys(D.studio.live||{}).length;
    h+=kpi('Live segments',NUM(live),'of the 66-segment library'); }
  h+='</div>';

  const alerts=[];
  (f.broken_delivery||[]).forEach(b=>{
    const reachPct=b.base?b.undelivered/b.base:0;
    if(b.costs_money && b.wasted_spend>0){
      alerts.push({cls:'',title:`${b.channel}: ${NUM(b.undelivered)} messages paid for but never delivered`,
        body:`${b.campaigns} of ${b.of_total} ${b.channel} campaigns delivered under 5% — ${NUM(b.base)} sends reached only ${NUM(b.delivered)} inboxes (${PCT(1-reachPct,1)} through). `
          +`${b.channel} is billed <b>per attempted send</b>, so that failure cost ${INR(b.wasted_spend)} (${PCT(b.pct_of_all_spend)} of comms spend) for nothing. `
          +`The money is small; the lost reach is not — this is your largest audience and it is not being reached.`});
    } else {
      alerts.push({cls:'warn',title:`${b.channel}: ${NUM(b.undelivered)} messages never reached anyone`,
        body:`${b.campaigns} of ${b.of_total} ${b.channel} campaigns delivered under 5%. `
          +`${b.channel} is billed per delivered message, so this cost almost nothing in budget — but ${NUM(b.undelivered)} intended contacts were never reached. A reach problem, not a spend problem.`});
    }
  });
  if(o && o.offer_cost>0 && o.cost>0 && o.offer_cost/o.cost>0.4){
    const r=o.offer_cost/o.cost;
    const rel=r>=1?`${r.toFixed(1)}× your entire comms spend`:`${Math.round(r*100)}% of your entire comms spend`;
    alerts.push({cls:'warn',title:`Incentive cost (${INR(o.offer_cost)}) is now ${rel}`,
      body:`Comms cost ${INR(o.cost)}; offers/coupons cost ${INR(o.offer_cost)}. That drops blended ROAS from ${X(o.roas)} to ${X(o.loaded_roas)} once the discount is counted. `
        +`With sending this cheap, discount depth — not channel choice — is now the main lever on profitability. Check the incentive tier table on the Campaigns tab before setting the next offer.`});
  }
  const zc=(f.zero_click_channels||[]).filter(c=>ch[c]&&ch[c].delivered>0);
  if(zc.length){
    const faulty=zc.filter(c=>(ch[c].clicks||0)===0 && c==='RCS');
    const untracked=zc.filter(c=>c!=='RCS');
    let body='';
    if(faulty.length){ const cc=ch['RCS'];
      body+=`<b>RCS</b> recorded 0 clicks across ${cc.campaigns} campaigns despite logging opens — the CTA chip fault flagged in earlier periods is still open. It still drove ${INR(cc.sales)} at ${X(cc.roas)} ROAS, so the channel works; the measurement does not. `; }
    if(untracked.length)
      body+=`<b>${untracked.join(' and ')}</b> also show zero clicks, which most likely means click tracking was never enabled on ${untracked.length>1?'those channels':'that channel'} rather than a fault. `;
    body+=`Either way, click-through cannot be used to compare these channels — judge them on delivery, responders and ROAS instead.`;
    alerts.push({cls:'warn',title:`No click data on ${zc.join(', ')} — engagement metrics unusable`,body});
  }
  const best=Object.entries(ch).filter(([,v])=>v.roas!=null).sort((a,b)=>b[1].roas-a[1].roas)[0];
  if(best && o) alerts.push({cls:'good',title:`${best[0]} returned ${X(best[1].roas)} ROAS on ${INR(best[1].cost)} of spend`,
    body:`${best[1].campaigns} campaigns, ${NUM(best[1].responders)} responders, ${INR(best[1].sales)} in sales — on ${PCT(best[1].cost/o.cost)} of the total budget.`});

  if(alerts.length){ h+='<div class="panel"><h2>What needs attention</h2>';
    alerts.forEach(a=>h+=`<div class="alert ${a.cls}"><h4>${a.title}</h4><p>${a.body}</p></div>`);
    h+='</div>'; }

  if(o){ h+='<div class="grid2">'
    +'<div class="panel"><h2>Spend vs. return by channel</h2><div class="chart"><canvas id="c-spendret"></canvas></div>'
    +'<div class="note">Spend and responder sales on the same scale. Watch for any channel where the two are inverted.</div></div>'
    +'<div class="panel"><h2>Efficiency: cost per delivered</h2><div class="chart"><canvas id="c-cpd"></canvas></div>'
    +'<div class="note">Log scale — these channels differ by orders of magnitude, not percentages.</div></div></div>'; }
  if(D.daily&&D.daily.length) h+='<div class="panel"><h2>Daily consumer revenue (POS)</h2><div class="chart"><canvas id="c-daily"></canvas></div></div>';
  el.innerHTML=h;

  if(o){ const cn=Object.keys(ch);
    mkChart('c-spendret',{type:'bar',data:{labels:cn,datasets:[
      {label:'Comms spend',data:cn.map(k=>ch[k].cost),backgroundColor:'#6E5648'},
      {label:'Responder sales',data:cn.map(k=>ch[k].sales),backgroundColor:'#B85042'}]},
      options:{plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+INR(c.raw)}}},
        scales:{y:{ticks:{callback:v=>INR(v)}}}}});
    const cpd=(D.findings||{}).cost_per_delivered||{}; const ck=Object.keys(cpd);
    if(ck.length) mkChart('c-cpd',{type:'bar',data:{labels:ck,datasets:[{data:ck.map(k=>cpd[k]),
      backgroundColor:ck.map(k=>cpd[k]===Math.max(...Object.values(cpd))?'#B85042':'#7D8C64')}]},
      options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'₹'+c.raw+' per delivered'}}},
        scales:{y:{type:'logarithmic',ticks:{callback:v=>'₹'+v}}}}}); }
  if(D.daily&&D.daily.length) mkChart('c-daily',{type:'line',data:{labels:D.daily.map(d=>d.date.slice(5)),
    datasets:[{label:'Revenue',data:D.daily.map(d=>d.revenue),borderColor:'#B85042',
      backgroundColor:'rgba(184,80,66,.12)',fill:true,tension:.3,pointRadius:2}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>INR(c.raw)}}},
      scales:{y:{ticks:{callback:v=>INR(v)}}}}});
}

function topBottom(){
  const camps=D.campaign.campaigns;
  const byCh={}; camps.forEach(c=>(byCh[c.channel]=byCh[c.channel]||[]).push(c));
  let h='<div class="panel"><h2>Top &amp; bottom performing campaigns by channel</h2>'
   +'<p style="font-size:12.5px;color:var(--slate);margin:0 0 4px">Ranked on ROAS among campaigns that actually spent money. '
   +'Campaigns that failed to deliver are pulled out separately — a campaign that reached almost nobody didn\'t underperform, '
   +'it never ran, and mixing the two hides the real problem.</p></div>';

  Object.keys(byCh).sort().forEach(ch=>{
    const all=byCh[ch];
    const broken=all.filter(c=>c.base>0 && c.delivered/c.base<0.05);
    const live=all.filter(c=>!(c.base>0 && c.delivered/c.base<0.05) && c.cost>0 && c.roas!=null);
    const ranked=[...live].sort((a,b)=>b.roas-a.roas);
    const top=ranked.slice(0,3), bottom=ranked.slice(-3).reverse();
    const chAgg=D.campaign.by_channel[ch]||{};

    h+=`<div class="panel"><h3 style="margin-top:0">${esc(ch)} <span class="note" style="margin:0">`
      +`${all.length} campaigns · ${INR(chAgg.cost)} spend · ${INR(chAgg.sales)} sales · ROAS ${X(chAgg.roas)}</span></h3>`;

    if(!ranked.length){
      h+=`<div class="alert"><h4>No rankable campaigns on ${esc(ch)}</h4><p>Every ${esc(ch)} campaign either recorded no spend or failed to deliver, so there is nothing meaningful to rank.</p></div>`;
    } else {
      h+='<div class="grid2">';
      h+='<div><div class="tb-h tb-top">Best performing</div>'
        +table(top,[{key:'name',label:'Campaign',fmt:v=>esc(short(v,44))},
          {key:'scope',label:'Scope'},{key:'delivery_rate',label:'Del%',num:1,fmt:v=>PCT(v)},
          {key:'responders',label:'Resp',num:1,fmt:NUM},{key:'sales',label:'Sales',num:1,fmt:INR},
          {key:'cost',label:'Cost',num:1,fmt:INR},{key:'roas',label:'ROAS',num:1,fmt:roasBadge}],{scroll:false})+'</div>';
      h+='<div><div class="tb-h tb-bot">Weakest performing</div>'
        +table(bottom,[{key:'name',label:'Campaign',fmt:v=>esc(short(v,44))},
          {key:'scope',label:'Scope'},{key:'delivery_rate',label:'Del%',num:1,fmt:v=>PCT(v)},
          {key:'responders',label:'Resp',num:1,fmt:NUM},{key:'sales',label:'Sales',num:1,fmt:INR},
          {key:'cost',label:'Cost',num:1,fmt:INR},{key:'roas',label:'ROAS',num:1,fmt:roasBadge}],{scroll:false})+'</div>';
      h+='</div>';
      const b=ranked[0], w=ranked[ranked.length-1];
      if(ranked.length>1) h+=`<div class="note">Spread on ${esc(ch)}: <b>${X(b.roas)}</b> (${esc(short(b.name,38))}) down to <b>${X(w.roas)}</b> (${esc(short(w.name,38))}) — a ${w.roas>0?Math.round(b.roas/w.roas)+'×':'n/a'} gap between best and worst.</div>`;
    }

    if(broken.length){
      const bc=broken.reduce((a,c)=>a+c.cost,0);
      h+=`<div class="alert" style="margin-top:11px"><h4>${broken.length} ${esc(ch)} campaign${broken.length>1?'s':''} failed to deliver — ${INR(bc)} spent</h4>`
        +`<p>Under 5% delivery. Excluded from the ranking above because their ROAS reflects a technical failure, not campaign quality.</p></div>`
        +table(broken.slice(0,8),[{key:'name',label:'Campaign',fmt:v=>esc(short(v,50))},
          {key:'base',label:'Base',num:1,fmt:NUM},{key:'delivered',label:'Delivered',num:1,fmt:NUM},
          {key:'delivery_rate',label:'Del%',num:1,fmt:v=>PCT(v,2)},{key:'cost',label:'Cost',num:1,fmt:INR}],{scroll:false});
    }
    h+='</div>';
  });

  const spend=camps.filter(c=>c.cost>0&&c.roas!=null).sort((a,b)=>b.roas-a.roas);
  if(spend.length){
    h+='<div class="grid2">';
    h+='<div class="panel"><h2>Top 10 campaigns overall (ROAS)</h2>'
      +table(spend.slice(0,10),[{key:'name',label:'Campaign',fmt:v=>esc(short(v,40))},
        {key:'channel',label:'Ch'},{key:'sales',label:'Sales',num:1,fmt:INR},
        {key:'cost',label:'Cost',num:1,fmt:INR},{key:'roas',label:'ROAS',num:1,fmt:roasBadge}],{scroll:false})+'</div>';
    h+='<div class="panel"><h2>Biggest spenders, ranked by return</h2>'
      +table([...camps].sort((a,b)=>b.cost-a.cost).slice(0,10),
        [{key:'name',label:'Campaign',fmt:v=>esc(short(v,40))},{key:'channel',label:'Ch'},
         {key:'cost',label:'Cost',num:1,fmt:INR},{key:'sales',label:'Sales',num:1,fmt:INR},
         {key:'roas',label:'ROAS',num:1,fmt:roasBadge}],{scroll:false})
      +'<div class="note">Where the budget actually went. Any campaign high on this list with a red ROAS badge is the fastest money to reclaim.</div></div>';
    h+='</div>';
  }
  return h;
}

  const R=D.forecast_rates, channels=Object.keys(R.by_channel);
  const families=[...new Set(Object.keys(R.by_channel_family).map(k=>k.split('|')[1]))];
  const preferred=channels.includes('RCS')?'RCS':channels[0];
  let h='<div class="panel"><h2>How this forecast works</h2>'
   +'<p style="font-size:12.5px;color:var(--slate);margin:0">Expected revenue = <b>audience × delivery rate × response rate × ATV</b>. '
   +'Every rate comes from an actual campaign in your data — nothing is modelled or invented. The tool matches your inputs to the narrowest comparable set it can find, '
   +'falls back to broader sets when there aren\'t at least 3 comparable campaigns, and tells you which set it used each time. Low/expected/high are the 25th, 50th and 75th percentiles.</p>'
   +'<div class="note"><b>Read the confidence label, not just the number.</b> Most matches rest on a handful of campaigns. These are planning ranges to argue with, not commitments.</div></div>';
  h+='<div class="panel"><h2>Build a forecast</h2><div class="fgrid">'
   +'<div><label>Channel</label><select id="f-ch">'+channels.map(c=>`<option${c===preferred?' selected':''}>${esc(c)}</option>`).join('')+'</select></div>'
   +'<div><label>Scope</label><select id="f-sc"><option>National CRM</option><option>Store-Level</option></select></div>'
   +'<div><label>Campaign type</label><select id="f-fam"><option value="">Any</option>'+families.map(f=>`<option>${esc(f)}</option>`).join('')+'</select></div>'
   +'<div><label>Audience size</label><input type="number" id="f-size" value="50000"></div>'
   +'<div><label>Target segment (sets ATV)</label><select id="f-seg"><option value="">Use channel ATV</option>'
     +(D.segments||[]).map(s=>`<option value="${s.avg_spend}">${esc(s.name)}</option>`).join('')+'</select></div>'
   +'<div><label>Override ATV (₹)</label><input type="number" id="f-atv" placeholder="optional"></div>'
   +'<div><button class="act" id="f-go">Forecast</button></div></div><div id="f-out"></div></div>';
  h+='<div class="panel"><h2>Reference rates by channel</h2>'
   +table(Object.entries(R.by_channel).map(([k,v])=>({channel:k,...v})),[
      {key:'channel',label:'Channel'},{key:'n',label:'Camps',num:1},
      {key:'dr',label:'Delivery',num:1,fmt:v=>PCT(v)},
      {key:'rr_low',label:'Resp low',num:1,fmt:v=>PCT(v,3)},{key:'rr_med',label:'Resp median',num:1,fmt:v=>PCT(v,3)},
      {key:'rr_high',label:'Resp high',num:1,fmt:v=>PCT(v,3)},{key:'atv_med',label:'ATV',num:1,fmt:INRfull},
      {key:'cost_per_delivered',label:'₹/deliv',num:1,fmt:v=>v==null?'—':'₹'+v.toFixed(2)}],{scroll:false})
   +'<div class="note">Response rate is responders ÷ delivered. A channel with broken delivery will show a flattering response rate computed on the tiny fraction that got through — the delivery column is where it actually fails.</div></div>';
  el.innerHTML=h;
  const segSel=document.getElementById('f-seg');
  if(segSel) segSel.onchange=e=>{ if(e.target.value) document.getElementById('f-atv').value=Math.round(e.target.value); };
  document.getElementById('f-go').onclick=runForecast;
  runForecast();
}

function runForecast(){
  const R=D.forecast_rates, out=document.getElementById('f-out');
  if(!out||!R) return;
  const ch=document.getElementById('f-ch').value, sc=document.getElementById('f-sc').value,
        fam=document.getElementById('f-fam').value,
        size=parseFloat(document.getElementById('f-size').value),
        atvOv=parseFloat(document.getElementById('f-atv').value);
  if(!size||size<=0){ out.innerHTML='<div class="note">Enter an audience size.</div>'; return; }
  const tiers=[];
  if(fam) tiers.push([`${ch} + ${fam} campaigns`,R.by_channel_family[ch+'|'+fam]]);
  tiers.push([`${ch} + ${sc}`,R.by_channel_scope[ch+'|'+sc]]);
  tiers.push([`${ch}, all campaigns`,R.by_channel[ch]]);
  tiers.push(['All channels combined',R.overall]);
  let used=null,label='',weak=false;
  for(const [l,r] of tiers){ if(r&&r.n>=3){used=r;label=l;break;} }
  if(!used) for(const [l,r] of tiers){ if(r){used=r;label=l;weak=true;break;} }
  if(!used){ out.innerHTML='<div class="note">No comparable campaigns found.</div>'; return; }
  const atv=atvOv||used.atv_med||R.overall.atv_med, dr=used.dr||1;
  const conf=(weak||used.n<3)?'low':(used.n>=5&&!/all campaigns|All channels/.test(label)?'high':'medium');
  let h=`<div class="note" style="margin-top:12px">Matched on: <b>${esc(label)}</b> · ${used.n} campaign${used.n===1?'':'s'} · confidence <span class="badge ${conf==='high'?'b-good':conf==='medium'?'b-warn':'b-bad'}">${conf}</span></div>`;
  if(!used.rr_med){ h+=`<div class="alert" style="margin-top:11px"><h4>No usable response rate for this combination</h4>
    <p>Half or more of the ${used.n} comparable ${esc(ch)} campaigns recorded zero responders — typically a delivery failure rather than genuine disinterest.
    A forecast built on this would be meaningless. Fix delivery first, or pick a channel with working measurement.</p></div>`;
    out.innerHTML=h; return; }
  const rL=size*dr*used.rr_low, rM=size*dr*used.rr_med, rH=size*dr*used.rr_high;
  const cost=used.cost_per_delivered!=null?size*dr*used.cost_per_delivered:null;
  h+='<div class="frange">'
   +`<div><div class="fl">LOW</div><div class="fv">${INR(rL*atv)}</div></div>`
   +`<div><div class="fl">EXPECTED</div><div class="fv">${INR(rM*atv)}</div></div>`
   +`<div><div class="fl">HIGH</div><div class="fv">${INR(rH*atv)}</div></div>`
   +(cost!=null?`<div style="background:var(--slate)"><div class="fl">EST. COST</div><div class="fv">${INR(cost)}</div></div>`:'')
   +(cost?`<div style="background:var(--sage)"><div class="fl">EXPECTED ROAS</div><div class="fv">${X(rM*atv/cost)}</div></div>`:'')
   +'</div>'
   +`<div class="note">Assumes ${NUM(size)} sent → ${PCT(dr)} delivered (${NUM(size*dr)} reached) → ${PCT(used.rr_med,3)} respond (${Math.round(rM)} responders) → ₹${NUM(atv)} average transaction value.${conf==='low'?' <b>Thin evidence — run a small test send before committing budget.</b>':''}</div>`;
  out.innerHTML=h;
}

   +'<li><b>Customer IDs on campaign responders</b> — would let campaign response join to POS purchases, turning segment revenue and campaign revenue into one attributed funnel instead of two parallel views.</li>'
   +'<li><b>Holdout / control groups</b> — without them, responder sales cannot be separated from purchases that would have happened anyway, so every ROAS here is gross, not incremental.</li>'
   +(f.broken_delivery&&f.broken_delivery.length?'<li><b>Billing detail for '+esc(f.broken_delivery[0].channel)+'</b> — to confirm whether the '+INR(f.broken_delivery[0].wasted_spend)+' was billed on sends attempted or inboxes reached.</li>':'')
   +'<li><b>WhatsApp delivery and cost tracking</b> — low delivery there may be a real problem or a reporting gap; the tracking makes it hard to tell them apart.</li>'
   +'</ul></div>';

  h+='<div class="panel"><h2>How the numbers are defined</h2><ul class="caveats">'
   +'<li><b>Delivery rate</b> is weighted: sum(Delivered) ÷ sum(Base), never an average of per-campaign rates.</li>'
   +'<li><b>ROAS</b> is responder sales ÷ communication cost. <b>Loaded ROAS</b> adds offer/coupon cost.</li>'
   +'<li><b>Scope</b> is read from the campaign title — a location or mall name makes it Store-Level, otherwise National CRM.</li>'
   +'<li><b>Affinity index</b> is the segment\'s share of a category or leather divided by the whole base\'s share. 2.0× means twice the base rate.</li>'
   +'<li><b>Auto segments</b> are dominant purchase category × spend tier, with undersized groups folded into the nearest neighbour so every segment is large enough to target.</li>'
   +'<li><b>Library segments</b> are the rule-based 66-segment CRM brief, computed on paid lines only.</li>'
   +'</ul></div>';
  document.getElementById('p-data').innerHTML=h;
}

    + '<div class="seg" style="border-left-color:var(--gold)"><h4>' + c.missing + ' need one column</h4>'
    + '<div class="r">Occasion, gender, MRP, loyalty tier, city, contactability. Each is a field on a file somebody already exports — '
    + 'no integration, no licence, no vendor conversation. This is the highest return-per-effort work on the whole list.</div>'
    + '<div class="r" style="margin-top:6px"><b>Cost: a request email. Timeline: next cycle.</b></div></div>'
    + '<div class="seg" style="border-left-color:var(--terracotta)"><h4>' + c.blocked + ' need real investment</h4>'
    + '<div class="r">Browse, search, cart, product views, and per-customer engagement history. All of it needs a web/app event stream joined to customer ID, '
    + 'plus a customer-level send log from the agency. Worth doing — it is where the highest-converting journeys live — but it is a budgeted project, not a request.</div>'
    + '<div class="r" style="margin-top:6px"><b>Cost: CDP or GA4→BigQuery build. Timeline: a quarter.</b></div></div>'
    + '</div></div>';

  const gs = GROUPS.map(([gid,gname]) => {
    const rows = SEGMENT_LIBRARY.filter(e => e.g === gid);
    const st = rows.map(e => studioStatus(e, ST));
    const L = ST && ST.live ? rows.map(e => ST.live[e.id]).filter(Boolean) : [];
    return { area:gname, total:rows.length,
      live:st.filter(s => s==='live').length,
      blocked:st.filter(s => s==='missing'||s==='blocked').length,
      reach:L.length ? NUM(Math.max.apply(null, L.map(o => o.size))) : '',
      note:rows.filter(e => studioStatus(e,ST)==='missing'||studioStatus(e,ST)==='blocked')
        .map(e => NEED_LABEL[e.need]).filter((v,i,a) => v && a.indexOf(v)===i).join(', ') };
  });
  h += '<div class="panel"><h2>Coverage by area</h2>'
    + table(gs, [
        { key:'area', label:'Area' },
        { key:'total', label:'Segments', num:1 },
        { key:'live', label:'Live', num:1 },
        { key:'blocked', label:'Blocked', num:1 },
        { key:'reach', label:'Largest audience', num:1, fmt:v => v || '' },
        { key:'note', label:'What is missing', fmt:v => v ? esc(v) : '<span style="color:var(--sage)">nothing</span>' }
      ], { scroll:false }) + '</div>';

  if(D.notes && D.notes.length)
    h += '<div class="panel"><h2>How your file was read</h2><ul class="caveats">'
      + D.notes.map(n => '<li>'+esc(n)+'</li>').join('') + '</ul></div>';

  document.getElementById('p-coverage').innerHTML = h;
}

function renderLibrary(){

  GROUPS.forEach(([gid, gname, gdesc]) => {

      + liveN + ' of ' + rows.length + ' live</span></h2>'

    const disp = rows.map(e => {
      const st = studioStatus(e, ST);
      const L  = ST && ST.live ? ST.live[e.id] : null;
      const m  = STATUS_META[st];
      return { name:e.n,
        status:'<span class="badge '+m[0]+'">'+m[1]+'</span>',
        size:L?L.size:null, rev:L?L.revenue:null, avg:L?L.avg_spend:null, rep:L?L.repeat_rate:null,

        ch:e.ch, jr:e.jr };

      { key:'status', label:'Status', fmt:v => v },
      { key:'size',   label:'Customers', num:1, fmt:v => v==null?'':NUM(v) },
      { key:'rev',    label:'Revenue',   num:1, fmt:v => v==null?'':INR(v) },
      { key:'avg',    label:'Avg spend', num:1, fmt:v => v==null?'':INRfull(v) },
      { key:'rep',    label:'Repeat',    num:1, fmt:v => v==null?'':PCT(v,0) },
      { key:'need',   label:'Data needed', fmt:v => v },
      { key:'ch',     label:'Channel' },
      { key:'jr',     label:'Journey' }
    ], { scroll: rows.length > 9 });

    h += '<div style="margin-top:12px" class="grid3">';
    rows.forEach(e => {
      const st = studioStatus(e, ST);
      const L  = ST && ST.live ? ST.live[e.id] : null;
      const col = st==='live' ? 'var(--sage)' : (st==='missing' ? 'var(--gold)'
                : (st==='blocked' ? 'var(--terracotta)' : 'var(--slate)'));
      h += '<div class="seg" style="border-left-color:'+col+'"><h4>'+esc(e.n)+'</h4>'
        + '<div class="r">'+esc(e.def)+'</div>';
      if(L){
        h += '<div class="r" style="margin-top:6px">Size <b>'+NUM(L.size)+'</b> ('+PCT(L.share)+' of base) · revenue <b>'
          + INR(L.revenue)+'</b> ('+PCT(L.rev_share)+' of consumer revenue)</div>'
          + '<div class="r">Avg spend <b>'+INRfull(L.avg_spend)+'</b> · '+L.avg_units+' items · repeat <b>'+PCT(L.repeat_rate,0)+'</b></div>';
        if(L.top_styles && L.top_styles.length)

        h += '<div class="r" style="margin-top:6px;color:var(--slate)"><i>The field is present but nobody matched — worth checking how this category is named in the file.</i></div>';

          + '<div class="note">"Spent on this" is what the group spent on that value; "their total spend" is everything they bought. '
          + 'A small gap means the preference is central to them and worth leading a campaign with — a large gap means it was incidental.</div></div>';

function renderBasket(){
  const ST = D.studio;
  let h = '';
  if(!ST || !ST.basket || !ST.basket.length){
    h = '<div class="panel"><div class="empty">Basket analysis needs a sales file with a Bill No column. Load one on the <b>Load data</b> tab.</div></div>';
    document.getElementById('p-basket').innerHTML = h; return;
  }
  h += '<div class="panel"><h2>What gets bought together</h2>'
    + '<p style="font-size:12.5px;color:var(--slate);margin:0 0 10px">Bill-level co-purchase across <b>'
    + NUM(ST.thresholds.n_bills) + '</b> bills. <b>Lift</b> is how much more often two categories land on the same bill than chance predicts — '
    + 'anything above 1.0 is a real association, and the further above, the stronger. <b>A → B</b> is the probability of buying B given A, '
    + 'which is the number to size an attach campaign on. Pairs appearing on fewer than 5 bills are dropped so coincidences cannot look like patterns.</p>'
    + table(ST.basket, [
        { key:'a', label:'Category A' }, { key:'b', label:'Category B' },
        { key:'bills', label:'Bills together', num:1, fmt:NUM },
        { key:'lift', label:'Lift', num:1, fmt:v => v+'×' },
        { key:'conf_a_to_b', label:'A → B', num:1, fmt:v => PCT(v,0) },
        { key:'conf_b_to_a', label:'B → A', num:1, fmt:v => PCT(v,0) }
      ]) + '</div>';

  if(ST.next_best && ST.next_best.length)
    h += '<div class="panel"><h2>Next-best category, by what they already own</h2>'
      + table(ST.next_best, [
          { key:'from', label:'They bought' }, { key:'to', label:'Send them' },
          { key:'conf', label:'Attach rate', num:1, fmt:v => PCT(v,0) },
          { key:'bills', label:'Evidence (bills)', num:1, fmt:NUM }
        ], { scroll:false })
      + '<div class="note"><b>Use this as the post-purchase journey rule:</b> 7–14 days after a purchase in the left column, send the right column. '
      + 'It replaces a guess about what to cross-sell with a measured attach rate. '
      + '<b>Caveat worth stating out loud:</b> this is same-bill co-purchase, not sequential purchase. It tells you what people buy together in one visit, '
      + 'which is a good proxy for what to attach — but with 12 months of history the same maths becomes a true next-purchase prediction, which is strictly better.</div></div>';

  h += '<div class="panel"><h2>How to turn this into campaigns</h2><ul class="caveats">'
    + '<li><b>Attach campaign.</b> Take the highest-confidence pair, target buyers of A who have never bought B, send 7–14 days post-purchase. This is the single easiest revenue on the list.</li>'
    + '<li><b>Bundle construction.</b> High-lift pairs are the bundles worth merchandising — they are already being bought together without any prompting, so a bundle only has to remove friction, not create demand.</li>'
    + '<li><b>Single-category rescue.</b> Cross the pair table with the Single-category buyers segment. Those customers have a demonstrated adjacency they have never acted on, and they are the largest expansion pool you have.</li>'
    + '<li><b>What not to do.</b> Do not send the attach offer to someone who already owns both. It is the fastest way to make a well-targeted programme look like a blast.</li>'
    + '</ul></div>';
  document.getElementById('p-basket').innerHTML = h;
}

function renderJourneys(){
  const ST = D.studio;
  const rows = JOURNEYS.map(j => {

  let h = '<div class="panel"><h2>What to build, in order</h2>'
    + '<p style="font-size:12.5px;color:var(--slate);margin:0 0 10px">Ordered by return against effort. Everything in Phase 1 runs on data already in hand — '
    + 'no request to anybody, no budget. Phase 2 needs one column each. Phase 3 is a real project and should be argued for as one.</p>'
    + table(rows, [
        { key:'p', label:'Phase' }, { key:'j', label:'Journey' }, { key:'a', label:'Audience' },
        { key:'size', label:'Size today', num:1, fmt:v => v==null?'—':NUM(v) },
        { key:'t', label:'Trigger' }, { key:'c', label:'Channel order' },
        { key:'w', label:'Why it earns its place' }
      ], { scroll:false }) + '</div>';

  h += '<div class="panel"><h2>Two rules that decide whether any of this can be proved</h2><ul class="caveats">'
    + '<li><b>Hold out 10% of every segment.</b> Without a control group, a segmented send that beats a blast may simply be reaching people who were going to buy anyway. '
    + 'Every ROAS currently reported is gross for exactly that reason. A holdout costs nothing and it is the only thing that converts "the segment performed well" into "the segment caused the revenue" — '
    + 'which is the difference between a report and a business case.</li>'
    + '<li><b>Put CustomerCode on the send log.</b> Campaign reports carry segment names, not customer IDs, so campaign response cannot be joined to POS purchases. '
    + 'Until that changes, segment revenue and campaign revenue stay two parallel views that can never be reconciled — and roughly half the segments in this library can be built but never measured. '
    + 'This is a one-line ask to the agency and it is the highest-leverage thing on this page.</li>'

    + '</ul></div>';

}

    + '<div class="seg" style="border-left-color:var(--terracotta)"><h4>To the CRM agency</h4>'
    + '<div class="r">Please provide a <b>customer-level send log</b> — CustomerCode, campaign, channel, sent/delivered/opened/clicked — not just campaign totals. '

    + '<div class="seg" style="border-left-color:var(--sage)"><h4>To POS reporting</h4>'
    + '<div class="r">A <b>12-month</b> sales pull rather than a single month. Recency, frequency, seasonal preference and true repeat rate are all currently truncated by the window, '
    + 'not by customer behaviour. This is a query parameter, not a build.</div></div>'
    + '</div></div>';

  document.getElementById('p-gaps').innerHTML = h;
